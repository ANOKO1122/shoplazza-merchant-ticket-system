# 将本段并入 chat.thinkpro.top 的 server { } 中（或 include 本文件）
# 目的：反代 Docker 中的 mabang-bridge（默认宿主机 127.0.0.1:4000），降低 502 / 超时
#
# 若你当前已有 location /bridge-api/，请把下列 proxy_* 超时与缓冲策略合并进去，避免仅「偶发 502」。

location /bridge-api/ {
    proxy_pass http://127.0.0.1:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 桥接 /sync 会立即返回 200，但偶发上游抖动时需足够连接/读超时
    proxy_connect_timeout 15s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
}
