server {
    listen 80;
    server_name chat.thinkpro.top;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name chat.thinkpro.top;

    ssl_certificate /etc/letsencrypt/live/chat.thinkpro.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.thinkpro.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location /bridge-api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /bridge/open-sync.js {
        proxy_pass http://127.0.0.1:4000/chatwoot/open-sync.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /bridge/open-sync-config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 "window.__SHOPLAZZA_BRIDGE_BASE__='https://chat.thinkpro.top/bridge-api';window.__SHOPLAZZA_SYNC_TOKEN__='3f9aec75e09db380286e5a9f73f89fae86aeb95d3a87108df5dc77e3308cdeb4';";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '<script src="/bridge/open-sync-config.js"></script><script src="/bridge/open-sync.js" defer></script></head>';
    }
}
