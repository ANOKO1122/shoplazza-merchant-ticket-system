# support-nginx: 工单系统独立入口
# HTTP (80) → 宿主机映射 4000:80
# HTTPS (443) → 宿主机映射 8443:443
# 上游 support-bridge 在 support_net 内，通过容器名访问

# 回调密钥和顾客令牌在 query 中，访问日志不记录 query / Referer。
log_format support_safe '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent';

# HTTP → 重定向到 HTTPS
server {
    listen 80;
    server_name server.clientservice-center.com;
    access_log /var/log/nginx/access.log support_safe;

    # Let's Encrypt HTTP-01 challenge（必须在 HTTPS 重定向之前处理）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name server.clientservice-center.com;
    # A customer-domain TLS connection cannot switch into the staff vhost.
    if ($ssl_server_name = us-seel.com) { return 421; }
    access_log /var/log/nginx/access.log support_safe;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Docker 内置 DNS。proxy_pass 使用变量时才会按 TTL 重新解析，避免容器重建后仍打向旧 IP。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 兼容公网入口将 HTTP challenge 重定向到 HTTPS
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Mailpit 邮件调试面板（客服专用）
    location = /_mailpit_auth {
        internal;
        set $bridge_auth_upstream support-bridge:4001;
        proxy_pass http://$bridge_auth_upstream/api/admin/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /mailpit/ {
        auth_request /_mailpit_auth;
        error_page 401 = @mailpit_login;
        set $mailpit_upstream mailpit:8025;
        proxy_pass http://$mailpit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location @mailpit_login {
        return 302 /login;
    }

    # 回调地址包含密钥；Nginx 错误日志也会记录完整 request/upstream URL。
    # 此路径仅保留上面的脱敏访问日志，业务错误由应用同步日志追踪。
    location ^~ /api/shoplazza/webhook/ {
        error_log /dev/null;
        set $webhook_upstream support-bridge:4001;
        proxy_pass http://$webhook_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Preference capabilities must not appear in nginx error URLs.
    location = /email-preferences {
        error_log /dev/null;
        client_max_body_size 2k;
        set $preference_upstream support-bridge:4001;
        proxy_pass http://$preference_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # 反代到同网络的 support-bridge 容器
    location / {
        set $bridge_upstream support-bridge:4001;
        proxy_pass http://$bridge_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    client_max_body_size 50m;
}

# BEGIN US-SEEL CUSTOMER ENTRY
# Customer protection portal. Activate this HTTPS block only after issuing the
# independent us-seel.com certificate; see opsdocs/us-seel-domain.md.
server {
    listen 80;
    server_name us-seel.com;
    access_log /var/log/nginx/access.log support_safe;
    error_log /dev/null;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://us-seel.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name us-seel.com;
    access_log /var/log/nginx/access.log support_safe;
    # Customer tokens can occur in URLs; never log request/upstream URLs on errors.
    error_log /dev/null;

    ssl_certificate     /etc/nginx/ssl/us-seel.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/us-seel.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $protection_upstream support-bridge:4001;
    proxy_http_version 1.1;
    proxy_set_header Host us-seel.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    client_max_body_size 64k;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location = / {
        proxy_pass http://$protection_upstream;
    }

    location = /protection {
        # Serve the customer root directly; avoid the existing static
        # /protection asset directory redirecting this entry to a trailing slash.
        proxy_pass http://$protection_upstream/$is_args$args;
    }

    location = /protection/photo-requirements {
        proxy_pass http://$protection_upstream;
    }

    location = /protection/help {
        proxy_pass http://$protection_upstream;
    }

    location = /protection/privacy {
        proxy_pass http://$protection_upstream;
    }

    location = /assets/protection-parcel-hero.webp {
        proxy_pass http://$protection_upstream;
    }

    location = /assets/protection-help.css {
        proxy_pass http://$protection_upstream;
    }

    # Confirmation is a read-only GET; the form POST changes only the token's
    # email category. Query tokens stay out of the safe access/error logs above.
    location = /email-preferences {
        proxy_pass http://$protection_upstream;
    }

    location ~ ^/assets/customer-protection\.(js|css)$ {
        proxy_pass http://$protection_upstream;
    }

    # Public customer tutorials only; uploads and all other assets stay private.
    location = /assets/protection-location-ios.png {
        proxy_pass http://$protection_upstream;
    }

    location = /assets/protection-location-android.png {
        proxy_pass http://$protection_upstream;
    }

    location = /assets/protection-photo-guidelines.png {
        proxy_pass http://$protection_upstream;
    }

    location = /assets/protection-camera-ios.png {
        proxy_pass http://$protection_upstream;
    }

    location = /assets/protection-camera-android.png {
        proxy_pass http://$protection_upstream;
    }

    location = /assets/protection-example-package.jpg {
        proxy_pass http://$protection_upstream;
    }

    location = /assets/protection-example-item.jpg {
        proxy_pass http://$protection_upstream;
    }

    # One 25 MiB evidence file plus multipart framing. Other JSON routes retain
    # the smaller server-wide limit.
    location = /api/protection/evidence {
        client_max_body_size 26m;
        proxy_pass http://$protection_upstream;
    }

    location ^~ /api/protection/ {
        proxy_pass http://$protection_upstream;
    }

    # Deny by default: admin, support, uploads, mailpit and every other route
    # remain on the existing staff domain and never reach the application here.
    location / {
        return 404;
    }
}

# END US-SEEL CUSTOMER ENTRY
