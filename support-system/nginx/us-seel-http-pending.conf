# Bootstrap only: append to support-nginx.conf before DNS/TLS issuance.
# Replace this block with the complete customer vhosts when the certificate exists.
server {
    listen 80;
    server_name us-seel.com;
    access_log /var/log/nginx/access.log support_safe;
    error_log /dev/null;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "Customer protection portal is not available yet.\n";
    }
}
