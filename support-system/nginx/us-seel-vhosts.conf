# Customer protection portal. Activate this HTTPS block only after issuing the
# independent us-seel.com certificate; see opsdocs/us-seel-domain.md.
server {
    listen 80;
    server_name us-seel.com;
    access_log /var/log/nginx/access.log support_safe;
    error_log /dev/null;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://us-seel.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name us-seel.com;
    access_log /var/log/nginx/access.log support_safe;
    # Customer tokens can occur in URLs; never log request/upstream URLs on errors.
    error_log /dev/null;

    ssl_certificate     /etc/nginx/ssl/us-seel.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/us-seel.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $protection_upstream support-bridge:4001;
    proxy_http_version 1.1;
    proxy_set_header Host us-seel.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    client_max_body_size 64k;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location = / {
        proxy_pass http://$protection_upstream;
    }

    location = /protection {
        # Serve the customer root directly; avoid the existing static
        # /protection asset directory redirecting this entry to a trailing slash.
        proxy_pass http://$protection_upstream/$is_args$args;
    }

    location = /protection/photo-requirements {
        proxy_pass http://$protection_upstream;
    }

    location = /protection/help {
        proxy_pass http://$protection_upstream;
    }

    location = /assets/protection-help.css {
        proxy_pass http://$protection_upstream;
    }

    # Confirmation is a read-only GET; the form POST changes only the token's
    # email category. Query tokens stay out of the safe access/error logs above.
    location = /email-preferences {
        proxy_pass http://$protection_upstream;
    }

    location ~ ^/assets/customer-protection\.(js|css)$ {
        proxy_pass http://$protection_upstream;
    }

    # Public customer tutorials only; uploads and all other assets stay private.
    location = /assets/protection-location-ios.png {
        proxy_pass http://$protection_upstream;
    }

    location = /assets/protection-location-android.png {
        proxy_pass http://$protection_upstream;
    }

    location = /assets/protection-photo-guidelines.png {
        proxy_pass http://$protection_upstream;
    }

    location = /assets/protection-camera-ios.png {
        proxy_pass http://$protection_upstream;
    }

    location = /assets/protection-camera-android.png {
        proxy_pass http://$protection_upstream;
    }

    location = /assets/protection-example-package.jpg {
        proxy_pass http://$protection_upstream;
    }

    location = /assets/protection-example-item.jpg {
        proxy_pass http://$protection_upstream;
    }

    # One 25 MiB evidence file plus multipart framing. Other JSON routes retain
    # the smaller server-wide limit.
    location = /api/protection/evidence {
        client_max_body_size 26m;
        proxy_pass http://$protection_upstream;
    }

    location ^~ /api/protection/ {
        proxy_pass http://$protection_upstream;
    }

    # Deny by default: admin, support, uploads, mailpit and every other route
    # remain on the existing staff domain and never reach the application here.
    location / {
        return 404;
    }
}
