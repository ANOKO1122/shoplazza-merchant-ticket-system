# Add this server to /root/work/FB-Ad-Logic-Engine/deploy/nginx-fb-ad-docker.conf.
# Port 80 belongs to fb-ad-nginx; support-nginx receives this hostname on :4000.
server {
    listen 80;
    server_name us-seel.com;
    # Customer URLs may contain tokens. The support ingress logs only $uri.
    access_log off;
    error_log /dev/null;
    location / {
        proxy_pass http://172.17.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host us-seel.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }
}
