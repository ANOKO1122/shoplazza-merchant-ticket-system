<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服后台 - 登录</title>
<link rel="stylesheet" href="/admin-base.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <h1>客服后台</h1>
    <div id="loginErr" class="error-msg" style="display:none"></div>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="loginUser" placeholder="admin" autofocus>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="loginPwd" placeholder="密码">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">登录</button>
  </div>
</div>
<script>
var API = '/api/admin';
function $(s){ return document.querySelector(s); }

// 检查是否已登录 — 若已登录直接跳回目标页
(async function(){
  try {
    var r = await fetch(API + '/me', { credentials: 'same-origin' });
    var d = await r.json();
    if (d.ok) {
      var redir = new URLSearchParams(location.search).get('redirect') || '/thinkpro-admin';
      location.replace(redir);
    }
  } catch(e) {}
})();

async function doLogin() {
  var u = $('#loginUser').value.trim();
  var p = $('#loginPwd').value.trim();
  if (!u || !p) return;

  var btn = document.querySelector('.btn-primary');
  btn.disabled = true; btn.textContent = '登录中...';

  try {
    var r = await fetch(API + '/login', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    var d = await r.json();
    if (d.ok) {
      var redir = new URLSearchParams(location.search).get('redirect') || '/thinkpro-admin';
      location.replace(redir);
    } else {
      var e = $('#loginErr');
      e.textContent = d.error || '登录失败';
      e.style.display = 'block';
    }
  } catch(e) {
    var e = $('#loginErr');
    e.textContent = '网络错误，请检查连接';
    e.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = '登录';
}

// 回车登录
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
