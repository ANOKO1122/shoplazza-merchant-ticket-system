<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服后台 - 登录</title>
<link rel="stylesheet" href="/admin-base.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <h1>客服后台</h1>
    <div id="loginErr" class="error-msg" style="display:none"></div>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="loginUser" placeholder="admin" autofocus>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="loginPwd" placeholder="密码">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">登录</button>
  </div>
</div>
<script>
var API = '/api/admin';
var ADMIN_HOME = '/thinkpro-admin';
function $(s){ return document.querySelector(s); }

// 只允许跳回后台已知地址：
// 1) 防开放重定向 / javascript: 注入（redirect 参数可被伪造）
// 2) 清理从聊天工具、Markdown 表格、文档里复制链接带进来的尾部杂字符（如 | ），
//    否则 location.replace() 会跳到不存在的路径，被服务端兜底 404 拦成 "Not Found"
function safeRedirect(){
  var raw = new URLSearchParams(location.search).get('redirect') || '';
  try { raw = decodeURIComponent(raw); } catch(e) {}
  var p = String(raw).split('#')[0].split('?')[0].trim()
            .replace(/\\/g, '/').replace(/\/{2,}/g, '/');
  p = p.replace(/[\s|"'`<>“”‘’]+$/g, '').replace(/\/+$/g, '');
  if (p.indexOf('/') !== 0 || p.indexOf('//') === 0) return ADMIN_HOME;
  if (/[\s\\|"'`<>]/.test(p)) return ADMIN_HOME;
  if (!/^\/thinkpro-admin(\/[A-Za-z0-9._-]+)*$/.test(p)) return ADMIN_HOME;
  return p;
}

function showErr(msg){
  var e = $('#loginErr');
  e.textContent = msg;
  e.style.display = 'block';
}

// 检查是否已登录 — 若已登录直接跳回目标页
(async function(){
  try {
    var r = await fetch(API + '/me', { credentials: 'same-origin' });
    var d = await r.json();
    if (d.ok) location.replace(safeRedirect());
  } catch(e) {}
})();

async function doLogin() {
  var u = $('#loginUser').value.trim();
  var p = $('#loginPwd').value.trim();
  if (!u || !p) return;

  var btn = document.querySelector('.btn-primary');
  btn.disabled = true; btn.textContent = '登录中...';

  try {
    var r = await fetch(API + '/login', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    var d = await r.json();
    if (d.ok) {
      // 会话可能没落地（浏览器禁用 Cookie / 隐私模式拦截），先确认再跳，
      // 否则会出现“登录页 ↔ 后台”来回跳、看起来像跳到坏页面
      var sessionOk = null;
      try {
        var r2 = await fetch(API + '/me', { credentials: 'same-origin' });
        var d2 = await r2.json();
        sessionOk = !!d2.ok;
      } catch(e) { sessionOk = null; }
      if (sessionOk === false) {
        showErr('登录成功，但浏览器未保存登录状态，请检查是否禁用了 Cookie 或处于隐私模式');
        btn.disabled = false; btn.textContent = '登录';
        return;
      }
      location.replace(safeRedirect());
      return;
    }
    showErr(d.error || '登录失败');
  } catch(e) {
    showErr('网络错误，请检查连接');
  }
  btn.disabled = false; btn.textContent = '登录';
}

// 回车登录
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
