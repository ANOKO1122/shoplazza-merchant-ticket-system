<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>邮件退订 · 客服后台</title>
  <link rel="stylesheet" href="/admin-base.css">
  <script src="/safe-render.js"></script>
  <script src="/admin-shell.js"></script>
  <style>
    .ep-page { flex: 1; min-height: 0; overflow: auto; padding: 24px; color: var(--text-main); }
    .ep-page h1 { font-size: 20px; line-height: 1.4; margin-bottom: 6px; }
    .ep-description, .ep-meta, .ep-hint { color: var(--text-secondary); font-size: 13px; }
    .ep-description { max-width: 70ch; }
    .ep-summary { display: flex; flex-wrap: wrap; gap: 12px 32px; margin: 20px 0 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border-strong); }
    .ep-summary div { display: flex; align-items: baseline; gap: 10px; }
    .ep-summary dt { color: var(--text-secondary); font-size: 13px; }
    .ep-summary dd { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .ep-controls { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; margin-bottom: 16px; }
    .ep-search label, .ep-categories legend { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
    .ep-search-row { display: flex; gap: 8px; }
    .ep-search input { width: 280px; max-width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 4px; font: inherit; background: var(--bg-card); caret-color: #096dd9; }
    .ep-search input::placeholder { color: var(--text-secondary); }
    .ep-categories { border: 0; min-width: 0; }
    .ep-category-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .ep-page button { min-height: 36px; font: inherit; }
    .ep-page .filter-btn { font-size: 13px; }
    .ep-page .filter-btn.active, .ep-page .btn-sm-primary { background: #096dd9; border-color: #096dd9; color: #fff; }
    .ep-page button:hover:not(:disabled) { border-color: #096dd9; }
    .ep-page button:disabled { opacity: .55; cursor: not-allowed; }
    .ep-page :focus-visible { outline: 2px solid #096dd9; outline-offset: 3px; }
    .ep-page ::selection { background: #bae7ff; color: #003a8c; }
    .ep-results { background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; }
    .ep-result-heading { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .ep-result-heading h2 { font-size: 14px; font-weight: 600; }
    .ep-table { width: 100%; table-layout: fixed; }
    .ep-table th, .ep-table td { text-align: left; padding: 14px 16px; }
    .ep-table th:first-child { width: 42%; }
    .ep-table tr { cursor: default; }
    .ep-table tbody tr:hover { background: #fafafa; }
    .ep-email { color: var(--text-main); overflow-wrap: anywhere; font-weight: 500; }
    .ep-date { display: block; margin-top: 3px; color: var(--text-secondary); font-size: 12px; font-variant-numeric: tabular-nums; }
    .ep-unsubscribed { color: #874d00; font-weight: 500; }
    .ep-subscribed { color: var(--text-secondary); }
    .ep-mobile-label { display: none; }
    .ep-status { padding: 48px 20px; text-align: center; }
    .ep-status p { margin-bottom: 8px; }
    .ep-status .ep-hint { margin-bottom: 16px; }
    .ep-pagination { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 12px 16px; background: #fafafa; }
    .ep-pagination[hidden] { display: none; }
    .ep-page-buttons { display: flex; align-items: center; gap: 10px; }
    .ep-page-number { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .ep-skeleton { display: block; width: 75%; height: 14px; background: var(--border); border-radius: 3px; margin: 8px 0; }
    .ep-sr-only { position: absolute; top: 0; left: 0; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 800px) {
      .ep-page { padding: 20px 16px; }
      .ep-controls, .ep-search { width: 100%; }
      .ep-search input { width: 100%; flex: 1; }
      .ep-summary { gap: 12px 20px; }
      .ep-summary div { flex-direction: column; gap: 2px; }
      .ep-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
      .ep-table, .ep-table tbody { display: block; }
      .ep-table tr { display: grid; grid-template-columns: 1fr 1fr; padding: 14px 16px; border-bottom: 1px solid var(--border); }
      .ep-table td { display: block; padding: 0; border: 0; min-width: 0; }
      .ep-table td:first-child { grid-column: 1 / -1; margin-bottom: 12px; }
      .ep-mobile-label { display: block; color: var(--text-secondary); font-size: 12px; margin-bottom: 4px; }
      .ep-pagination { align-items: flex-start; }
      .ep-page-buttons { width: 100%; justify-content: space-between; }
    }
    @media (max-width: 600px) {
      body:has(.ep-page) .app { flex-direction: column; height: 100dvh; }
      body:has(.ep-page) .sidebar { width: 100%; }
      body:has(.ep-page) .sidebar-header, body:has(.ep-page) .sidebar-footer { display: none; }
      body:has(.ep-page) .nav-menu { display: flex; overflow-x: auto; padding: 0; }
      body:has(.ep-page) .nav-item { padding: 12px 14px; border-right: 0; }
      body:has(.ep-page) .topbar { height: 48px; padding: 0 16px; }
      .ep-page .btn-sm, .ep-page .filter-btn { min-height: 42px; }
      .ep-search-row { flex-wrap: wrap; }
      .ep-search input { flex-basis: calc(100% - 80px); }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  var route = '/thinkpro-admin/email-preferences';
  var epoch = adminEpoch();
  var state = { q: '', category: 'all', page: 1, pageSize: 25, total: 0, loading: false };
  var requestId = 0;
  var controller;
  var dateFormat = new Intl.DateTimeFormat('zh-CN', {
    timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
  });

  adminFrame(route);
  var main = document.getElementById('mainArea');
  main.innerHTML = '<header class="topbar"><div class="breadcrumb">首页 / <strong>邮件退订</strong></div><div class="topbar-right"><button class="btn-logout" id="epLogout" type="button">退出</button></div></header>' +
    '<main class="ep-page" id="emailPreferencesPage"><h1>邮件退订</h1><p class="ep-description">查看所有店铺的邮件退订记录。同一邮箱合并展示，工单邮件与运输保障邮件分别记录。</p>' +
    '<dl class="ep-summary" aria-label="所有店铺退订统计"><div><dt>退订邮箱总数</dt><dd id="epEmailCount">—</dd></div><div><dt>工单邮件退订</dt><dd id="epTicketCount">—</dd></div><div><dt>运输保障邮件退订</dt><dd id="epProtectionCount">—</dd></div></dl>' +
    '<div class="ep-controls"><form class="ep-search" id="epSearchForm"><label for="epSearch">搜索邮箱</label><div class="ep-search-row"><input id="epSearch" type="search" placeholder="输入完整邮箱或部分内容" autocomplete="off" maxlength="254"><button class="btn-sm btn-sm-primary" type="submit">搜索</button><button class="btn-sm" type="button" id="epClear" hidden>清除</button></div></form>' +
    '<fieldset class="ep-categories"><legend>退订类型</legend><div class="ep-category-buttons"><button class="filter-btn active" type="button" data-category="all" aria-pressed="true">全部</button><button class="filter-btn" type="button" data-category="ticket" aria-pressed="false">工单邮件</button><button class="filter-btn" type="button" data-category="protection" aria-pressed="false">运输保障邮件</button></div></fieldset></div>' +
    '<section class="ep-results" aria-labelledby="epResultTitle"><div class="ep-result-heading"><h2 id="epResultTitle">退订记录</h2><span class="ep-meta">按最近退订排序 · 时间为美东时间</span></div><div id="epResults" aria-busy="true"></div>' +
    '<div class="ep-pagination" id="epPagination" hidden><span class="ep-meta" id="epResultCount"></span><div class="ep-page-buttons"><button class="btn-sm" id="epPrevious" type="button">上一页</button><span class="ep-page-number" id="epPageNumber"></span><button class="btn-sm" id="epNext" type="button">下一页</button></div></div></section><p class="ep-sr-only" id="epAnnouncement" role="status" aria-live="polite"></p></main>';

  var root = document.getElementById('emailPreferencesPage');
  function el(id) { return root.querySelector('#' + id); }
  function current() { return epoch === adminEpoch() && root.isConnected; }
  function login() { if (current()) location.replace('/login?redirect=' + encodeURIComponent(route)); }
  function announce(message) { el('epAnnouncement').textContent = message; }

  function showStatus(title, hint, retry) {
    var box = document.createElement('div');
    box.className = 'ep-status';
    var text = document.createElement('p');
    text.textContent = title;
    box.appendChild(text);
    if (hint) {
      var help = document.createElement('p');
      help.className = 'ep-hint';
      help.textContent = hint;
      box.appendChild(help);
    }
    if (retry) {
      var button = document.createElement('button');
      button.className = 'btn-sm';
      button.type = 'button';
      button.textContent = '重新加载';
      button.addEventListener('click', retry);
      box.appendChild(button);
    }
    el('epResults').replaceChildren(box);
    el('epPagination').hidden = true;
    announce(title);
  }

  function setLoading(loading) {
    state.loading = loading;
    el('epResults').setAttribute('aria-busy', String(loading));
    el('epPrevious').disabled = loading || state.page <= 1;
    el('epNext').disabled = loading || state.page * state.pageSize >= state.total;
    if (loading) {
      el('epPagination').hidden = true;
      el('epResults').innerHTML = '<div class="ep-status" aria-hidden="true"><span class="ep-skeleton"></span><span class="ep-skeleton"></span><span class="ep-skeleton"></span></div>';
      announce('正在加载退订记录');
    }
  }

  function addCategory(row, title, value) {
    var cell = document.createElement('td');
    var label = document.createElement('span');
    label.className = 'ep-mobile-label';
    label.textContent = title;
    label.setAttribute('aria-hidden', 'true');
    cell.appendChild(label);
    var status = document.createElement('span');
    status.className = value ? 'ep-unsubscribed' : 'ep-subscribed';
    status.textContent = value ? '已退订' : '未退订';
    cell.appendChild(status);
    if (value) {
      var time = document.createElement('time');
      time.className = 'ep-date';
      var date = new Date(value);
      if (!isNaN(date.getTime())) {
        time.dateTime = date.toISOString();
        time.textContent = dateFormat.format(date).replace(/\//g, '-');
      } else time.textContent = '时间未记录';
      cell.appendChild(time);
    }
    row.appendChild(cell);
  }

  function render(data) {
    el('epEmailCount').textContent = data.summary.email_count.toLocaleString('zh-CN');
    el('epTicketCount').textContent = data.summary.ticket_count.toLocaleString('zh-CN');
    el('epProtectionCount').textContent = data.summary.protection_count.toLocaleString('zh-CN');
    state.page = data.page;
    state.pageSize = data.page_size;
    state.total = data.total;
    if (!data.items.length) {
      var filtered = state.q || state.category !== 'all';
      showStatus(filtered ? '没有符合条件的退订记录' : '暂无退订记录', filtered ? '请尝试其他邮箱，或选择全部类型。' : '邮箱退订工单或运输保障邮件后，会在这里显示。');
      return;
    }
    var table = document.createElement('table');
    table.className = 'ep-table';
    table.innerHTML = '<thead><tr><th scope="col">邮箱</th><th scope="col">工单邮件</th><th scope="col">运输保障邮件</th></tr></thead>';
    var body = document.createElement('tbody');
    data.items.forEach(function (item) {
      var row = document.createElement('tr');
      var email = document.createElement('td');
      email.className = 'ep-email';
      email.textContent = item.email;
      row.appendChild(email);
      addCategory(row, '工单邮件', item.ticket_unsubscribed_at);
      addCategory(row, '运输保障邮件', item.protection_unsubscribed_at);
      body.appendChild(row);
    });
    table.appendChild(body);
    el('epResults').replaceChildren(table);
    el('epPagination').hidden = false;
    el('epResultCount').textContent = '共 ' + state.total.toLocaleString('zh-CN') + ' 个邮箱 · 每页 ' + state.pageSize + ' 条';
    el('epPageNumber').textContent = '第 ' + state.page + ' / ' + Math.max(1, Math.ceil(state.total / state.pageSize)) + ' 页';
    announce('已加载 ' + data.items.length + ' 条退订记录，共 ' + state.total + ' 个邮箱');
  }

  async function load() {
    var id = ++requestId;
    if (controller) controller.abort();
    controller = new AbortController();
    setLoading(true);
    var params = new URLSearchParams({ category: state.category, page: String(state.page), page_size: String(state.pageSize) });
    if (state.q) params.set('q', state.q);
    try {
      var response = await fetch('/api/admin/email-preferences?' + params.toString(), { credentials: 'same-origin', signal: controller.signal });
      if (!current() || id !== requestId) return;
      if (response.status === 401) { login(); return; }
      if (response.status === 403) { showStatus('无法查看退订记录', '当前账号没有访问权限，请联系管理员。'); return; }
      if (!response.ok) throw new Error('load failed');
      var data = await response.json();
      if (!current() || id !== requestId) return;
      if (!data.ok) throw new Error('load failed');
      render(data);
    } catch (error) {
      if (!current() || id !== requestId || error.name === 'AbortError') return;
      showStatus('退订记录加载失败', '请检查网络连接后重试。', load);
    } finally {
      if (current() && id === requestId) setLoading(false);
    }
  }

  el('epSearchForm').addEventListener('submit', function (event) {
    event.preventDefault();
    state.q = el('epSearch').value.trim();
    el('epSearch').value = state.q;
    el('epClear').hidden = !state.q;
    state.page = 1;
    load();
  });
  el('epClear').addEventListener('click', function () {
    el('epSearch').value = '';
    state.q = '';
    state.page = 1;
    el('epClear').hidden = true;
    el('epSearch').focus();
    load();
  });
  root.querySelectorAll('[data-category]').forEach(function (button) {
    button.addEventListener('click', function () {
      state.category = button.dataset.category;
      state.page = 1;
      root.querySelectorAll('[data-category]').forEach(function (item) {
        var selected = item === button;
        item.classList.toggle('active', selected);
        item.setAttribute('aria-pressed', String(selected));
      });
      load();
    });
  });
  el('epPrevious').addEventListener('click', function () { if (!state.loading && state.page > 1) { state.page--; load(); } });
  el('epNext').addEventListener('click', function () { if (!state.loading && state.page * state.pageSize < state.total) { state.page++; load(); } });
  document.getElementById('epLogout').addEventListener('click', async function () {
    try {
      var response = await fetch('/api/admin/logout', { method: 'POST', credentials: 'same-origin' });
      if (response.ok || response.status === 401) location.replace('/login');
      else throw new Error('logout failed');
    } catch (error) {
      if (current()) showStatus('退出失败', '请检查网络连接后，再点击右上角退出。');
    }
  });

  async function init() {
    setLoading(true);
    try {
      if (!window.__adminAgent) {
        var response = await fetch('/api/admin/me', { credentials: 'same-origin' });
        if (!current()) return;
        if (response.status === 401) { login(); return; }
        if (response.status === 403) { showStatus('无法查看退订记录', '当前账号没有访问权限，请联系管理员。'); return; }
        if (!response.ok) throw new Error('auth failed');
        var data = await response.json();
        if (!current()) return;
        if (!data.ok) { login(); return; }
        window.__adminAgent = data.agent;
        adminFrame(route);
      }
      if (current()) await load();
    } catch (error) {
      if (current()) showStatus('无法连接客服后台', '请检查网络连接后重试。', init);
    } finally {
      if (current() && requestId === 0) setLoading(false);
    }
  }
  init();
})();
</script>
</body>
</html>
