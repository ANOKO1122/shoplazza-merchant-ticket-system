<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服后台 - 工单管理</title>
<link rel="stylesheet" href="/admin-base.css">
<style>
.ticket-workspace, .ticket-workspace .panel-left, .ticket-workspace .panel-right, .ticket-workspace .detail-content, .ticket-workspace .detail-scroll { min-height: 0; min-width: 0; }
.ticket-workspace .split-view { display: grid; grid-template-columns: minmax(0, 1fr) minmax(420px, 34%); min-height: 0; }
.ticket-workspace .panel-left { width: auto; display: flex; flex-direction: column; overflow: hidden; }
.ticket-workspace .panel-right { width: auto; }
.ticket-workspace .stats-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 12px 16px; }
.ticket-workspace .stat-card { min-width: 0; gap: 8px; padding: 10px 12px; border: 1px solid transparent; font: inherit; text-align: left; }
.ticket-workspace .stat-card.sel { border-color: var(--primary); box-shadow: none; }
.ticket-workspace .stat-num { font-size: 20px; }
.ticket-workspace .stat-label { color: var(--text-secondary); }
.ticket-workspace .table-header, .ticket-workspace .table-title { flex-wrap: wrap; gap: 8px; }
.ticket-workspace .table-scroll { min-height: 0; }
.ticket-workspace .table-scroll table { min-width: 960px; }
.ticket-workspace .reply-bar { max-height: calc(100% - 56px); overflow-y: auto; padding: 12px 16px; }
.ticket-workspace #replyBox { flex: none; width: 100%; height: 64px; min-height: 64px; max-height: 50vh; line-height: 1.6; overflow-y: auto; font-family: inherit; }
.ticket-workspace .reply-actions, .ticket-workspace .panel-actions { flex-wrap: wrap; }
.ticket-workspace .info-value { overflow-wrap: anywhere; }
.quick-reply-bar { display: flex; gap: 8px; align-items: center; }
.quick-reply-bar label { flex-shrink: 0; font-size: 12px; color: var(--text-secondary); }
.quick-reply-bar select { flex: 1; min-width: 0; height: 32px; padding: 4px 8px; border: 1px solid var(--border-strong); border-radius: 4px; background: #fff; color: var(--text-main); font: inherit; font-size: 12px; }
.quick-reply-bar button { min-height: 32px; flex-shrink: 0; }
.quick-reply-dialog { position: fixed; margin: auto; width: min(680px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 0; border-radius: var(--radius); background: var(--bg-card); color: var(--text-main); box-shadow: 0 12px 40px rgba(0, 0, 0, .22); }
.quick-reply-dialog::backdrop { background: rgba(0, 21, 41, .42); }
.quick-reply-dialog header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.quick-reply-dialog h2 { font-size: 18px; }
.quick-reply-dialog p { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.quick-reply-body { padding: 16px 20px; }
.quick-reply-list { max-height: 48vh; overflow-y: auto; }
.quick-reply-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.quick-reply-item-text { flex: 1; min-width: 0; }
.quick-reply-item-text strong { display: block; font-size: 14px; overflow-wrap: anywhere; }
.quick-reply-item-text p { white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.quick-reply-item-actions, .quick-reply-footer { display: flex; flex-wrap: wrap; gap: 8px; }
.quick-reply-footer { justify-content: flex-end; margin-top: 16px; }
.quick-reply-dialog button { min-height: 32px; }
.quick-reply-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; font-size: 13px; }
.quick-reply-field input, .quick-reply-field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 4px; font: inherit; color: var(--text-main); }
.quick-reply-field textarea { min-height: 180px; max-height: 40vh; resize: vertical; line-height: 1.6; }
.quick-reply-error { color: #a8071a; font-size: 13px; overflow-wrap: anywhere; }
.quick-reply-error:empty { display: none; }
.quick-reply-dialog :focus-visible, .quick-reply-bar :focus-visible, .ticket-workspace .stat-card:focus-visible { outline: 2px solid #096dd9; outline-offset: 2px; }
@media (max-width: 1150px) {
  .ticket-workspace .split-view { grid-template-columns: minmax(0, 1fr) minmax(360px, 42%); }
  .ticket-workspace .stat-card { flex-direction: column; align-items: flex-start; gap: 0; padding: 8px; }
}
@media (max-width: 800px) {
  .ticket-workspace .split-view { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(220px, 34%) minmax(0, 1fr); }
  .ticket-workspace .panel-left { border-right: 0; border-bottom: 1px solid var(--border-strong); }
  .ticket-workspace .stats-row { padding: 8px; gap: 4px; }
  .ticket-workspace .table-header { padding: 8px; }
  .ticket-workspace .reply-bar { padding: 8px; }
  .quick-reply-item { align-items: flex-start; flex-wrap: wrap; }
}
.shipping-address-card { padding: 16px 0; margin-bottom: 16px; border-top: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong); }
.shipping-address-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.shipping-address-heading h4 { font-size: 14px; font-weight: 600; }
.shipping-address-heading .btn-sm { flex-shrink: 0; }
.shipping-address-summary { line-height: 1.7; font-size: 13px; overflow-wrap: anywhere; }
.address-muted { font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
.shipping-address-dialog { position: fixed; margin: auto; width: min(640px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 0; border-radius: var(--radius); box-shadow: 0 12px 40px rgba(0, 0, 0, .22); background: var(--bg-card); color: var(--text-main); }
.shipping-address-dialog::backdrop { background: rgba(0, 21, 41, .42); }
.shipping-address-dialog form { display: flex; flex-direction: column; max-height: calc(100dvh - 32px); }
.address-dialog-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); }
.address-dialog-header h2 { font-size: 18px; line-height: 1.4; margin: 0 0 6px; }
.address-dialog-header p { font-size: 13px; color: var(--text-secondary); overflow-wrap: anywhere; }
.address-dialog-body { overflow-y: auto; padding: 18px 24px 20px; }
.address-field-help { font-size: 12px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 16px; }
.address-read-state { color: #237804; font-size: 13px; margin-bottom: 16px; }
.address-fields { border: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 18px; padding: 0; margin: 0; }
.address-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.address-field span { font-size: 13px; color: var(--text-secondary); }
.address-field-wide { grid-column: 1 / -1; }
.address-field input { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 4px; color: var(--text-main); background: #fff; font: inherit; caret-color: var(--primary); }
.address-field input:focus-visible, .shipping-address-dialog button:focus-visible, .shipping-address-heading button:focus-visible { outline: 2px solid #096dd9; outline-offset: 2px; }
.address-field input:disabled { color: var(--text-secondary); background: #f5f5f5; }
.address-email { margin-top: 16px; font-size: 12px; color: var(--text-secondary); overflow-wrap: anywhere; }
.address-feedback { margin-top: 12px; color: var(--text-secondary); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.address-feedback:empty { display: none; }
.address-feedback-error { color: #a8071a; background: #fff1f0; border: 1px solid #ffccc7; border-radius: 4px; padding: 10px 12px; margin-bottom: 12px; }
.address-result strong { font-size: 16px; }
.address-result p { color: var(--text-secondary); font-size: 13px; line-height: 1.7; margin-top: 8px; overflow-wrap: anywhere; }
.address-result-summary { margin: 20px 0 16px; padding-top: 16px; border-top: 1px solid var(--border-strong); font-size: 14px; line-height: 1.8; overflow-wrap: anywhere; }
.address-result-summary h3 { margin-bottom: 8px; font-size: 13px; color: var(--text-secondary); }
.address-dialog-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--border); }
.address-dialog-actions button { min-height: 40px; padding: 8px 16px; font-size: 14px; }
.address-dialog-actions .btn-sm-primary { background: #096dd9; border-color: #096dd9; }
.address-dialog-actions .btn-sm-primary:hover { background: #0050b3; }
.address-dialog-actions button:disabled { opacity: .55; cursor: wait; }
@media (max-width: 480px) { .address-fields { grid-template-columns: 1fr; } .address-dialog-header, .address-dialog-body { padding-left: 16px; padding-right: 16px; } .address-dialog-actions { padding: 12px 16px; } .address-dialog-actions button { flex: 1; } }
</style>

<body>
<div id="app"><div class="login-page"><div class="login-card" style="text-align:center;color:var(--text-muted);padding:60px 36px">加载中...</div></div></div>
<script>
var API='/api/admin';var currentStatus='all';var currentPage=1;var currentTicket=null;var me=null;var timeField='created_at';var timeRange='';var complaintTypes=['Fraud','Unauthorized Transaction','Counterfeit / Fake Products','Misleading or False Advertising','Refusal to Honor Refund / Return Policy','Privacy or Data Misuse','Unsafe or Harmful Products','Discrimination or Unfair Treatment','Intellectual Property Violation'];
var quickReplies=[],quickRepliesLoaded=false,quickRepliesError='',quickRepliesRequest=0,quickReplyManager=null;
function sd(s){return s&&s.indexOf('.')!==-1?s:s+'.myshoplaza.com'}
function $(s){return document.querySelector(s)}function $$(s){return document.querySelectorAll(s)}
function formatTime(i){if(!i)return'';var d=new Date(i);if(isNaN(d.getTime()))return'';var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0'),h=String(d.getHours()).padStart(2,'0'),mi=String(d.getMinutes()).padStart(2,'0'),s=String(d.getSeconds()).padStart(2,'0');return y+'-'+m+'-'+dy+' '+h+':'+mi+':'+s}
function esc(v){return SupportSafe.escape(v)}
function orderStateLabel(field,value){
  var text=value==null?'':String(value).trim();if(!text)return '未提供';
  var labels={
    order_status:{opened:'待付款',placed:'进行中',cancelled:'已取消',finished:'已完成'},
    payment_status:{waiting:'待付款',paying:'付款审核中',authorized:'已授权',partially_paid:'部分付款',paid:'已付款',cancelled:'付款已取消',failed:'付款失败',refunding:'退款中',refund_failed:'退款失败',refunded:'已全额退款',partially_refunded:'已部分退款'},
    fulfillment_status:{initialled:'未发货',waiting:'待发货',unfulfilled:'未发货',partially_shipped:'部分发货',shipped:'已发货',partially_finished:'部分签收',finished:'已签收',cancelled:'发货已取消',returning:'退货中',partially_returned:'部分退货',returned:'已退货'},
    refund_status:{pending:'退款处理中',finished:'退款完成',failed:'退款失败',refunding:'退款中',refund_failed:'退款失败',refunded:'已全额退款',partially_refunded:'已部分退款'}
  };
  var values=labels[field]||{};return Object.prototype.hasOwnProperty.call(values,text)?values[text]+' ('+text+')':text;
}
function orderRefundAmount(order){
  var value=order.refund_amount;if(value==null||String(value).trim()==='')return '未提供';
  var currency=order.order_currency==null?'':String(order.order_currency).trim();
  return (currency?currency+' ':'')+String(value);
}
function renderOrderStatusFields(order){
  var fields=[['order_status','订单状态'],['payment_status','付款状态'],['fulfillment_status','发货状态'],['refund_status','退款状态']];
  return fields.map(function(field){return '<div class="info-item"><span class="info-label">'+field[1]+'</span><span class="info-value">'+esc(orderStateLabel(field[0],order[field[0]]))+'</span></div>'}).join('')
    +'<div class="info-item"><span class="info-label">已退款金额</span><span class="info-value">'+esc(orderRefundAmount(order))+'</span></div>';
}
function ticketPreviewUrl(n){return'/thinkpro-admin/ticket-preview?ticket='+encodeURIComponent(n||'')}
function orderPreviewUrl(s,o,e){var u='/thinkpro-admin/ticket-preview?store='+encodeURIComponent(s||'')+'&order='+encodeURIComponent(o||'');if(e)u+='&email='+encodeURIComponent(e);return u}
function showToast(m,t){var d=document.createElement('div');d.className='toast '+(t||'success');d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2000)}
function setTimeField(v){timeField=v;currentPage=1;loadTickets()}function setTimeRange(v){timeRange=v;currentPage=1;loadTickets()}
function statusLabelRow(t){var g=[];if(t.status==='open')g.push('<span class="tag tag-blue">待处理</span>');else if(t.status==='waiting')g.push('<span class="tag tag-orange">等待顾客</span>');else if(t.status==='closed')g.push('<span class="tag tag-gray">已关闭</span>');if(t.arbitration_requested&&t.status!=='closed')g.push('<span class="tag tag-red">仲裁</span>');if(complaintTypes.indexOf(t.issue_type||'')!==-1)g.push('<span class="tag tag-red">投诉</span>');return'<div class="status-tags">'+g.join('')+'</div>'}function issueTypeLabel(v){var m={Unknow:'未知',Fraud:'欺诈',Unauthorized:'未授权','Products Discrepancies':'商品不符','Product Not Received':'未收到商品','Defective Merchandise':'商品瑕疵','Incorrect Transaction':'交易错误','Wrong address':'地址错误','Credit Not Processed':'退款未处理','Other / General Inquiry':'其他/一般咨询','Unauthorized Transaction':'未授权交易','Counterfeit / Fake Products':'假冒/仿冒产品','Misleading or False Advertising':'误导或虚假广告','Refusal to Honor Refund / Return Policy':'拒绝履行退款/退货政策','Privacy or Data Misuse':'隐私或数据滥用','Unsafe or Harmful Products':'不安全或有害产品','Discrimination or Unfair Treatment':'歧视或不公平对待','Intellectual Property Violation':'知识产权侵权'};return v?(v+' ('+(m[v]||'')+')'):''}
(async function init(){var bootEpoch=adminEpoch();try{if(window.__adminAgent){me=window.__adminAgent;if(bootEpoch!==adminEpoch())return;renderMain();return;}var r=await fetch(API+'/me',{credentials:'same-origin'});var d=await r.json();if(bootEpoch!==adminEpoch())return;if(d.ok){me=d.agent;window.__adminAgent=me;renderMain()}else{location.replace('/login?redirect='+encodeURIComponent(location.pathname))}}catch(e){location.replace('/login?redirect='+encodeURIComponent(location.pathname))}})();async function doLogout(){await fetch(API+'/logout',{method:'POST',credentials:'same-origin'});location.replace('/login')}
function renderMain(){adminFrame('/thinkpro-admin');buildTicketLayout();loadStats();loadTickets();loadPendingCount();loadQuickReplies();setInterval(loadPendingCount,30000)}
function buildTicketLayout(){var s=function(s){return currentStatus===s?' sel':''};var to='<select id="timeFieldSel" onchange="setTimeField(this.value)" style="padding:4px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;background:#fff"><option value="created_at"'+(timeField==='created_at'?' selected':'')+'>创建时间</option><option value="updated_at"'+(timeField==='updated_at'?' selected':'')+'>最后更新</option></select>';var ro='<select id="timeRangeSel" onchange="setTimeRange(this.value)" style="padding:4px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;background:#fff"><option value=""'+(timeRange===''?' selected':'')+'>全部时间</option><option value="24h"'+(timeRange==='24h'?' selected':'')+'>24小时</option><option value="2d"'+(timeRange==='2d'?' selected':'')+'>2天</option><option value="7d"'+(timeRange==='7d'?' selected':'')+'>一周</option></select>';var tf='<div style="display:flex;gap:6px;align-items:center;margin-left:12px">'+to+ro+'</div>';$('#mainArea').innerHTML='<header class="topbar"><div class="breadcrumb">首页 / <strong>工单处理</strong></div><div class="topbar-right"><span id="pendingBadge" style="display:none;background:#fff2f0;border:1px solid #ffccc7;border-radius:4px;padding:4px 10px;font-size:12px;color:#ff4d4f;margin-right:8px;cursor:pointer" onclick="adminGo(\'/thinkpro-admin/emails?status=pending&email_type=agent_reply_notice\')" title="点击查看待发送邮件"></span><button class="btn-logout" onclick="doLogout()">退出</button></div></header><div class="content ticket-workspace"><div class="split-view"><div class="panel-left"><div class="stats-row"><button type="button" class="stat-card'+s('all')+'" onclick="filterByStatus(\'all\',this)"><span class="stat-num" id="statAll">-</span><span class="stat-label">全部工单</span></button><button type="button" class="stat-card'+s('open')+'" onclick="filterByStatus(\'open\',this)"><span class="stat-num" id="statOpen">-</span><span class="stat-label">待处理</span></button><button type="button" class="stat-card'+s('waiting')+'" onclick="filterByStatus(\'waiting\',this)"><span class="stat-num" id="statWait">-</span><span class="stat-label">等待顾客</span></button><button type="button" class="stat-card'+s('closed')+'" onclick="filterByStatus(\'closed\',this)"><span class="stat-num" id="statClosed">-</span><span class="stat-label">已关闭</span></button></div><div class="table-header"><span class="table-title">工单列表<div class="search-box"><span class="sicon">🔍</span><input type="text" id="searchInput" placeholder="搜索工单号/订单号/邮箱" onkeydown="if(event.key==\'Enter\')loadTickets()"></div></span>'+tf+'</div><div class="table-scroll"><table><thead><tr><th style="width:120px">工单号</th><th>店铺</th><th>店铺域名</th><th>订单号</th><th>顾客邮箱</th><th>问题类型</th><th style="width:140px">工单状态</th><th style="width:140px">创建时间</th><th style="width:140px">最后更新</th></tr></thead><tbody id="ticketTbody"></tbody></table></div><div class="pagination" id="pagination"></div></div><div class="panel-right" id="detailPanel"><div class="detail-empty">← 点击左侧工单查看详情</div></div></div></div>'}
async function loadStats(){try{var r=await fetch(API+'/tickets?page_size=1&status=all',{credentials:'same-origin'});var d=await r.json();if(!d.ok)return;updateStat('statAll',d.total||0);var r2=await fetch(API+'/tickets?page_size=1&status=open',{credentials:'same-origin'});var o=(await r2.json()).total||0;updateStat('statOpen',o);var r3=await fetch(API+'/tickets?page_size=1&status=waiting',{credentials:'same-origin'});var w=(await r3.json()).total||0;updateStat('statWait',w);var r4=await fetch(API+'/tickets?page_size=1&status=closed',{credentials:'same-origin'});var c=(await r4.json()).total||0;updateStat('statClosed',c)}catch(e){}}
function updateStat(i,v){var e=document.getElementById(i);if(e)e.textContent=v}
function filterByStatus(s,c){currentStatus=s;currentPage=1;$$('.stat-card').forEach(function(card){card.classList.toggle('sel',card===c)});loadTickets();loadStats();loadPendingCount()}
async function loadTickets(){var q=($('#searchInput')||{}).value||'';var p=new URLSearchParams();if(currentStatus!=='all')p.set('status',currentStatus);if(q)p.set('q',q);if(timeField)p.set('time_field',timeField);if(timeRange)p.set('time_range',timeRange);p.set('page',String(currentPage));p.set('page_size','30');try{var r=await fetch(API+'/tickets?'+p.toString(),{credentials:'same-origin'});var d=await r.json();if(!d.ok)return;renderTable(d.tickets,d.total)}catch(e){}}
function renderTable(tk,to){var tb=$('#ticketTbody');if(!tb)return;var h='';tk.forEach(function(t){h+='<tr onclick="selectTicket(this,this.getAttribute(\'data-tno\'))" data-tno="'+esc(t.public_ticket_no)+'"><td style="text-align:center;font-weight:600">'+esc(t.public_ticket_no)+'</td><td style="text-align:center">'+esc((t.store_name||''))+'</td><td style="text-align:center">'+esc(sd(t.store_subdomain||''))+'</td><td style="text-align:center">'+esc((t.order_id||''))+'</td><td style="text-align:center">'+esc((t.customer_email||''))+'</td><td style="text-align:center">'+esc((t.issue_type||''))+'</td><td style="text-align:center">'+statusLabelRow(t)+'</td><td style="text-align:center;white-space:nowrap">'+formatTime(t.created_at)+'</td><td style="text-align:center;white-space:nowrap">'+formatTime(t.updated_at)+'</td></tr>'});tb.innerHTML=h;var pe=$('#pagination');if(pe)pe.innerHTML=pageButtons(to,30,currentPage,'goPage')}
function pagerWindow(page,tp){var set={};set[1]=1;set[tp]=1;for(var i=page-2;i<=page+2;i++){if(i>=1&&i<=tp)set[i]=1}return Object.keys(set).map(Number).sort(function(a,b){return a-b})}
function pageButtons(total,pageSize,page,goName){var tp=Math.ceil(total/pageSize)||1;if(page>tp)page=tp;var pg='<span class="pager-total">共 '+total+' 条</span><button '+(page<=1?'disabled':'')+' onclick="'+goName+'('+(page-1)+')">上一页</button>';var pages=pagerWindow(page,tp);var prev=0;pages.forEach(function(i){if(prev&&i-prev>1)pg+='<span class="pager-gap">…</span>';pg+='<button class="'+(i===page?'active':'')+'" onclick="'+goName+'('+i+')">'+i+'</button>';prev=i});pg+='<button '+(page>=tp?'disabled':'')+' onclick="'+goName+'('+(page+1)+')">下一页</button>';return pg}
function goPage(p){currentPage=p;loadTickets()}

function resizeAdminReply() {
  var box = document.getElementById('replyBox');
  if (!box) return;
  box.style.height = 'auto';
  var limit = Math.max(64, Math.floor(window.innerHeight / 2));
  var height = Math.min(Math.max(64, box.scrollHeight + 2), limit);
  box.style.height = height + 'px';
  box.style.overflowY = box.scrollHeight + 2 > limit ? 'auto' : 'hidden';
}
if (window.addEventListener) {
  if (window.__adminReplyResize) window.removeEventListener('resize', window.__adminReplyResize);
  window.__adminReplyResize = resizeAdminReply;
  window.addEventListener('resize', window.__adminReplyResize);
}

async function loadQuickReplies() {
  var epoch = adminEpoch();
  var request = ++quickRepliesRequest;
  try {
    var response = await fetch(API + '/quick-replies', { credentials: 'same-origin', cache: 'no-store' });
    var data = await response.json();
    if (epoch !== adminEpoch() || request !== quickRepliesRequest) return false;
    if (!response.ok || !data.ok) throw new Error(data.error || '快捷回复加载失败');
    quickReplies = data.quick_replies || [];
    quickRepliesLoaded = true;
    quickRepliesError = '';
    renderQuickReplyOptions();
    return true;
  } catch (error) {
    if (epoch !== adminEpoch() || request !== quickRepliesRequest) return false;
    quickRepliesError = error.message || '快捷回复加载失败';
    renderQuickReplyOptions();
    return false;
  }
}
function renderQuickReplyOptions() {
  var select = document.getElementById('quickReplySelect');
  if (!select) return;
  var label = quickRepliesError ? '加载失败，请打开管理重试' : !quickRepliesLoaded ? '加载中...' : quickReplies.length ? '选择文案，插入回复框' : '暂无快捷回复，点击管理添加';
  select.innerHTML = '<option value="">' + esc(label) + '</option>' + quickReplies.map(function(reply) {
    return '<option value="' + esc(reply.id) + '">' + esc(reply.title) + '</option>';
  }).join('');
}
function insertQuickReply(id) {
  var reply = quickReplies.find(function(item) { return String(item.id) === String(id); });
  var box = document.getElementById('replyBox');
  if (!reply || !box) return;
  box.setRangeText(reply.content, box.selectionStart, box.selectionEnd, 'end');
  document.getElementById('quickReplySelect').value = '';
  box.focus();
  resizeAdminReply();
}
function quickReplyManagerActive(manager) {
  return manager && manager === quickReplyManager && manager.dialog.isConnected && manager.epoch === adminEpoch();
}
async function openQuickReplyManager() {
  if (quickReplyManagerActive(quickReplyManager)) return;
  var dialog = document.createElement('dialog');
  dialog.className = 'quick-reply-dialog';
  dialog.setAttribute('aria-labelledby', 'quickReplyHeading');
  dialog.innerHTML = '<header><div><h2 id="quickReplyHeading">快捷回复</h2><p>所有客服共用，插入回复框后可继续修改。</p></div><button type="button" class="btn-sm" onclick="closeQuickReplyManager()">关闭</button></header><div class="quick-reply-body" id="quickReplyManagerBody">加载中...</div>';
  document.getElementById('mainArea').appendChild(dialog);
  var manager = { dialog: dialog, epoch: adminEpoch(), busy: false, editingId: null };
  quickReplyManager = manager;
  dialog.addEventListener('cancel', function(event) { event.preventDefault(); closeQuickReplyManager(); });
  dialog.showModal();
  await loadQuickReplies();
  if (quickReplyManagerActive(manager)) renderQuickReplyManager();
}
function closeQuickReplyManager() {
  if (!quickReplyManager || quickReplyManager.busy) return;
  quickReplyManager.dialog.close();
  quickReplyManager.dialog.remove();
  quickReplyManager = null;
}
function renderQuickReplyManager() {
  if (!quickReplyManagerActive(quickReplyManager)) return;
  quickReplyManager.editingId = null;
  var rows = quickReplies.map(function(reply) {
    return '<div class="quick-reply-item"><div class="quick-reply-item-text"><strong>' + esc(reply.title) + '</strong><p>' + esc(reply.content) + '</p></div><div class="quick-reply-item-actions">' +
      '<button type="button" class="btn-sm" data-id="' + esc(reply.id) + '" onclick="editQuickReply(this.dataset.id)">编辑</button>' +
      '<button type="button" class="btn-sm btn-sm-danger" data-id="' + esc(reply.id) + '" onclick="removeQuickReply(this.dataset.id)">删除</button></div></div>';
  }).join('');
  document.getElementById('quickReplyManagerBody').innerHTML = '<div class="quick-reply-error" id="quickReplyError" role="alert">' + esc(quickRepliesError) + '</div>' +
    (quickRepliesError ? '<button type="button" class="btn-sm" onclick="retryQuickReplies()">重试加载</button>' : '') +
    '<div class="quick-reply-list">' + (rows || '<p>还没有快捷回复，添加常用文案后即可在回复栏选择。</p>') + '</div>' +
    '<div class="quick-reply-footer"><button type="button" class="btn-sm btn-sm-primary" onclick="editQuickReply()">新增快捷回复</button></div>';
}
async function retryQuickReplies() {
  var manager = quickReplyManager;
  if (!quickReplyManagerActive(manager) || manager.busy) return;
  quickReplyBusy(manager, true);
  await loadQuickReplies();
  if (quickReplyManagerActive(manager)) {
    renderQuickReplyManager();
    quickReplyBusy(manager, false);
  }
}
function editQuickReply(id) {
  var manager = quickReplyManager;
  if (!quickReplyManagerActive(manager) || manager.busy) return;
  var reply = id ? quickReplies.find(function(item) { return String(item.id) === String(id); }) : null;
  if (id && !reply) return;
  manager.editingId = reply ? reply.id : null;
  document.getElementById('quickReplyManagerBody').innerHTML = '<form onsubmit="event.preventDefault();saveQuickReply()">' +
    '<label class="quick-reply-field">标题<input id="quickReplyTitle" maxlength="80" required placeholder="例如：物流查询" value="' + esc(reply ? reply.title : '') + '"></label>' +
    '<label class="quick-reply-field">回复正文<textarea id="quickReplyContent" maxlength="20000" required placeholder="填写要发送给顾客的常用回复">' + esc(reply ? reply.content : '') + '</textarea></label>' +
    '<div class="quick-reply-error" id="quickReplyError" role="alert"></div>' +
    '<div class="quick-reply-footer"><button type="button" class="btn-sm" onclick="renderQuickReplyManager()">取消</button><button type="submit" class="btn-sm btn-sm-primary">保存</button></div></form>';
  document.getElementById('quickReplyTitle').focus();
}
function quickReplyBusy(manager, busy) {
  manager.busy = busy;
  manager.dialog.querySelectorAll('button, input, textarea').forEach(function(element) { element.disabled = busy; });
}
async function saveQuickReply() {
  var manager = quickReplyManager;
  if (!quickReplyManagerActive(manager) || manager.busy) return;
  var title = document.getElementById('quickReplyTitle').value.trim();
  var content = document.getElementById('quickReplyContent').value.trim();
  var errorBox = document.getElementById('quickReplyError');
  if (!title || !content) { errorBox.textContent = '请填写标题和回复正文'; return; }
  errorBox.textContent = '';
  quickReplyBusy(manager, true);
  try {
    var response = await fetch(API + '/quick-replies' + (manager.editingId ? '/' + encodeURIComponent(manager.editingId) : ''), {
      method: manager.editingId ? 'PUT' : 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: title, content: content })
    });
    var data = await response.json();
    if (!quickReplyManagerActive(manager)) return;
    if (!response.ok || !data.ok) throw new Error(data.error || '保存失败');
    quickRepliesRequest++;
    quickReplies = [data.quick_reply].concat(quickReplies.filter(function(item) { return String(item.id) !== String(data.quick_reply.id); }));
    quickRepliesLoaded = true;
    quickRepliesError = '';
    renderQuickReplyOptions();
    renderQuickReplyManager();
    showToast('快捷回复已保存');
  } catch (error) {
    if (quickReplyManagerActive(manager)) errorBox.textContent = error.message || '保存失败，请重试';
  } finally {
    if (quickReplyManagerActive(manager)) quickReplyBusy(manager, false);
  }
}
async function removeQuickReply(id) {
  var manager = quickReplyManager;
  if (!quickReplyManagerActive(manager) || manager.busy) return;
  if (!confirm('删除这条快捷回复？所有客服将无法再选择它，已发送的消息不受影响。')) return;
  quickReplyBusy(manager, true);
  try {
    var response = await fetch(API + '/quick-replies/' + encodeURIComponent(id), { method: 'DELETE', credentials: 'same-origin' });
    var data = await response.json();
    if (!quickReplyManagerActive(manager)) return;
    if (!response.ok || !data.ok) throw new Error(data.error || '删除失败');
    quickRepliesRequest++;
    quickReplies = quickReplies.filter(function(item) { return String(item.id) !== String(id); });
    renderQuickReplyOptions();
    renderQuickReplyManager();
    showToast('快捷回复已删除');
  } catch (error) {
    if (quickReplyManagerActive(manager)) document.getElementById('quickReplyError').textContent = error.message || '删除失败，请重试';
  } finally {
    if (quickReplyManagerActive(manager)) quickReplyBusy(manager, false);
  }
}

  shippingAddressEditor = editor;
  dialog.addEventListener('cancel', function(event) { event.preventDefault(); closeShippingAddressEditor(); });
  document.getElementById('detailPanel').appendChild(dialog);
  renderShippingAddressEditor(editor);
  dialog.showModal();
  if (editor.submission) {
    if (editor.submission.requestId) pollShippingAddressRequest(editor);
  } else await loadShippingAddressEditor(editor);
}
function renderShippingAddressEditor(editor) {
  var submission = editor.submission;
  var body = '';
  var buttons = '<button type="button" class="btn-sm" onclick="closeShippingAddressEditor()"' + (editor.saving ? ' disabled' : '') + '>关闭</button>';
  if (submission) {
    var request = submission.request || {};
    var status = request.status || (editor.saving ? 'submitting' : 'submission_unknown');
    var labels = { submitting: '正在提交修改…', submission_unknown: '尚未确认提交结果', pending: '已提交，等待同步',
      processing: '正在同步到店匠…', succeeded: '收货地址已同步', failed: '收货地址修改失败', conflict: '地址已发生变化', uncertain: '店匠处理结果待确认' };
    var message = request.errorMessage || ({ pending: '请求已保存，可以关闭窗口，稍后重新打开查看结果。',
      processing: '正在核对并更新店匠订单。', succeeded: '店匠订单与本地地址已核对一致。',
      conflict: '请重新读取最新地址，核对后再修改。', uncertain: '暂时无法确认店匠是否已修改，请先刷新结果。',
      submission_unknown: '网络响应中断。重试会继续查询或提交同一份修改。' }[status] || '');
    body = '<div class="address-result" role="status"><strong>' + esc(labels[status] || status) + '</strong><p>' + esc(message) + '</p></div>' +
      '<div class="address-result-summary"><h3>' + (status === 'succeeded' ? '当前收货地址' : '本次提交的地址') + '</h3>' +
      shippingAddressSummary(request.afterAddress || request.desiredAddress || Object.assign({}, submission.body.expectedAddress, submission.body.patch)) + '</div>';
    if (request.id) body += '<p class="address-muted">请求编号：' + esc(request.id) + '</p>';
    if (status === 'failed' || status === 'conflict') {
      buttons += '<button type="button" class="btn-sm btn-sm-primary" onclick="reloadShippingAddressEditor()">重新读取并编辑</button>';
    } else if (!editor.saving && !submission.requestId) {
      buttons += '<button type="button" class="btn-sm btn-sm-primary" onclick="retryShippingAddressSubmission()">重试同一请求</button>';
    } else if (['pending', 'processing', 'uncertain'].indexOf(status) !== -1) {
      buttons += '<button type="button" class="btn-sm" onclick="refreshShippingAddressRequest()">刷新结果</button>';
    }
  } else if (editor.view) {
    var view = editor.view;
    body = '<p class="address-read-state">已从店匠读取最新地址</p>';
    if (!view.editable) body += '<div class="address-feedback address-feedback-error">' + esc(view.disabledReason || (!view.hasWriteScope ? '当前店铺授权缺少订单写权限，无法修改收货地址。' : '当前订单不允许修改收货地址。')) + '</div>';
    body += '<p class="address-field-help">街道地址、城市和国家信息必填；修改国家时，请同时核对两位国家代码（例如 US）。州 / 省代码请填写实际代码。</p>';
    body += '<fieldset class="address-fields"' + (!view.editable ? ' disabled' : '') + '>';
    shippingAddressFields.forEach(function(field) {
      body += '<label class="address-field' + (field[0] === 'address' || field[0] === 'address1' ? ' address-field-wide' : '') + '" for="address_' + field[0] + '">' +
        '<span>' + esc(field[1]) + '</span><input id="address_' + field[0] + '" name="' + field[0] + '" type="' + (field[0] === 'phone' ? 'tel' : 'text') +
        '" maxlength="' + (field[0] === 'country_code' ? '2' : '500') + '"' + (field[0] === 'city' || field[0] === 'address' ? ' required' : '') +
        (field[0] === 'country_code' ? ' pattern="[A-Z]{2}" title="请输入两位大写国家代码，例如 US"' : '') +
        ' autocomplete="off" value="' + esc(view.address[field[0]] || '') + '"></label>';
    });
    body += '</fieldset><p class="address-email">联系邮箱：' + esc(view.address.email || editor.email || '未提供') + '（保留原邮箱）</p>';
    if (view.editable) buttons += '<button type="submit" class="btn-sm btn-sm-primary">保存并同步到店匠</button>';
  } else {
    body = '<p class="address-loading" role="status">' + esc(editor.loadError || '正在读取店匠最新地址…') + '</p>';
    if (editor.loadError) buttons += '<button type="button" class="btn-sm btn-sm-primary" onclick="reloadShippingAddressEditor()">重新读取</button>';
  }
  editor.dialog.innerHTML = '<form onsubmit="saveShippingAddress(event)"><header class="address-dialog-header"><h2 id="shippingAddressDialogTitle">编辑收货地址</h2>' +
    '<p id="shippingAddressDialogHelp">订单 ' + esc(editor.orderNumber) + ' · 仅支持未发货订单</p></header>' +
    '<div class="address-dialog-body">' + body + '<div id="shippingAddressFeedback" class="address-feedback" role="alert"></div></div>' +
    '<footer class="address-dialog-actions">' + buttons + '</footer></form>';
}
async function loadShippingAddressEditor(editor) {
  editor.view = null; editor.loadError = ''; renderShippingAddressEditor(editor);
  try {
    var response = await fetch(API + '/tickets/' + encodeURIComponent(editor.ticketNo) + '/shipping-address', { credentials: 'same-origin', cache: 'no-store' });
    var data = await response.json();
    if (!addressEditorActive(editor)) return;
    if (!response.ok || !data.ok) throw new Error(data.error || '读取失败，请稍后重试');
    editor.view = data;
    editor.view.address = data.address || {};
    if (data.activeRequest) {
      editor.submission = { requestId: String(data.activeRequest.id), request: data.activeRequest,
        body: { expectedAddress: data.activeRequest.expectedAddress || data.address || {}, patch: data.activeRequest.patch || {} } };
      shippingAddressSubmissions[editor.ticketNo] = editor.submission;
      renderShippingAddressEditor(editor);
      pollShippingAddressRequest(editor);
      return;
    }
    renderShippingAddressEditor(editor);
    var firstInput = editor.dialog.querySelector('input:not(:disabled)');
    if (firstInput) firstInput.focus();
    if (currentTicket && currentTicket.public_ticket_no === editor.ticketNo) {
      var summary = document.getElementById('shippingAddressSummary');
      if (summary) summary.innerHTML = shippingAddressSummary(data.address);
      var status = document.getElementById('shippingAddressStatus');
      if (status) status.textContent = '已读取店匠最新地址';
    }
  } catch (error) {
    if (!addressEditorActive(editor)) return;
    editor.loadError = error.message || '网络错误，无法读取最新地址';
    renderShippingAddressEditor(editor);
  }
}
function reloadShippingAddressEditor() {
  var editor = shippingAddressEditor;
  if (!editor || editor.saving) return;
  if (editor.submission && ['failed', 'conflict'].indexOf((editor.submission.request || {}).status) === -1) return;
  delete shippingAddressSubmissions[editor.ticketNo];
  editor.submission = null;
  loadShippingAddressEditor(editor);
}
function newShippingAddressKey() {
  if (window.crypto.randomUUID) return window.crypto.randomUUID();
  var bytes = new Uint8Array(16);
  window.crypto.getRandomValues(bytes);
  return Array.from(bytes).map(function(value) { return value.toString(16).padStart(2, '0'); }).join('');
}
async function saveShippingAddress(event) {
  if (event) event.preventDefault();
  var editor = shippingAddressEditor;
  if (!editor || editor.saving || editor.submission || !editor.view || !editor.view.editable) return;
  var firstName = document.getElementById('address_first_name').value.trim();
  var lastName = document.getElementById('address_last_name').value.trim();
  var country = document.getElementById('address_country').value.trim();
  var countryCode = document.getElementById('address_country_code').value.trim();
  if (!firstName && !lastName) { addressEditorMessage('请填写收件人姓名（名或姓至少一项）。', true); return; }
  if (!document.getElementById('address_city').value.trim() || !document.getElementById('address_address').value.trim() || (!country && !countryCode)) {
    addressEditorMessage('请填写街道地址、城市和国家信息。', true); return;
  }
  if (countryCode && !/^[A-Z]{2}$/.test(countryCode)) { addressEditorMessage('国家代码应为两位大写 ISO 代码，例如 US。', true); return; }
  var patch = {};
  shippingAddressFields.forEach(function(field) {
    var value = document.getElementById('address_' + field[0]).value.trim();
    if (value !== String(editor.view.address[field[0]] || '').trim()) patch[field[0]] = value;
  });
  if (!Object.keys(patch).length) { addressEditorMessage('请先修改需要调整的地址字段。', false); return; }
  editor.submission = { body: { expectedAddress: editor.view.address, patch: patch, idempotencyKey: newShippingAddressKey() } };
  shippingAddressSubmissions[editor.ticketNo] = editor.submission;
  await submitShippingAddressEditor(editor);
}
async function retryShippingAddressSubmission() {
  var editor = shippingAddressEditor;
  if (!editor || editor.saving || !editor.submission || editor.submission.requestId) return;
  await submitShippingAddressEditor(editor);
}
async function submitShippingAddressEditor(editor) {
  editor.saving = true; renderShippingAddressEditor(editor);
  try {
    var response = await fetch(API + '/tickets/' + encodeURIComponent(editor.ticketNo) + '/shipping-address', {
      method: 'PATCH', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(editor.submission.body)
    });
    var data = await response.json();
    editor.saving = false;
    if (!addressEditorActive(editor)) return;
    if (!response.ok || !data.ok) {
      if (response.status >= 400 && response.status < 500) {
        editor.submission.request = { status: 'failed', errorMessage: data.error || '请求未接受，请核对地址后重试' };
      }
      renderShippingAddressEditor(editor);
      addressEditorMessage(data.error || '提交结果尚未确认，请重试同一请求。', true);
      return;
    }
    editor.submission.request = data.request;
    editor.submission.requestId = String(data.request.id);
    renderShippingAddressEditor(editor);
    if (currentTicket && currentTicket.public_ticket_no === editor.ticketNo) {
      var cardStatus = document.getElementById('shippingAddressStatus');
      if (cardStatus) cardStatus.textContent = '修改已提交，正在同步到店匠';
    }
    pollShippingAddressRequest(editor);
  } catch (_error) {
    editor.saving = false;
    if (!addressEditorActive(editor)) return;
    renderShippingAddressEditor(editor);
    addressEditorMessage('网络响应中断，结果尚未确认。请重试同一请求，不会另建修改任务。', true);
  }
}
function refreshShippingAddressRequest() {
  var editor = shippingAddressEditor;
  if (!editor || !editor.submission || !editor.submission.requestId) return;
  editor.pollCount = 0;
  clearTimeout(editor.pollTimer);
  pollShippingAddressRequest(editor);
}
async function pollShippingAddressRequest(editor) {
  if (!addressEditorActive(editor) || editor.polling || !editor.submission || !editor.submission.requestId) return;
  editor.polling = true;
  var keepPolling = false;
  try {
    var response = await fetch(API + '/tickets/' + encodeURIComponent(editor.ticketNo) + '/shipping-address/requests/' + encodeURIComponent(editor.submission.requestId),
      { credentials: 'same-origin', cache: 'no-store' });
    var data = await response.json();
    if (!addressEditorActive(editor)) return;
    if (!response.ok || !data.ok) throw new Error(data.error || '暂时无法查询结果');
    editor.submission.request = data.request;
    renderShippingAddressEditor(editor);
    keepPolling = ['pending', 'processing', 'uncertain'].indexOf(data.request.status) !== -1;
    if (currentTicket && currentTicket.public_ticket_no === editor.ticketNo && ['failed', 'conflict', 'uncertain'].indexOf(data.request.status) !== -1) {
      var failedStatus = document.getElementById('shippingAddressStatus');
      if (failedStatus) failedStatus.textContent = data.request.errorMessage || '地址修改尚未完成，请打开编辑窗口查看结果';
    }
    if (data.request.status === 'succeeded' && currentTicket && currentTicket.public_ticket_no === editor.ticketNo) {
      var summary = document.getElementById('shippingAddressSummary');
      if (summary) summary.innerHTML = shippingAddressSummary(data.request.afterAddress || data.request.desiredAddress);
      var status = document.getElementById('shippingAddressStatus');
      if (status) status.textContent = '已同步到店匠 · ' + formatTime(data.request.completedAt || data.request.updatedAt);
      delete shippingAddressSubmissions[editor.ticketNo];
    }
  } catch (error) {
    if (addressEditorActive(editor)) addressEditorMessage(error.message || '结果查询失败，请刷新结果。', true);
  } finally {
    editor.polling = false;
    if (keepPolling && addressEditorActive(editor)) {
      editor.pollCount++;
      if (editor.pollCount < 60) editor.pollTimer = setTimeout(function() { pollShippingAddressRequest(editor); }, 3000);
      else addressEditorMessage('后台仍在处理，可以关闭窗口，稍后重新打开或刷新结果。', false);
    }
  }
}

</script>
