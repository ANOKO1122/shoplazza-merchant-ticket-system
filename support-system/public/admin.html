<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服后台 - 工单管理</title>
<link rel="stylesheet" href="/admin-base.css">
</head>
<body>
<div id="app"><div class="login-page"><div class="login-card" style="text-align:center;color:var(--text-muted);padding:60px 36px">加载中...</div></div></div>
<script>
var API='/api/admin';var currentStatus='all';var currentPage=1;var currentTicket=null;var me=null;var timeField='created_at';var timeRange='';
function sd(s){return s&&s.indexOf('.')!==-1?s:s+'.myshoplaza.com'}
function $(s){return document.querySelector(s)}function $$(s){return document.querySelectorAll(s)}
function formatTime(i){if(!i)return'';var d=new Date(i);if(isNaN(d.getTime()))return'';var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0'),h=String(d.getHours()).padStart(2,'0'),mi=String(d.getMinutes()).padStart(2,'0'),s=String(d.getSeconds()).padStart(2,'0');return y+'-'+m+'-'+dy+' '+h+':'+mi+':'+s}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ticketPreviewUrl(n){return'/thinkpro-admin/ticket-preview?ticket='+encodeURIComponent(n||'')}
function orderPreviewUrl(s,o,e){var u='/thinkpro-admin/ticket-preview?store='+encodeURIComponent(s||'')+'&order='+encodeURIComponent(o||'');if(e)u+='&email='+encodeURIComponent(e);return u}
function showToast(m,t){var d=document.createElement('div');d.className='toast '+(t||'success');d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2000)}
function setTimeField(v){timeField=v;currentPage=1;loadTickets()}function setTimeRange(v){timeRange=v;currentPage=1;loadTickets()}
function statusLabelRow(t){var g=[];if(t.status==='open')g.push('<span class="tag tag-blue">待处理</span>');else if(t.status==='waiting')g.push('<span class="tag tag-orange">等待顾客</span>');else if(t.status==='closed')g.push('<span class="tag tag-gray">已关闭</span>');if(t.arbitration_requested&&t.status!=='closed')g.push('<span class="tag tag-red">仲裁</span>');return'<div class="status-tags">'+g.join('')+'</div>'}function issueTypeLabel(v){var m={Unknow:'未知',Fraud:'欺诈',Unauthorized:'未授权','Products Discrepancies':'商品不符','Product Not Received':'未收到商品','Defective Merchandise':'商品瑕疵','Incorrect Transaction':'交易错误','Wrong address':'地址错误','Credit Not Processed':'退款未处理'};return v?(v+' ('+(m[v]||'')+')'):''}
(async function init(){try{var r=await fetch(API+'/me',{credentials:'same-origin'});var d=await r.json();if(d.ok){me=d.agent;renderMain()}else{location.replace('/login?redirect='+encodeURIComponent(location.pathname))}}catch(e){location.replace('/login?redirect='+encodeURIComponent(location.pathname))}})();async function doLogout(){await fetch(API+'/logout',{method:'POST',credentials:'same-origin'});location.replace('/login')}
function renderMain(){$('#app').innerHTML='<div class="app"><aside class="sidebar"><div class="sidebar-header"><img src="/assets/logo.png" onerror="this.style.display=\'none\'"><span class="sidebar-title">客服后台</span></div><nav class="nav-menu"><a class="nav-item active" href="/thinkpro-admin"><span class="nav-icon">📋</span>工单处理</a><a class="nav-item" href="/thinkpro-admin/stores"><span class="nav-icon">🏪</span>店铺管理</a><a class="nav-item" href="/thinkpro-admin/emails"><span class="nav-icon">📧</span>订单邮件管理</a><a class="nav-item" href="/thinkpro-admin/email-templates"><span class="nav-icon">📨</span>邮件模板</a><a class="nav-item" href="/thinkpro-admin/settings"><span class="nav-icon">⚙️</span>系统设置</a><a class="nav-item" href="/thinkpro-admin/logs"><span class="nav-icon">📋</span>系统日志</a><a class="nav-item" href="/mailpit/" target="_blank"><span class="nav-icon">📬</span>邮件调试</a></nav><div class="sidebar-footer"><span>v1.0.0</span><span>'+me.name+'</span></div></aside><div class="main" id="mainArea"></div></div>';buildTicketLayout();loadStats();loadTickets();loadPendingCount();setInterval(loadPendingCount,30000)}
function buildTicketLayout(){var s=function(s){return currentStatus===s?' sel':''};var to='<select id="timeFieldSel" onchange="setTimeField(this.value)" style="padding:4px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;background:#fff"><option value="created_at"'+(timeField==='created_at'?' selected':'')+'>创建时间</option><option value="updated_at"'+(timeField==='updated_at'?' selected':'')+'>最后更新</option></select>';var ro='<select id="timeRangeSel" onchange="setTimeRange(this.value)" style="padding:4px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;background:#fff"><option value=""'+(timeRange===''?' selected':'')+'>全部时间</option><option value="24h"'+(timeRange==='24h'?' selected':'')+'>24小时</option><option value="2d"'+(timeRange==='2d'?' selected':'')+'>2天</option><option value="7d"'+(timeRange==='7d'?' selected':'')+'>一周</option></select>';var tf='<div style="display:flex;gap:6px;align-items:center;margin-left:12px">'+to+ro+'</div>';$('#mainArea').innerHTML='<header class="topbar"><div class="breadcrumb">首页 / <strong>工单处理</strong></div><div class="topbar-right"><span id="pendingBadge" style="display:none;background:#fff2f0;border:1px solid #ffccc7;border-radius:4px;padding:4px 10px;font-size:12px;color:#ff4d4f;margin-right:8px;cursor:pointer" onclick="location.href=\'/thinkpro-admin/emails?status=pending&amp;email_type=agent_reply_notice\'" title="点击查看待发送邮件"></span><button class="btn-logout" onclick="doLogout()">退出</button></div></header><div class="content"><div class="stats-row"><div class="stat-card'+s('all')+'" onclick="filterByStatus(\'all\',this)"><span class="stat-num" id="statAll">-</span><span class="stat-label">全部工单</span></div><div class="stat-card'+s('open')+'" onclick="filterByStatus(\'open\',this)"><span class="stat-num" id="statOpen">-</span><span class="stat-label">待处理</span></div><div class="stat-card'+s('waiting')+'" onclick="filterByStatus(\'waiting\',this)"><span class="stat-num" id="statWait">-</span><span class="stat-label">等待顾客</span></div><div class="stat-card'+s('closed')+'" onclick="filterByStatus(\'closed\',this)"><span class="stat-num" id="statClosed">-</span><span class="stat-label">已关闭</span></div></div><div class="split-view"><div class="panel-left"><div class="table-header"><span class="table-title">工单列表<div class="search-box"><span class="sicon">🔍</span><input type="text" id="searchInput" placeholder="搜索工单号/订单号/邮箱" onkeydown="if(event.key==\'Enter\')loadTickets()"></div></span>'+tf+'</div><div class="table-scroll"><table><thead><tr><th style="width:120px">工单号</th><th>店铺</th><th>店铺域名</th><th>订单号</th><th>顾客邮箱</th><th>问题类型</th><th style="width:140px">状态</th><th style="width:140px">创建时间</th><th style="width:140px">最后更新</th></tr></thead><tbody id="ticketTbody"></tbody></table></div><div class="pagination" id="pagination"></div></div><div class="panel-right" id="detailPanel"><div class="detail-empty">← 点击左侧工单查看详情</div></div></div></div>'}
async function loadStats(){try{var r=await fetch(API+'/tickets?page_size=1&status=all',{credentials:'same-origin'});var d=await r.json();if(!d.ok)return;updateStat('statAll',d.total||0);var r2=await fetch(API+'/tickets?page_size=1&status=open',{credentials:'same-origin'});var o=(await r2.json()).total||0;updateStat('statOpen',o);var r3=await fetch(API+'/tickets?page_size=1&status=waiting',{credentials:'same-origin'});var w=(await r3.json()).total||0;updateStat('statWait',w);var r4=await fetch(API+'/tickets?page_size=1&status=closed',{credentials:'same-origin'});var c=(await r4.json()).total||0;updateStat('statClosed',c)}catch(e){}}
function updateStat(i,v){var e=document.getElementById(i);if(e)e.textContent=v}
function filterByStatus(s,c){currentStatus=s;currentPage=1;buildTicketLayout();loadTickets();loadStats();loadPendingCount()}
async function loadTickets(){var q=($('#searchInput')||{}).value||'';var p=new URLSearchParams();if(currentStatus!=='all')p.set('status',currentStatus);if(q)p.set('q',q);if(timeField)p.set('time_field',timeField);if(timeRange)p.set('time_range',timeRange);p.set('page',String(currentPage));p.set('page_size','30');try{var r=await fetch(API+'/tickets?'+p.toString(),{credentials:'same-origin'});var d=await r.json();if(!d.ok)return;renderTable(d.tickets,d.total)}catch(e){}}
function renderTable(tk,to){var tb=$('#ticketTbody');if(!tb)return;var h='';tk.forEach(function(t){h+='<tr onclick="selectTicket(this,\''+t.public_ticket_no+'\')" data-tno="'+t.public_ticket_no+'"><td style="text-align:center;font-weight:600">'+t.public_ticket_no+'</td><td style="text-align:center">'+(t.store_name||'')+'</td><td style="text-align:center">'+sd(t.store_subdomain||'')+'</td><td style="text-align:center">'+(t.order_id||'')+'</td><td style="text-align:center">'+(t.customer_email||'')+'</td><td style="text-align:center">'+(t.issue_type||'')+'</td><td style="text-align:center">'+statusLabelRow(t)+'</td><td style="text-align:center;white-space:nowrap">'+formatTime(t.created_at)+'</td><td style="text-align:center;white-space:nowrap">'+formatTime(t.updated_at)+'</td></tr>'});tb.innerHTML=h;var tp=Math.ceil(to/30)||1;var pg='<button '+(currentPage<=1?'disabled':'')+' onclick="goPage('+(currentPage-1)+')">上一页</button>';for(var i=1;i<=tp&&i<=20;i++){pg+='<button class="'+(i===currentPage?'active':'')+'" onclick="goPage('+i+')">'+i+'</button>'}pg+='<button '+(currentPage>=tp?'disabled':'')+' onclick="goPage('+(currentPage+1)+')">下一页</button>';var pe=$('#pagination');if(pe)pe.innerHTML=pg}
function goPage(p){currentPage=p;loadTickets()}
function selectTicket(r,tn){$$('.panel-left tr').forEach(function(r){r.classList.remove('selected')});r.classList.add('selected');loadDetail(tn)}
async function loadDetail(tn){var p=$('#detailPanel');p.innerHTML='<div class="detail-empty">加载中...</div>';try{var r=await fetch(API+'/tickets/'+tn,{credentials:'same-origin'});var d=await r.json();if(!d.ok){p.innerHTML='<div class="detail-empty">加载失败</div>';return}currentTicket=d.ticket;renderDetail(d)}catch(e){p.innerHTML='<div class="detail-empty">加载失败</div>'}}
function renderDetail(d){var t=d.ticket,o=d.order||{},ms=d.messages;var pu=ticketPreviewUrl(t.public_ticket_no);var st=t.status==='closed'?'已关闭':(t.status==='waiting'?'等待顾客':'待处理');var ih='';if(Array.isArray(o.items)){ih=o.items.map(function(it){var img=itemImageUrl(it);return'<div style="display:flex;align-items:center;gap:6px;font-size:13px;line-height:1.6;margin-bottom:4px"><span style="color:#262626">'+(it.product_title||it.title||it.name||'')+'</span> <span style="color:#8c8c8c">x'+(it.quantity||1)+'</span>'+(img?' <a href="'+esc(img)+'" target="_blank" style="color:#1890ff;font-size:12px;text-decoration:none" title="查看商品图片">图片</a>':'')+'</div>'}).join('')}var mh='';var rl={customer:'顾客',agent:'客服',system:'系统',platform:'平台'};ms.forEach(function(m){mh+='<div class="msg-item '+m.sender_type+'"><div class="msg-meta"><span class="msg-role '+m.sender_type+'">'+(rl[m.sender_type]||m.sender_type)+'</span><span class="msg-time">'+formatTime(m.created_at)+'</span>'+(m.sender_type==='agent'?'<div class="msg-actions"><button class="btn-sm btn-sm-danger" onclick="recallMsg('+m.id+')" title="撤回">撤回</button></div>':'')+'</div><div class="msg-content">'+m.content+'</div>'+renderAdminAttachments(m.attachments)+'</div>'});var rb=t.status==='closed'?'<div class="reply-bar"><div class="reply-actions"><button class="btn btn-primary" style="width:auto;padding:9px 20px" onclick="reopenTicket()">重新打开</button></div></div>':'<div class="reply-bar"><div class="image-preview-area" id="adminImagePreview" style="display:none"></div><textarea id="replyBox" placeholder="输入回复内容..."></textarea><div class="reply-actions"><div class="panel-actions"><button class="btn-sm btn-sm-danger" onclick="closeTicketManual()">关闭工单</button><button class="btn-sm" style="background:#fa8c16;color:#fff" onclick="inviteNewTicket()">发起新工单</button><button class="btn-sm" onclick="sendTicketNotifyEmail()">发送通知邮件</button></div><div style="display:flex;align-items:center;gap:6px"><label class="btn-img-upload" title="上传图片">上传图片<input type="file" id="adminImageInput" multiple accept="image/jpeg,image/png,image/webp" style="display:none" onchange="onAdminImagesSelected()"></label><button class="btn btn-primary" style="width:auto;padding:9px 20px" onclick="sendReply()">发送</button></div></div></div>';$('#detailPanel').innerHTML='<div class="detail-content"><div class="detail-header"><h3>#'+t.public_ticket_no+'</h3><div><span class="tag tag-blue" style="margin-right:6px">'+st+'</span>'+(t.arbitration_requested&&t.status!=='closed'?'<span class="tag tag-red">仲裁</span>':'')+'</div></div><div class="detail-scroll"><div class="info-grid"><div class="info-item"><span class="info-label">店铺</span><span class="info-value">'+(t.store_name||'')+'</span></div><div class="info-item"><span class="info-label">店铺域名</span><span class="info-value">'+sd(t.store_subdomain||'')+'</span></div><div class="info-item"><span class="info-label">订单号</span><span class="info-value">'+(t.order_id||'')+'</span></div><div class="info-item"><span class="info-label">订单编号</span><span class="info-value">'+(t.order_number||'')+'</span></div><div class="info-item"><span class="info-label">客户视角预览</span><span class="info-value"><a href="'+esc(pu)+'" target="_blank" rel="noopener">打开预览页面</a></span></div><div class="info-item"><span class="info-label">顾客邮箱</span><span class="info-value">'+(t.customer_email||'')+'</span></div><div class="info-item"><span class="info-label">顾客姓名</span><span class="info-value">'+(t.customer_name||o.customer_name||'')+'</span></div><div class="info-item"><span class="info-label">问题类型</span><span class="info-value">'+issueTypeLabel(t.issue_type)+'</span></div><div class="info-item"><span class="info-label">金额</span><span class="info-value">'+(o.order_currency||'USD')+' '+(o.order_amount||'')+'</span></div><div class="info-item"><span class="info-label">支付方式</span><span class="info-value">'+(o.payment_method||'无')+'</span></div><div class="info-item"><span class="info-label">卡号后四位</span><span class="info-value">'+(o.card_last4||'无')+'</span></div><div class="info-item"><span class="info-label">运单号</span><span class="info-value">'+(o.tracking_no||'未发货')+'</span></div>'+(ih?'<div class="info-item"><span class="info-label">商品</span><span class="info-value">'+ih+'</span></div>':'')+(o.paid_at?'<div class="info-item"><span class="info-label">下单时间</span><span class="info-value">'+formatTime(o.paid_at)+'</span></div>':'')+'<div class="info-item"><span class="info-label">工单创建时间</span><span class="info-value">'+formatTime(t.created_at)+'</span></div><div class="info-item"><span class="info-label">更新时间</span><span class="info-value">'+formatTime(t.updated_at)+'</span></div></div><div style="font-weight:600;font-size:14px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)">消息记录</div><div class="msg-list">'+mh+'</div></div>'+rb+'</div>'}
async function sendReply(){if(!currentTicket)return;var b=$('#replyBox');var c=b.value.trim();var hasImages=adminSelectedFiles.length>0;if(!c&&!hasImages)return;try{var fd=new FormData();fd.append('content',c);adminSelectedFiles.forEach(function(f){fd.append('images',f)});var r=await fetch(API+'/tickets/'+currentTicket.public_ticket_no+'/messages',{method:'POST',credentials:'same-origin',body:fd});var d=await r.json();if(d.ok){b.value='';clearAdminImages();loadDetail(currentTicket.public_ticket_no);loadTickets();loadStats();loadPendingCount()}else alert(d.error||'发送失败')}catch(e){alert('网络错误')}}
async function closeTicketManual(){if(!currentTicket)return;if(!confirm('确认关闭此工单？'))return;try{var r=await fetch(API+'/tickets/'+currentTicket.public_ticket_no+'/status',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'closed'})});var d=await r.json();if(d.ok){loadDetail(currentTicket.public_ticket_no);loadTickets();loadStats()}else alert(d.error||'关闭失败')}catch(e){alert('网络错误')}}
async function reopenTicket(){if(!currentTicket)return;if(!confirm('确认重新打开此工单？'))return;try{var r=await fetch(API+'/tickets/'+currentTicket.public_ticket_no+'/reopen',{method:'POST',credentials:'same-origin'});var d=await r.json();if(d.ok){loadDetail(currentTicket.public_ticket_no);loadTickets();loadStats()}else alert(d.error||'重新打开失败')}catch(e){alert('网络错误')}}
async function sendTicketNotifyEmail(){if(!currentTicket)return;if(!confirm('确认给顾客发送客服回复通知邮件？'))return;try{var r=await fetch(API+'/tickets/'+currentTicket.public_ticket_no+'/notify-email',{method:'POST',credentials:'same-origin'});var d=await r.json();if(d.ok){showToast('通知邮件任务已创建','success')}else{showToast(d.error||'通知邮件发送失败','error')}}catch(e){showToast('网络错误','error')}}
async function inviteNewTicket(){if(!currentTicket)return;if(!confirm('确认为此订单发起新的工单邀请邮件？\\n\\n顾客将收到一封新邮件，点击后可创建新的工单。旧工单不受影响。'))return;try{var r=await fetch(API+'/tickets/'+currentTicket.public_ticket_no+'/invite-new-ticket',{method:'POST',credentials:'same-origin'});var d=await r.json();if(d.ok){showToast('新工单邀请邮件已发送','success')}else{showToast(d.error||'发起失败','error')}}catch(e){showToast('网络错误','error')}}
async function recallMsg(id){if(!confirm('确认撤回此消息？'))return;try{var r=await fetch(API+'/tickets/'+currentTicket.public_ticket_no+'/messages/'+id,{method:'DELETE',credentials:'same-origin'});var d=await r.json();if(d.ok)loadDetail(currentTicket.public_ticket_no);else alert(d.error||'撤回失败')}catch(e){alert('网络错误')}}
async function loadPendingCount(){try{var r=await fetch(API+'/email-jobs/pending-count',{credentials:'same-origin'});var d=await r.json();if(!d.ok)return;var b=$('#pendingBadge');if(!b)return;if(d.count>0){b.style.display='inline';b.textContent='📨 '+d.count+' 封提醒邮件待发送'}else{b.style.display='none'}}catch(e){}}
var adminSelectedFiles=[];function renderAdminAttachments(a){if(!a||!a.length)return'';var h='<div class="msg-images">';a.forEach(function(u){h+='<img src="'+esc(u)+'" class="chat-img" onclick="viewAdminImage(\''+esc(u)+'\')" loading="lazy">'});h+='</div>';return h}function viewAdminImage(u){var lb=document.createElement('div');lb.className='image-lightbox';lb.innerHTML='<img src="'+u+'">';lb.onclick=function(){lb.remove()};document.body.appendChild(lb)}function onAdminImagesSelected(){var i=$('#adminImageInput');if(!i||!i.files)return;for(var j=0;j<i.files.length;j++){if(adminSelectedFiles.length>=3)break;adminSelectedFiles.push(i.files[j])}i.value='';renderAdminImagePreviews()}function renderAdminImagePreviews(){var c=$('#adminImagePreview');if(!c)return;if(!adminSelectedFiles.length){c.style.display='none';c.innerHTML='';return}c.style.display='flex';var h='';adminSelectedFiles.forEach(function(f,idx){var u=URL.createObjectURL(f);h+='<div class="image-preview-item"><img src="'+u+'" alt="preview"><button class="remove-btn" onclick="removeAdminImage('+idx+')">×</button></div>'});c.innerHTML=h}function removeAdminImage(idx){adminSelectedFiles.splice(idx,1);renderAdminImagePreviews()}function clearAdminImages(){adminSelectedFiles=[];var c=$('#adminImagePreview');if(c){c.style.display='none';c.innerHTML=''}}
function itemImageUrl(it){if(!it)return'';var img=it.image;var src='';if(typeof img==='object'&&img)src=img.src||'';else if(typeof img==='string')src=img;if(!src)src=it.product_image||it.image_src||'';if(!src)return'';if(src.indexOf('//')===0)return'https:'+src;if(src.indexOf('http')===0)return src;return''}
</script>
</body>
</html>
