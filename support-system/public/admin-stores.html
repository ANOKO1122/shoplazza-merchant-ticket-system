<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服后台 - 店铺管理</title>
<link rel="stylesheet" href="/admin-base.css">
<script src="/admin-shell.js"></script>

<style>
.store-table { table-layout: auto; min-width: 960px; }
.stores-topbar { height: auto; min-height: 56px; flex-wrap: wrap; gap: 12px; padding: 12px 20px; }
.stores-topbar .topbar-right { flex-wrap: wrap; gap: 8px; }
.stores-content { padding: 20px 24px; overflow: auto; display: block; }
.store-table-wrap { background: var(--bg-card); border-radius: 8px; box-shadow: var(--shadow); overflow-x: auto; }
.store-table th, .store-table td { padding: 14px 18px; vertical-align: middle; }
.store-table .col-id { width: 64px; text-align: center; }
.store-table .col-domain { min-width: 240px; text-align: left; }
.store-table .col-name { min-width: 140px; text-align: left; }
.store-table .col-toggle { width: 88px; text-align: center; }
.store-table .col-wh { min-width: 276px; }
.store-table .col-ops { width: 168px; white-space: nowrap; }
.wh-panel { width: 240px; max-width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.wh-status { font-size: 12px; color: var(--text-secondary); overflow-wrap: anywhere; text-align: center; }
.wh-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 16px; row-gap: 4px; text-align: left; }
.wh-item { font-size: 12px; line-height: 1.5; }
.wh-actions { display: flex; gap: 8px; justify-content: center; }
.wh-actions .btn-sm { min-height: 32px; padding: 4px 10px; font-size: 12px; }
.wh-btn-refresh { color: var(--text-secondary); }
.wh-btn-refresh:hover { color: var(--primary); border-color: var(--primary); }
.wh-actions .btn-sm:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.wh-actions .btn-sm:disabled { opacity: 0.55; cursor: wait; }
.wh-btn-reg { background: var(--primary); color: #fff; border: none; }
.wh-btn-unreg { background: var(--danger); color: #fff; border: none; }
.row-actions { display: flex; gap: 8px; justify-content: center; align-items: center; }
.row-actions .btn-sm { padding: 4px 10px; font-size: 12px; }
@media (max-width: 760px) {
  .stores-topbar { padding: 12px; }
  .stores-content { padding: 16px 12px; }
}
</style>
<script src="/safe-render.js"></script>
</head>
<body>
<div id="app"><div class="login-page"><div class="login-card" style="text-align:center;color:var(--text-muted);padding:60px 36px">加载中...</div></div></div>
<script>
var API='/api/admin';var me=null;
function $(s){return document.querySelector(s)}function $$(s){return document.querySelectorAll(s)}
function showToast(m,t){var d=document.createElement('div');d.className='toast '+(t||'success');d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2000)}

(async function init(){var bootEpoch=adminEpoch();try{if(window.__adminAgent){me=window.__adminAgent;if(bootEpoch!==adminEpoch())return;renderMain();return;}var r=await fetch(API+'/me',{credentials:'same-origin'});var d=await r.json();if(bootEpoch!==adminEpoch())return;if(d.ok){me=d.agent;window.__adminAgent=me;renderMain()}else{location.replace('/login?redirect='+encodeURIComponent('/thinkpro-admin/stores'))}}catch(e){location.replace('/login?redirect='+encodeURIComponent('/thinkpro-admin/stores'))}})();async function doLogout(){await fetch(API+'/logout',{method:'POST',credentials:'same-origin'});location.replace('/login')}

function renderMain(){adminFrame('/thinkpro-admin/stores');buildLayout();loadStores()}

function buildLayout(){$('#mainArea').innerHTML='<header class="topbar stores-topbar"><div class="breadcrumb">首页 / <strong>店铺管理</strong></div><div class="topbar-right"><button class="btn btn-primary" style="padding:6px 14px;width:auto" onclick="showStoreModal()">+ 新增店铺</button><button class="btn btn-outline" style="padding:6px 14px;width:auto;background:#fff;color:var(--primary);border:1px solid var(--primary);border-radius:6px;cursor:pointer;font-size:13px" onclick="checkAllWebhooks()">🔄 检查全部Webhook</button><button class="btn-logout" onclick="doLogout()">退出</button></div></header><div class="content stores-content"><div class="store-table-wrap"><table class="store-table"><thead><tr><th class="col-id">ID</th><th class="col-domain">店铺域名</th><th class="col-name">店铺名称</th><th class="col-toggle">启停</th><th class="col-wh">Webhook 状态</th><th class="col-ops">操作</th></tr></thead><tbody id="storeTbody"></tbody></table></div></div>'}

var webhookCache = {};
var WH_CACHE_KEY = 'support_webhook_cache';

// 从 localStorage 加载上次检查结果
function loadWebhookCacheFromStorage(){
  try{
    var raw = localStorage.getItem(WH_CACHE_KEY);
    if(!raw) return;
    var saved = JSON.parse(raw);
    for(var k in saved){
      if(saved.hasOwnProperty(k)) webhookCache[k] = saved[k];
    }
  }catch(e){ /* ignore corrupt data */ }
}

// 将当前检查结果持久化到 localStorage
function saveWebhookCacheToStorage(){
  try{
    var toSave = {};
    for(var k in webhookCache){
      if(!webhookCache.hasOwnProperty(k) || !webhookCache[k]) continue;
      var entry = webhookCache[k];
      var topics = Array.isArray(entry.topics) ? entry.topics.map(function(t){
        return { topic: t.topic, registered: !!t.registered };
      }) : [];
      toSave[k] = {
        ok: entry.ok !== false,
        registered: !!entry.registered,
        topics: topics,
        error: entry.ok === false ? (entry.error || '检查失败') : null,
        checkedAt: Date.now()
      };
    }
    localStorage.setItem(WH_CACHE_KEY, JSON.stringify(toSave));
  }catch(e){ /* ignore quota errors */ }
}

// 清除某个店铺的缓存（删除店铺时调用）
function removeWebhookCacheEntry(storeId){
  delete webhookCache[storeId];
  try{
    var raw = localStorage.getItem(WH_CACHE_KEY);
    if(raw){
      var saved = JSON.parse(raw);
      delete saved[String(storeId)];
      localStorage.setItem(WH_CACHE_KEY, JSON.stringify(saved));
    }
  }catch(e){}
}

async function fetchWebhookStatus(id){
  try{
    var r=await fetch(API+'/stores/'+id+'/webhook/status',{credentials:'same-origin'});
    var d=await r.json();
    webhookCache[id]=d;
    saveWebhookCacheToStorage();
    return d;
  }catch(e){ webhookCache[id]={ok:false,registered:false,error:'Network error'}; return webhookCache[id]; }
}

// 生成单行 HTML（不含 <tr>），供 loadStores / saveStore 复用
function webhookTopicName(topic){
  var names={'orders/paid':'支付','orders/create':'下单','orders/fulfilled':'已发货','orders/partially_fulfilled':'部分发货','fulfillments/create':'新增物流','fulfillments/update':'更新物流','orders/partially_refunded':'部分退款','orders/refunded':'全额退款','orders/cancelled':'订单取消','orders/finished':'订单完成'};
  return names[topic]||topic;
}

function buildStoreRowHTML(s){
  var t='<label class="toggle"><input type="checkbox" '+(s.enabled?'checked':'')+' onchange="toggleStore('+Number(s.id)+',this.checked)"><span class="slider"></span></label>';
  var n='<span id="sname_display_'+Number(s.id)+'">'+(s.store_name?escapeHtml(s.store_name):'<span style="color:#8c8c8c">-</span>')+'</span>';
  var w='<div class="wh-panel"><div class="wh-status" id="wh_status_'+Number(s.id)+'" aria-live="polite">未检查</div>'+
    '<div class="wh-actions" id="wh_actions_'+Number(s.id)+'">'+
    '<button type="button" class="btn-sm wh-btn-refresh" onclick="checkSingleWebhook('+Number(s.id)+')">刷新</button>'+
    '<button class="btn-sm wh-btn-reg" onclick="registerWebhook('+Number(s.id)+')">注册</button>'+
    '<button class="btn-sm wh-btn-unreg" onclick="unregisterWebhook('+Number(s.id)+')">注销</button></div></div>';
  var ops='<div class="row-actions"><button class="btn-sm" style="background:var(--primary);color:#fff;border:none" data-store-id="'+Number(s.id)+'" data-subdomain="'+escapeHtml(s.subdomain)+'" data-store-name="'+escapeHtml(s.store_name||'')+'" onclick="showEditStoreModal(Number(this.getAttribute(\'data-store-id\')),this.getAttribute(\'data-subdomain\'),this.getAttribute(\'data-store-name\'))">编辑</button><button class="btn-sm btn-sm-danger" onclick="delStore('+Number(s.id)+')">删除</button></div>';
  return '<td class="col-id">'+Number(s.id)+'</td><td class="col-domain">'+escapeHtml(s.subdomain)+'</td><td class="col-name">'+n+'</td><td class="col-toggle">'+t+'</td><td class="col-wh">'+w+'</td><td class="col-ops">'+ops+'</td>';
}

// 追加一行到表格（不自动检查 webhook，用户可手动点击检查或使用"检查全部"）
function appendStoreRow(s){
  removeEmptyRow();
  var tr=document.createElement('tr');
  tr.id='storeRow_'+s.id;
  tr.innerHTML=buildStoreRowHTML(s);
  $('#storeTbody').appendChild(tr);
}

// 移除"暂无店铺"占位行
function removeEmptyRow(){
  var empty=document.getElementById('emptyRow');
  if(empty) empty.remove();
}

// 当表格无数据行时显示占位
function ensureEmptyRow(){
  var tbody=$('#storeTbody');
  var rows=tbody.querySelectorAll('tr:not(#emptyRow)');
  if(rows.length===0 && !document.getElementById('emptyRow')){
    var tr=document.createElement('tr');
    tr.id='emptyRow';
    tr.innerHTML='<td colspan="6" style="text-align:center;color:var(--text-muted);padding:40px">暂无店铺</td>';
    tbody.appendChild(tr);
  }
}

async function loadStores(){
  try{
    var r=await fetch(API+'/stores',{credentials:'same-origin'});
    var d=await r.json();
    if(!d.ok)return;
    var h='';
    for(var i=0;i<d.stores.length;i++){
      var s=d.stores[i];
      h+='<tr id="storeRow_'+Number(s.id)+'">'+buildStoreRowHTML(s)+'</tr>';
    }
    $('#storeTbody').innerHTML=h||'<tr id="emptyRow"><td colspan="6" style="text-align:center;color:var(--text-muted);padding:40px">暂无店铺</td></tr>';
    // 不自动检查 webhook 状态，但从 localStorage 恢复上次检查结果
    restoreWebhookCacheUI();
  }catch(e){}
}

// 页面加载后，用 localStorage 中的缓存结果更新 UI（无网络请求）
function restoreWebhookCacheUI(){
  loadWebhookCacheFromStorage();
  for(var storeId in webhookCache){
    if(webhookCache.hasOwnProperty(storeId)){
      var cached = webhookCache[storeId];
      var hasTopics = cached && cached.topics && cached.topics.length;
      if(cached && (hasTopics || cached.ok === false)) updateWebhookCell(Number(storeId), cached);
    }
  }
}

function updateWebhookCell(storeId, cached){
  var cell = document.getElementById('wh_status_'+storeId);
  if(!cell) return;
  cached = cached || { ok:false, error:'检查失败' };
  var html = '';
  if(cached.ok === false){
    var err = cached.error ? String(cached.error) : '检查失败';
    html = '<div style="color:var(--danger);font-size:12px;line-height:1.5">❌ '+escapeHtml(err.slice(0,80))+'</div>';
  } else if(cached.topics && cached.topics.length){
    html = '<div class="wh-grid">'+cached.topics.map(function(t){
      return '<div class="wh-item" style="color:'+(t.registered?'var(--success)':'var(--warning)')+'">'+(t.registered?'✅':'⚠️')+' '+escapeHtml(webhookTopicName(t.topic))+'</div>';
    }).join('')+'</div>';
  } else if(cached.registered){
    html = '<div style="color:var(--warning);font-size:12px">⚠️ 分项状态未保存，请再检查</div>';
  } else if(cached.error){
    html = '<div style="color:var(--danger);font-size:12px">❌ '+escapeHtml(String(cached.error).slice(0,80))+'</div>';
  } else {
    html = '<div style="color:var(--warning);font-size:12px">⚠️ 未注册</div>';
  }
  cell.innerHTML = html;
}

// 手动检查单个店铺 webhook 状态
var webhookBusy = {};
function beginWebhookAction(storeId){
  if(webhookBusy[storeId]) return false;
  webhookBusy[storeId] = true;
  setWebhookActionsDisabled(storeId, true);
  return true;
}
function setWebhookActionsDisabled(storeId, disabled){
  var actions = document.getElementById('wh_actions_'+storeId);
  if(actions) actions.querySelectorAll('button').forEach(function(button){ button.disabled = disabled; });
}
function endWebhookAction(storeId){
  delete webhookBusy[storeId];
  setWebhookActionsDisabled(storeId, false);
}
async function checkSingleWebhook(storeId){
  if(!beginWebhookAction(storeId)) return;
  try{
    var cell = document.getElementById('wh_status_'+storeId);
    if(cell) cell.innerHTML = '<span style="font-size:12px;color:var(--text-muted)">⏳ 检查中...</span>';
    var status = await fetchWebhookStatus(storeId);
    updateWebhookCell(storeId, status);
  }catch(e){ updateWebhookCell(storeId, {ok:false,error:'检查失败，请重试'}); }
  finally{ endWebhookAction(storeId); }
}

// 手动检查全部店铺 webhook 状态（串行，避免触发频率限制）
var checkAllRunning = false;
async function checkAllWebhooks(){
  if(checkAllRunning){ showToast('正在检查中，请稍候...','warning'); return; }
  checkAllRunning = true;
  var btn = document.querySelector('#mainArea .btn-outline');
  if(btn){ btn.disabled = true; btn.textContent = '⏳ 检查中...'; }
  try{
    var rows = document.querySelectorAll('#storeTbody tr[id^="storeRow_"]');
    if(rows.length === 0){ showToast('暂无店铺','warning'); return; }
    var total = rows.length;
    var failed = 0;
    var checked = 0;
    var skipped = 0;
    for(var i = 0; i < rows.length; i++){
      var idMatch = rows[i].id.match(/^storeRow_(\d+)$/);
      if(!idMatch) continue;
      var storeId = Number(idMatch[1]);
      if(!beginWebhookAction(storeId)){ skipped++; continue; }
      checked++;
      try{
        var cell = document.getElementById('wh_status_'+storeId);
        if(cell) cell.innerHTML = '<span style="font-size:12px;color:var(--text-muted)">⏳ 检查中 ('+(i+1)+'/'+total+')...</span>';
        var status = await fetchWebhookStatus(storeId);
        if(!status || status.ok === false) failed++;
        updateWebhookCell(storeId, status);
      }finally{ endWebhookAction(storeId); }
    }
    showToast(failed || skipped
      ? ('检查完成：已刷新 '+(checked-failed)+' 个店铺，'+failed+' 个失败，跳过 '+skipped+' 个忙碌店铺')
      : ('全部 Webhook 状态已刷新 ('+checked+' 个店铺)'), failed || skipped ? 'warning' : 'success');
  }catch(e){ showToast('检查过程出错','error'); }
  finally{
    checkAllRunning = false;
    if(btn){ btn.disabled = false; btn.textContent = '🔄 检查全部Webhook'; }
  }
}

function escapeHtml(s){return SupportSafe.escape(s)}

async function registerWebhook(storeId){
  if(!beginWebhookAction(storeId)) return;
  var cell=document.getElementById('wh_status_'+storeId);
  if(cell)cell.innerHTML='<span style="font-size:12px;color:var(--text-muted)">⏳ 注册中...</span>';
  try{
    var r=await fetch(API+'/stores/'+storeId+'/webhook/register',{method:'POST',credentials:'same-origin'});
    var d=await r.json();
    if(d.ok){
      showToast(d.alreadyRegistered?'支付和发货 Webhook 都已注册':'支付和发货 Webhook 已注册','success');
    } else {
      showToast(d.error||'注册失败','error');
    }
    // 刷新状态
    var status=await fetchWebhookStatus(storeId);
    updateWebhookCell(storeId, status);
  }catch(e){showToast('网络错误','error');updateWebhookCell(storeId,{ok:false,error:'注册结果未确认，请刷新状态'});}
  finally{ endWebhookAction(storeId); }
}

async function unregisterWebhook(storeId){
  if(webhookBusy[storeId]) return;
  if(!confirm('确认注销该店铺的支付和发货 Webhook？'))return;
  if(!beginWebhookAction(storeId)) return;
  var cell=document.getElementById('wh_status_'+storeId);
  if(cell)cell.innerHTML='<span style="font-size:12px;color:var(--text-muted)">⏳ 注销中...</span>';
  try{
    var r=await fetch(API+'/stores/'+storeId+'/webhook/unregister',{method:'POST',credentials:'same-origin'});
    var d=await r.json();
    if(d.ok){
      showToast('Webhook 已注销','success');
    } else {
      showToast(d.error||'注销失败','error');
    }
    var status=await fetchWebhookStatus(storeId);
    updateWebhookCell(storeId, status);
  }catch(e){showToast('网络错误','error');updateWebhookCell(storeId,{ok:false,error:'注销结果未确认，请刷新状态'});}
  finally{ endWebhookAction(storeId); }
}

function showStoreModal(){var m=document.createElement('div');m.id='storeModal';m.innerHTML='<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:center;justify-content:center" onclick="if(event.target===this)closeModal()"><div style="background:#fff;border-radius:8px;padding:24px;width:420px;box-shadow:0 4px 16px rgba(0,0,0,0.15)"><h3 style="margin-bottom:16px">新增店铺</h3><div class="form-group"><label>店铺域名</label><input type="text" id="sSubdomain" placeholder="例如 store-a.myshoplaza.com" style="border:1px solid #d9d9d9;border-radius:6px;padding:9px 12px;width:100%;font-size:14px"></div><div class="form-group"><label>店铺名称</label><input type="text" id="sName" placeholder="可为空" style="border:1px solid #d9d9d9;border-radius:6px;padding:9px 12px;width:100%;font-size:14px"></div><div class="form-group"><label>Access Token</label><input type="text" id="sToken" style="border:1px solid #d9d9d9;border-radius:6px;padding:9px 12px;width:100%;font-size:14px"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn btn-primary" style="width:auto" onclick="saveStore()">保存</button><button class="btn-sm" onclick="closeModal()">取消</button></div></div></div>';document.body.appendChild(m)}
function closeModal(){var m=document.getElementById('storeModal');if(m)m.remove()}



async function saveStore(){var b={subdomain:$('#sSubdomain').value.trim(),store_name:$('#sName').value.trim()};if(!b.subdomain){showToast('请填写域名','error');return}b.access_token=($('#sToken')||{}).value&&$('#sToken').value.trim();if(!b.access_token){showToast('请填写Access Token','error');return}try{var r=await fetch(API+'/stores',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});var d=await r.json();if(d.ok){closeModal();if(d.store) appendStoreRow(d.store);showToast('新增成功','success')}else{showToast(d.error||'保存失败','error')}}catch(e){showToast('网络错误','error')}}

function showEditStoreModal(id,subdomain,storeName){var m=document.createElement('div');m.id='editStoreModal';m.innerHTML='<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:center;justify-content:center" onclick="if(event.target===this)closeEditModal()"><div style="background:#fff;border-radius:8px;padding:24px;width:420px;box-shadow:0 4px 16px rgba(0,0,0,0.15)"><h3 style="margin-bottom:16px">编辑店铺配置</h3><div class="form-group"><label>店铺域名</label><input type="text" id="eSubdomain" value="'+escapeHtml(subdomain)+'" style="border:1px solid #d9d9d9;border-radius:6px;padding:9px 12px;width:100%;font-size:14px"></div><div class="form-group"><label>店铺名称</label><input type="text" id="eName" value="'+escapeHtml(storeName)+'" style="border:1px solid #d9d9d9;border-radius:6px;padding:9px 12px;width:100%;font-size:14px"></div><div class="form-group"><label>Access Token</label><input type="text" id="eToken" placeholder="留空则不修改（更新过期Token时填写新值）" style="border:1px solid #d9d9d9;border-radius:6px;padding:9px 12px;width:100%;font-size:14px"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn btn-primary" style="width:auto" onclick="saveEditStore('+Number(id)+')">保存</button><button class="btn-sm" onclick="closeEditModal()">取消</button></div></div></div>';document.body.appendChild(m)}
function closeEditModal(){var m=document.getElementById('editStoreModal');if(m)m.remove()}
async function saveEditStore(id){var b={};var sd=$('#eSubdomain').value.trim();var nm=$('#eName').value.trim();var tk=($('#eToken')||{}).value&&$('#eToken').value.trim();if(!sd){showToast('请填写域名','error');return}if(sd)b.subdomain=sd;if(nm!==undefined)b.store_name=nm;if(tk)b.access_token=tk;try{var r=await fetch(API+'/stores/'+id,{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});var d=await r.json();if(d.ok){closeEditModal();var row=document.getElementById('storeRow_'+id);if(row){var cells=row.querySelectorAll('td');if(cells.length>=2){cells[1].textContent=d.store.subdomain}if(cells.length>=3){var nd=document.getElementById('sname_display_'+id);if(nd)nd.textContent=d.store.store_name||'-'}}showToast('保存成功','success')}else{showToast(d.error||'保存失败','error')}}catch(e){showToast('网络错误','error')}}

async function saveStoreName(id){var i=document.getElementById('sname_'+id);if(!i)return;var n=i.value.trim();try{var r=await fetch(API+'/stores/'+id,{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({store_name:n})});var d=await r.json();if(d.ok){showToast('保存成功','success')}else{showToast(d.error||'保存失败','error')}}catch(e){showToast('网络错误','error')}}

async function toggleStore(id,enabled){try{var r=await fetch(API+'/stores/'+id+'/toggle',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:enabled})});var d=await r.json();if(d.ok){showToast(enabled?'已启用':'已停用','success')}else{showToast(d.error||'操作失败','error');var cb=document.querySelector('#storeRow_'+id+' input[type=checkbox]');if(cb)cb.checked=!enabled}}catch(e){showToast('网络错误','error');var cb=document.querySelector('#storeRow_'+id+' input[type=checkbox]');if(cb)cb.checked=!enabled}}

async function delStore(id){if(!confirm('确认删除？'))return;try{var r=await fetch(API+'/stores/'+id,{method:'DELETE',credentials:'same-origin'});var d=await r.json();if(d.ok){var row=document.getElementById('storeRow_'+id);if(row)row.remove();removeWebhookCacheEntry(id);ensureEmptyRow();showToast('已删除','success')}else{showToast(d.error||'删除失败','error')}}catch(e){showToast('网络错误','error')}}
</script>
</body>
</html>
