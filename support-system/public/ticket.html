<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Official Customer Service - Dispute Center</title>
<style>
  :root {
    --primary: #1890ff;
    --primary-hover: #40a9ff;
    --success: #52c41a;
    --warning: #fa8c16;
    --danger: #ff4d4f;
    --text-main: #262626;
    --text-secondary: #595959;
    --text-muted: #8c8c8c;
    --border: #d9d9d9;
    --bg-page: #f5f7fa;
    --bg-card: #ffffff;
    --bg-hover: #f5f5f5;
    --radius: 12px;
    --shadow: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-page);
    color: var(--text-main);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg-card);
    border-bottom: 1px solid #f0f0f0;
    padding: 0 16px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .navbar .logo {
    width: 32px; height: 32px;
    border-radius: 50%;
    object-fit: cover;
  }
  .navbar .brand { font-size: 16px; font-weight: 600; }
  .container { max-width: 960px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--bg-card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 16px;
  }
  .page { display: none; animation: fadeIn .3s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

  .page-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--warning);
    margin-bottom: 16px;
  }
  .greeting { font-size: 15px; color: var(--text-secondary); margin-bottom: 12px; }
  .order-summary {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.8;
    margin-bottom: 16px;
  }
  .order-summary .highlight-money { color: #ff4d4f; font-weight: 600; }
  .order-summary .highlight-link { color: var(--primary); text-decoration: none; }
  .order-summary .highlight-time { color: #ff4d4f; }

  .section-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-main);
    padding-bottom: 12px;
    border-bottom: 1px solid #f0f0f0;
    margin-bottom: 20px;
  }
  .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .form-label { font-size: 14px; font-weight: 500; color: var(--text-secondary); }
  .form-control {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    color: var(--text-main);
    background: #fff;
    transition: border-color .2s, box-shadow .2s;
    -webkit-appearance: none;
  }
  .form-control:disabled { background: #f5f5f5; color: #8c8c8c; cursor: not-allowed; }
  .form-control:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(24,144,255,0.1);
  }
  textarea.form-control { resize: vertical; min-height: 120px; }
  select.form-control {
    background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%238c8c8c' stroke-width='1.5' fill='none'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
    -webkit-tap-highlight-color: transparent;
    min-height: 44px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:active { background: var(--primary-hover); transform: scale(0.98); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:active { filter: brightness(1.1); transform: scale(0.98); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:active { filter: brightness(1.1); transform: scale(0.98); }
  .btn-default { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); }
  .btn-default:active { background: var(--bg-hover); transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .ticket-layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 16px;
    align-items: start;
  }
  .status-card {
    border: 1px solid #ffd591;
    background: #fffbe6;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .status-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 600;
    color: var(--warning);
    margin-bottom: 10px;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--warning);
    display: inline-block;
  }
  .status-meta { font-size: 13px; color: var(--text-muted); line-height: 1.8; }
  .info-list { display: flex; flex-direction: column; gap: 14px; }
  .info-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .info-label { font-size: 14px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
  .info-value {
    font-size: 14px;
    color: var(--text-main);
    text-align: right;
    word-break: break-word;
    line-height: 1.5;
  }
  .ticket-body {
    background: var(--bg-card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-height: 600px;
  }
  .ticket-header {
    padding: 20px 24px;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .ticket-header h2 { font-size: 18px; font-weight: 600; }
  .ticket-id { font-size: 13px; color: var(--text-muted); background: var(--bg-page); padding: 4px 10px; border-radius: 20px; }
  .btn-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .btn-group .btn {
    flex: 1;
    white-space: nowrap;
    padding: 8px 12px;
    font-size: 13px;
    min-height: auto;
  }
  .timeline { flex: 1; padding: 24px; overflow-y: auto; }
  .timeline-item {
    padding: 0 0 20px 0;
    margin-bottom: 16px;
    border-bottom: 1px solid #f0f0f0;
  }
  .timeline-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
  .timeline-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .timeline-role { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
  .timeline-role.system { background: #f5f5f5; color: var(--text-muted); }
  .timeline-role.customer { background: #f6ffed; color: var(--success); }
  .timeline-role.agent { background: #e6f7ff; color: var(--primary); }
  .timeline-role.platform { background: #fffbe6; color: var(--warning); }
  .timeline-time { font-size: 12px; color: var(--text-muted); }
  .timeline-content {
    background: var(--bg-page);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .reply-area { border-top: 1px solid #f0f0f0; padding: 16px 24px 24px; }
  .reply-box {
    width: 100%;
    min-height: 100px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 16px;
    color: var(--text-main);
    resize: vertical;
    margin-bottom: 12px;
    transition: border-color .2s, box-shadow .2s;
  }
  .reply-box:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(24,144,255,0.1); }
  .reply-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .error-msg {
    background: #fff2f0;
    border: 1px solid #ffccc7;
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--danger);
    font-size: 14px;
    margin-bottom: 16px;
  }
  .loading { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 15px; }

  @media (max-width: 768px) {
    .container { padding: 12px; }
    .card { padding: 18px; }
    .page-title { font-size: 20px; }
    .ticket-layout { grid-template-columns: 1fr; }
    .ticket-body { min-height: 400px; }
    .timeline { padding: 16px; }
    .reply-area { padding: 14px 16px 18px; }
    .info-row { gap: 8px; }
    .ticket-header h2 { font-size: 16px; }
    .reply-box { font-size: 16px; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <img class="logo" src="/assets/logo.png" alt="Logo">
  <div class="brand">Official Customer Service</div>
</nav>

<div class="container" id="app">
  <div class="loading">Loading...</div>
</div>

<script>
var API = '/api/support';
var token = new URLSearchParams(location.search).get('t');
var accessToken = '';
var currentTicketNo = '';
var remainingMessages = 5;

function $(sel) { return document.querySelector(sel); }

async function api(url, opts) {
  opts = opts || {};
  var res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' });
  return res.json();
}

function formatDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  var h = String(d.getHours()).padStart(2, '0');
  var min = String(d.getMinutes()).padStart(2, '0');
  var s = String(d.getSeconds()).padStart(2, '0');
  return y + '-' + m + '-' + day + ' ' + h + ':' + min + ':' + s;
}

function statusLabel(s) {
  var map = { open: 'In Coordination', waiting: 'Waiting Customer', closed: 'Closed' };
  return map[s] || s;
}

var disputeTypes = ['Unknow', 'Fraud', 'Unauthorized', 'Products Discrepancies', 'Product Not Received', 'Defective Merchandise', 'Incorrect Transaction', 'Wrong address', 'Credit Not Processed'];

function renderNewTicket(order) {
  var card = order.card_last4 || '';
  var paymentMethod = (order.payment_method || '').replace(/_/g, ' ');
  var storeUrl = (order.store_subdomain || '');
  if (storeUrl.indexOf('.') === -1) storeUrl += '.myshoplaza.com';

  var opts = '';
  disputeTypes.forEach(function(t) { opts += '<option>' + t + '</option>'; });

  var amountDisplay = (order.order_currency || 'USD') + ' ' + (order.order_amount || '0.00');
  var dateDisplay = formatDate(order.paid_at);

  var paymentRow = '';
  if (card) {
    paymentRow = '<div class="form-group"><label class="form-label">Last 4 Digits Of Card Number</label><input type="text" class="form-control" value="' + card + '" maxlength="4" disabled></div>';
  } else if (paymentMethod) {
    paymentRow = '<div class="form-group"><label class="form-label">Payment Method</label><input type="text" class="form-control" value="' + paymentMethod + '" disabled></div>';
  }

  $('#app').innerHTML =
    '<div class="page active">' +
    '<div class="card">' +
    '<h1 class="page-title">Dispute initiated</h1>' +
    '<p class="greeting">Dear ' + (order.customer_name || 'Customer') + '</p>' +
    '<p class="order-summary">' +
    'You made a <span class="highlight-money">' + amountDisplay + '</span> purchase on ' +
    '<a href="https://' + storeUrl + '" target="_blank" rel="noopener" class="highlight-link">' + storeUrl + '</a> from ' +
    '<span class="highlight-time">' + dateDisplay + '</span>' +
    '</p>' +
    '<p class="order-summary">' +
    'If you have any questions about this order, please enter and send dispute information' +
    '</p>' +
    '</div>' +
    '<div class="card">' +
    '<div class="section-title">Initiate Disputes</div>' +
    paymentRow +
    '<div class="form-group">' +
    '<label class="form-label">Dispute Type</label>' +
    '<select class="form-control" id="issueType">' + opts + '</select>' +
    '</div>' +
    '<div class="form-group">' +
    '<label class="form-label">Claims</label>' +
    '<textarea class="form-control" id="description" placeholder="Please describe your issue in detail..."></textarea>' +
    '</div>' +
    '<button class="btn btn-primary" onclick="submitTicket()">Submit</button>' +
    '<div id="err" class="error-msg" style="display:none;margin-top:12px"></div>' +
    '</div></div>';
}

function renderTicketDetail(data) {
  var t = data.ticket;
  var order = data.order;
  var msgs = data.messages;
  // 保持已有的有效 accessToken，避免被页面初始的 bootstrap token 覆盖
  if (!accessToken || (accessToken.startsWith('bt_') && data.accessToken)) {
    accessToken = data.accessToken || token;
  }
  remainingMessages = data.remainingMessages !== undefined ? data.remainingMessages : 5;

  var items = Array.isArray(order.items) ? order.items.map(function(it) {
    return '<div style="font-size:13px;line-height:1.6"><span style="color:#262626">' + (it.product_title || it.title || it.name || '') + '</span> <span style="color:#8c8c8c">x' + (it.quantity || 1) + '</span></div>';
  }).join('') : '';

  var timelineHtml = '';
  msgs.forEach(function(m) {
    var roleLabels = { agent: 'Support Agent', customer: 'Customer', system: 'System', platform: 'Platform' };
    var role = roleLabels[m.sender_type] || m.sender_type;
    timelineHtml +=
      '<div class="timeline-item ' + m.sender_type + '">' +
      '<div class="timeline-meta">' +
      '<span class="timeline-role ' + m.sender_type + '">' + role + '</span>' +
      '<span class="timeline-time">' + formatDate(m.created_at) + '</span>' +
      '</div>' +
      '<div class="timeline-content">' + m.content + '</div>' +
      '</div>';
  });

  var statusColor = t.status === 'closed' ? 'var(--text-muted)' : 'var(--warning)';
  var statusText = t.status === 'closed' ? 'Closed' : (t.arbitration_requested ? 'In Arbitration' : 'In Coordination');
  var replyBlock = t.status === 'closed' ? '' :
    '<div class="reply-area">' +
    '<div id="remainingHint" style="font-size:12px;color:var(--text-muted);margin-bottom:8px">Remaining messages: <strong>' + remainingMessages + '</strong></div>' +
    '<textarea class="reply-box" id="replyBox" placeholder="Enter your reply here..." maxlength="2000"></textarea>' +
    '<div class="reply-actions">' +
    '<button class="btn btn-primary" onclick="sendReply()">Send</button>' +
    '</div>' +
    '<div id="err2" class="error-msg" style="display:none;margin-top:12px"></div>' +
    '</div>';

  var actionButtons = '';
  if (t.status !== 'closed') {
    actionButtons += '<button class="btn btn-success" onclick="closeTicket()">Close Dispute</button>';
    if (!t.arbitration_requested) {
      actionButtons += '<button class="btn btn-primary" id="arbitrationBtn" onclick="requestArbitration()">Apply For Arbitration</button>';
    }
  }

  $('#app').innerHTML =
    '<div class="page active">' +
    '<div class="ticket-layout">' +
    '<aside><div class="card">' +
    '<div class="section-title">Order Details</div>' +
    '<div class="status-card">' +
    '<div class="status-header">' +
    '<span class="status-dot" style="background:' + statusColor + '"></span>' +
    '<span>' + statusText + '</span></div>' +
    '<div class="status-meta">' +
    '<div>Dispute ID: ' + t.public_ticket_no + '</div>' +
    '<div>Initiation Time: ' + formatDate(t.created_at) + '</div>' +
    '</div></div>' +
    '<div class="info-list">' +
    '<div class="info-row"><span class="info-label">Serial Number:</span><span class="info-value">' + t.public_ticket_no + '</span></div>' +
    '<div class="info-row"><span class="info-label">Order Number:</span><span class="info-value">' + (order.order_number || '') + '</span></div>' +
    '<div class="info-row"><span class="info-label">Total Amount:</span><span class="info-value">' + (order.order_currency || 'USD') + ' ' + (order.order_amount || '') + '</span></div>' +
    '<div class="info-row"><span class="info-label">Refundable Amount:</span><span class="info-value">' + (order.order_currency || 'USD') + ' ' + (order.order_amount || '') + '</span></div>' +
    '<div class="info-row"><span class="info-label">Order Date:</span><span class="info-value">' + formatDate(order.paid_at) + '</span></div>' +
    (order.tracking_no ? '<div class="info-row"><span class="info-label">Tracking No:</span><span class="info-value">' + order.tracking_no + '</span></div>' : '') +
    '<div class="info-row"><span class="info-label">Products:</span><span class="info-value">' + items + '</span></div>' +
    '</div>' +
    (actionButtons ? '<div class="btn-group" style="margin-top:24px">' + actionButtons + '</div>' : '') +
    '</div></aside>' +
    '<section class="ticket-body">' +
    '<div class="ticket-header"><h2>Dispute Processing Record</h2><span class="ticket-id">#' + t.public_ticket_no + '</span></div>' +
    '<div class="timeline">' + timelineHtml + '</div>' +
    replyBlock +
    '</section>' +
    '</div></div>';
}

function showError(id, msg) {
  var el = $('#' + id);
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

function hideError(id) {
  var el = $('#' + id);
  if (el) { el.style.display = 'none'; }
}

function updateRemainingDisplay() {
  var hint = $('#remainingHint');
  if (hint) {
    hint.innerHTML = 'Remaining messages: <strong>' + remainingMessages + '</strong>';
    if (remainingMessages <= 0) {
      hint.style.color = 'var(--danger)';
    } else if (remainingMessages <= 2) {
      hint.style.color = 'var(--warning)';
    } else {
      hint.style.color = 'var(--text-muted)';
    }
  }
  var box = $('#replyBox');
  var btn = document.querySelector('.reply-actions .btn-primary');
  if (remainingMessages <= 0 && box) {
    box.disabled = true;
    box.placeholder = 'You have reached the maximum consecutive messages. Please wait for a merchant response.';
    if (btn) btn.disabled = true;
  }
}

async function refreshMessages() {
  var data = await (await fetch(API + '/tickets/' + getTicketNo() + '?t=' + accessToken, {
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin'
  })).json();
  if (data.ok) {
    remainingMessages = data.remainingMessages !== undefined ? data.remainingMessages : 5;
    var msgs = data.messages;
    var timeline = document.querySelector('.timeline');
    if (timeline) {
      var html = '';
      msgs.forEach(function(m) {
        var roleLabels = { agent: 'Support Agent', customer: 'Customer', system: 'System', platform: 'Platform' };
        var role = roleLabels[m.sender_type] || m.sender_type;
        html +=
          '<div class="timeline-item ' + m.sender_type + '">' +
          '<div class="timeline-meta">' +
          '<span class="timeline-role ' + m.sender_type + '">' + role + '</span>' +
          '<span class="timeline-time">' + formatDate(m.created_at) + '</span>' +
          '</div>' +
          '<div class="timeline-content">' + m.content + '</div>' +
          '</div>';
      });
      timeline.innerHTML = html;
      timeline.scrollTop = timeline.scrollHeight;
    }
    updateRemainingDisplay();
  }
}

async function submitTicket() {
  var description = $('#description').value.trim();
  if (!description) {
    showError('err', 'Please describe your dispute');
    return;
  }
  var btn = document.querySelector('.btn-primary');
  btn.disabled = true;
  btn.textContent = 'Submitting...';
  try {
    var body = JSON.stringify({
      token: token,
      issue_type: $('#issueType').value,
      description: description,
    });
    var result = await (await fetch(API + '/tickets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body,
    })).json();
    if (result.ok) {
      accessToken = result.accessToken;
      token = result.accessToken;  // 同步更新全局 token，防止后续被旧 bootstrap token 覆盖
      history.replaceState(null, '', '/ticket?t=' + result.accessToken);
      var data = await api(API + '/tickets/' + result.publicTicketNo + '?t=' + result.accessToken);
      if (data.ok) renderTicketDetail(data);
    } else {
      showError('err', result.error || 'Submission failed');
    }
  } catch(e) {
    showError('err', 'Network error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Submit';
  }
}

async function sendReply() {
  var box = $('#replyBox');
  var content = box.value.trim();
  if (!content) { showError('err2', 'Message content is required'); return; }
  var btn = document.querySelector('.reply-actions .btn-primary');
  btn.disabled = true;
  hideError('err2');
  try {
    var result = await (await fetch(API + '/tickets/' + getTicketNo() + '/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: accessToken, content: content }),
    })).json();
    if (result.ok) {
      remainingMessages = result.remainingMessages;
      box.value = '';
      await refreshMessages();
    } else {
      showError('err2', result.error || 'Send failed');
    }
  } catch(e) {
    showError('err2', 'Network error');
  } finally {
    btn.disabled = false;
    updateRemainingDisplay();
  }
}

async function closeTicket() {
  if (!confirm('Are you sure you want to close this dispute?')) return;
  var result = await (await fetch(API + '/tickets/' + getTicketNo() + '/close', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: accessToken }),
  })).json();
  if (result.ok) location.reload();
  else alert(result.error || 'Close failed');
}

async function requestArbitration() {
  if (!confirm('Are you sure you want to apply for arbitration?')) return;
  var btn = document.getElementById('arbitrationBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Requesting...'; }
  try {
    var result = await (await fetch(API + '/tickets/' + getTicketNo() + '/arbitration', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: accessToken }),
    })).json();
    if (result.ok) location.reload();
    else alert(result.error || 'Arbitration request failed');
  } catch(e) {
    alert('Network error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Apply For Arbitration'; }
  }
}

function getTicketNo() {
  var el = document.querySelector('.ticket-id');
  return el ? el.textContent.replace('#', '') : '';
}

// Init
if (!token) {
  $('#app').innerHTML = '<div class="card"><div class="error-msg">Missing access token. Please use the link from your email.</div></div>';
} else {
  fetch(API + '/bootstrap?t=' + token).then(function(r) { return r.json(); }).then(function(data) {
    if (!data.ok) {
      $('#app').innerHTML = '<div class="card"><div class="error-msg">' + (data.error || 'Link is invalid or expired') + '</div></div>';
      return;
    }
    if (data.mode === 'new_ticket') {
      renderNewTicket(data.order);
    } else if (data.ticket) {
      accessToken = data.accessToken || token;
      if (data.accessToken) {
        history.replaceState(null, '', '/ticket?t=' + data.accessToken);
      }
      fetch(API + '/tickets/' + data.ticket.public_ticket_no + '?t=' + accessToken).then(function(r) { return r.json(); }).then(function(d) {
        if (d.ok) renderTicketDetail(d);
        else renderNewTicket(data.order);
      });
    }
  }).catch(function() {
    $('#app').innerHTML = '<div class="card"><div class="error-msg">Failed to load. Please check your connection and refresh.</div></div>';
  });
}
</script>
</body>
</html>
