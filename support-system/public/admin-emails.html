<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服后台 - 订单邮件管理</title>
<link rel="stylesheet" href="/admin-base.css">
<style>
/* 邮件管理页：右侧详情面板收窄，给表格更多空间 */
.panel-left { flex: 1; width: auto; }
.panel-right { width: 300px; min-width: 260px; max-width: 360px; flex-shrink: 0; }
</style>
</head>
<body>
<div id="app"><div class="login-page"><div class="login-card" style="text-align:center;color:var(--text-muted);padding:60px 36px">加载中...</div></div></div>
<script>
var API='/api/admin';var me=null;var emailStatus='all';var emailPage=1;var currentEmailJobId=null;var backfillRunning=false;
function $(s){return document.querySelector(s)}function $$(s){return document.querySelectorAll(s)}
function formatTime(i){if(!i)return'-';var d=new Date(i);if(isNaN(d.getTime()))return String(i);var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0'),h=String(d.getHours()).padStart(2,'0'),mi=String(d.getMinutes()).padStart(2,'0'),s=String(d.getSeconds()).padStart(2,'0');return y+'-'+m+'-'+dy+' '+h+':'+mi+':'+s}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function showToast(m,t){var d=document.createElement('div');d.className='toast '+(t||'success');d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2000)}
function ticketPreviewUrl(n){return'/thinkpro-admin/ticket-preview?ticket='+encodeURIComponent(n||'')}
function orderPreviewUrl(s,o,e){var u='/thinkpro-admin/ticket-preview?store='+encodeURIComponent(s||'')+'&order='+encodeURIComponent(o||'');if(e)u+='&email='+encodeURIComponent(e);return u}
function jobSourceLabel(s){var m={webhook:'Webhook',backfill:'兜底'};return m[s]||s||'-'}
function emailTypeLabel(s){var m={paid_support_invite:'下单后通知',agent_reply_notice:'客服回复提醒',ticket_closed_notice:'工单关闭提醒',customer_complaint_invite:'顾客投诉工单'};return m[s]||s}
function emailStatusLabel(s){var m={pending:'待发送',sending:'发送中',sent:'已发送',failed:'发送失败',cancelled:'已取消',skipped:'已跳过'};var c=s==='sent'?'tag-green':(s==='failed'?'tag-red':(s==='pending'||s==='sending'?'tag-orange':'tag-gray'));return'<span class="tag '+c+'">'+(m[s]||s)+'</span>'}

(async function init(){try{var r=await fetch(API+'/me',{credentials:'same-origin'});var d=await r.json();if(d.ok){me=d.agent;renderMain()}else{location.replace('/login?redirect='+encodeURIComponent('/thinkpro-admin/emails'))}}catch(e){location.replace('/login?redirect='+encodeURIComponent('/thinkpro-admin/emails'))}})();async function doLogout(){await fetch(API+'/logout',{method:'POST',credentials:'same-origin'});location.replace('/login')}

function renderMain(){$('#app').innerHTML='<div class="app"><aside class="sidebar"><div class="sidebar-header"><img src="/assets/logo.png" onerror="this.style.display=\'none\'"><span class="sidebar-title">客服后台</span></div><nav class="nav-menu"><a class="nav-item" href="/thinkpro-admin"><span class="nav-icon">📋</span>工单处理</a><a class="nav-item" href="/thinkpro-admin/stores"><span class="nav-icon">🏪</span>店铺管理</a><a class="nav-item active" href="/thinkpro-admin/emails"><span class="nav-icon">📧</span>订单邮件管理</a><a class="nav-item" href="/thinkpro-admin/email-templates"><span class="nav-icon">📨</span>邮件模板</a><a class="nav-item" href="/thinkpro-admin/settings"><span class="nav-icon">⚙️</span>系统设置</a><a class="nav-item" href="/thinkpro-admin/logs"><span class="nav-icon">📋</span>系统日志</a><a class="nav-item" href="/mailpit/" target="_blank"><span class="nav-icon">📬</span>邮件调试</a></nav><div class="sidebar-footer"><span>v1.0.0</span><span>'+me.name+'</span></div></aside><div class="main" id="mainArea"></div></div>';buildLayout();loadEmailJobs();loadAutoSendState();loadAutoBackfillState()}

function buildLayout(){$('#mainArea').innerHTML='<header class="topbar"><div class="breadcrumb">首页 / <strong>订单邮件管理</strong></div><div class="topbar-right"><button class="btn-logout" onclick="doLogout()">退出</button></div></header><div class="content"><div class="filter-bar" style="flex-wrap:wrap;gap:4px 8px;align-items:center"><button class="filter-btn active" data-email-status="all" onclick="setEmailStatus(this,\'all\')">全部</button><button class="filter-btn" data-email-status="pending" onclick="setEmailStatus(this,\'pending\')">待发送</button><button class="filter-btn" data-email-status="sent" onclick="setEmailStatus(this,\'sent\')">已发送</button><button class="filter-btn" data-email-status="failed" onclick="setEmailStatus(this,\'failed\')">发送失败</button><button class="filter-btn" data-email-status="cancelled" onclick="setEmailStatus(this,\'cancelled\')">已取消</button><div class="search-box"><span class="sicon">🔍</span><input id="emailSearch" placeholder="订单号/邮箱/任务号" onkeydown="if(event.key===\'Enter\'){emailPage=1;loadEmailJobs()}" style="width:180px"></div><span style="font-size:12px;color:#595959;margin-left:4px">自动发送:</span><label class="toggle"><input type="checkbox" id="autoSendToggle" onchange="toggleAutoSend(this.checked)"><span class="slider"></span></label><span style="font-size:12px;color:#595959;margin-left:4px">自动查漏:</span><label class="toggle"><input type="checkbox" id="autoBackfillToggle" onchange="toggleAutoBackfill(this.checked)"><span class="slider"></span></label><button class="btn btn-primary" style="padding:5px 10px;width:auto;font-size:12px" onclick="triggerBackfill()" id="backfillBtn">🔄 手动查漏</button></div><div class="split-view"><div class="panel-left"><div class="table-scroll"><table><thead><tr><th>任务号</th><th>店铺</th><th>订单</th><th>类型</th><th>收件人</th><th>来源</th><th>状态</th><th>预计发送</th><th>实际发送</th><th>重试</th><th>操作</th></tr></thead><tbody id="emailTbody"></tbody></table></div><div class="pagination" id="emailPagination"></div></div><div class="panel-right" id="emailDetailPanel"><div class="detail-empty">选择邮件任务查看详情</div></div></div></div>'}

function setEmailStatus(el,s){emailStatus=s;emailPage=1;$$('.filter-btn[data-email-status]').forEach(function(n){n.classList.remove('active')});el.classList.add('active');loadEmailJobs()}

async function loadAutoSendState(){try{var r=await fetch(API+'/email-settings',{credentials:'same-origin'});var d=await r.json();if(d.ok){var e=document.getElementById('autoSendToggle');if(e)e.checked=d.auto_send_enabled}}catch(e){}}
async function loadAutoBackfillState(){try{var r=await fetch(API+'/backfill-settings',{credentials:'same-origin'});var d=await r.json();if(d.ok){var e=document.getElementById('autoBackfillToggle');if(e)e.checked=d.auto_backfill_enabled}}catch(e){}}

async function toggleAutoSend(enabled){try{var r=await fetch(API+'/email-settings',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({auto_send_enabled:enabled})});var d=await r.json();if(d.ok){showToast(enabled?'自动发送已开启':'自动发送已关闭（需手动发送）','success')}else{showToast(d.error||'操作失败','error');document.getElementById('autoSendToggle').checked=!enabled}}catch(e){showToast('网络错误','error');document.getElementById('autoSendToggle').checked=!enabled}}

async function toggleAutoBackfill(enabled){try{var r=await fetch(API+'/backfill-settings',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({auto_backfill_enabled:enabled})});var d=await r.json();if(d.ok){showToast(enabled?'自动增量查漏已开启（每小时整点过5分执行）':'自动增量查漏已关闭','success')}else{showToast(d.error||'操作失败','error');document.getElementById('autoBackfillToggle').checked=!enabled}}catch(e){showToast('网络错误','error');document.getElementById('autoBackfillToggle').checked=!enabled}}

async function loadEmailJobs(){var p=new URLSearchParams();if(emailStatus!=='all')p.set('status',emailStatus);var q=($('#emailSearch')||{}).value||'';if(q)p.set('q',q);p.set('page',String(emailPage));p.set('page_size','30');try{var r=await fetch(API+'/email-jobs?'+p.toString(),{credentials:'same-origin'});var d=await r.json();if(!d.ok){showToast(d.error||'加载失败','error');return}renderEmailJobs(d.jobs,d.total)}catch(e){showToast('网络错误','error')}}

function renderEmailJobs(jobs,total){var h='';jobs.forEach(function(j){var btns='';switch(j.status){case'pending':btns='<button class="btn-sm" onclick="event.stopPropagation();resendEmailJob('+j.id+')">发送</button> <button class="btn-sm btn-sm-danger" onclick="event.stopPropagation();cancelEmailJob('+j.id+')">取消</button>';break;case'failed':btns='<button class="btn-sm" onclick="event.stopPropagation();resendEmailJob('+j.id+')">重发</button> <button class="btn-sm btn-sm-danger" onclick="event.stopPropagation();cancelEmailJob('+j.id+')">取消</button>';break;case'cancelled':btns='<button class="btn-sm" onclick="event.stopPropagation();resendEmailJob('+j.id+')">重发</button>';break;default:btns=''}h+='<tr onclick="selectEmailJob(this,'+j.id+')" data-email-id="'+j.id+'"><td style="text-align:center;font-weight:600">'+esc(j.email_job_no)+'</td><td style="text-align:center">'+esc(j.store_name||j.store_subdomain||'')+'</td><td style="text-align:center">'+esc(j.order_number||j.order_id||'')+'</td><td style="text-align:center">'+emailTypeLabel(j.email_type)+'</td><td style="text-align:center">'+esc(j.customer_email)+'</td><td style="text-align:center">'+jobSourceLabel(j.job_source)+'</td><td style="text-align:center">'+emailStatusLabel(j.status)+'</td><td style="text-align:center;white-space:nowrap">'+formatTime(j.scheduled_at)+'</td><td style="text-align:center;white-space:nowrap">'+formatTime(j.sent_at)+'</td><td style="text-align:center">'+(j.retry_count||0)+'</td><td style="text-align:center;white-space:nowrap">'+btns+'</td></tr>'});$('#emailTbody').innerHTML=h||'<tr><td colspan="11" style="text-align:center;color:var(--text-muted);padding:40px">暂无邮件任务</td></tr>';var tp=Math.ceil(total/30)||1;var pg='<button '+(emailPage<=1?'disabled':'')+' onclick="emailPage--;loadEmailJobs()">上一页</button>';
  var maxShow=5,start=Math.max(1,emailPage-2),end=Math.min(tp,start+maxShow-1);
  if(end-start<maxShow-1)start=Math.max(1,end-maxShow+1);
  if(start>1){pg+='<button onclick="emailPage=1;loadEmailJobs()">1</button>';if(start>2)pg+='<span style="padding:0 4px">...</span>';}
  for(var i=start;i<=end;i++)pg+='<button class="'+(i===emailPage?'active':'')+'" onclick="emailPage='+i+';loadEmailJobs()">'+i+'</button>';
  if(end<tp){if(end<tp-1)pg+='<span style="padding:0 4px">...</span>';pg+='<button onclick="emailPage='+tp+';loadEmailJobs()">'+tp+'</button>';}
  pg+='<button '+(emailPage>=tp?'disabled':'')+' onclick="emailPage++;loadEmailJobs()">下一页</button>';$('#emailPagination').innerHTML=pg}

function selectEmailJob(row,id){$$('.panel-left tr').forEach(function(r){r.classList.remove('selected')});row.classList.add('selected');currentEmailJobId=id;loadEmailDetail(id)}

async function loadEmailDetail(id){var p=$('#emailDetailPanel');p.innerHTML='<div class="detail-empty">加载中...</div>';try{var r=await fetch(API+'/email-jobs/'+id,{credentials:'same-origin'});var d=await r.json();if(!d.ok){p.innerHTML='<div class="detail-empty">加载失败</div>';return}renderEmailDetail(d.job,d.resends||[],d.orderSnapshot||null)}catch(e){p.innerHTML='<div class="detail-empty">加载失败</div>'}}

function renderEmailDetail(j,resends,snap){snap=snap||{};var cpu=j.public_ticket_no?ticketPreviewUrl(j.public_ticket_no):orderPreviewUrl(j.store_subdomain,j.order_id,j.customer_email);var epu='/thinkpro-admin/email-preview?job_id='+j.id;var ot=formatTime(j.ordered_at)||formatTime(snap.paid_at);var cn=snap.customer_name||'';var pm=snap.payment_method||'';var cl=snap.card_last4||'';var oa=(snap.order_currency?snap.order_currency+' ':'')+(snap.order_amount||'');var btns='';switch(j.status){case'pending':btns='<button class="btn-sm" onclick="resendEmailJob('+j.id+')">立即发送</button> <button class="btn-sm btn-sm-danger" onclick="cancelEmailJob('+j.id+')">取消待发送</button>';break;case'failed':btns='<button class="btn-sm" onclick="resendEmailJob('+j.id+')">重发</button> <button class="btn-sm btn-sm-danger" onclick="cancelEmailJob('+j.id+')">取消</button>';break;case'cancelled':btns='<button class="btn-sm" onclick="resendEmailJob('+j.id+')">重发</button>';break;default:btns=''}$('#emailDetailPanel').innerHTML='<div class="detail-content"><div class="detail-header"><h3>#'+esc(j.email_job_no)+'</h3><div>'+emailStatusLabel(j.status)+'</div></div><div class="detail-scroll"><div class="info-grid" style="gap:4px 20px"><div class="info-item"><span class="info-label">店铺</span><span class="info-value">'+esc(j.store_name||j.store_subdomain||'')+'</span></div><div class="info-item"><span class="info-label">域名</span><span class="info-value">'+esc(j.store_domain||'')+'</span></div><div class="info-item"><span class="info-label">订单号</span><span class="info-value">'+esc(j.order_id||'')+'</span></div><div class="info-item"><span class="info-label">订单编号</span><span class="info-value">'+esc(j.order_number||'')+'</span></div><div class="info-item"><span class="info-label">邮件类型</span><span class="info-value">'+emailTypeLabel(j.email_type)+'</span></div><div class="info-item"><span class="info-label">收件人</span><span class="info-value">'+esc(j.customer_email)+'</span></div>'+(cn?'<div class="info-item"><span class="info-label">顾客姓名</span><span class="info-value">'+esc(cn)+'</span></div>':'')+(ot!=='-'?'<div class="info-item"><span class="info-label">下单时间</span><span class="info-value">'+ot+'</span></div>':'')+(pm?'<div class="info-item"><span class="info-label">支付方式</span><span class="info-value">'+esc(pm)+'</span></div>':'')+(cl?'<div class="info-item"><span class="info-label">卡号后四位</span><span class="info-value">'+esc(cl)+'</span></div>':'')+(oa?'<div class="info-item"><span class="info-label">金额</span><span class="info-value">'+esc(oa)+'</span></div>':'')+'<div class="info-item"><span class="info-label">预计发送</span><span class="info-value">'+formatTime(j.scheduled_at)+'</span></div><div class="info-item"><span class="info-label">实际发送</span><span class="info-value">'+formatTime(j.sent_at)+'</span></div><div class="info-item"><span class="info-label">重试次数</span><span class="info-value">'+(j.retry_count||0)+'</span></div><div class="info-item"><span class="info-label">失败原因</span><span class="info-value">'+esc(j.last_error||'-')+'</span></div><div class="info-item"><span class="info-label">客户端链接</span><span class="info-value">'+esc(j.client_link_snapshot||'暂无')+'</span></div><div class="info-item"><span class="info-label">客户视角预览</span><span class="info-value"><a href="'+esc(cpu)+'" target="_blank" rel="noopener">📋 打开预览页面</a></span></div><div class="info-item"><span class="info-label">邮件预览</span><span class="info-value"><a href="'+esc(epu)+'" target="_blank" rel="noopener">📧 打开预览页面</a></span></div></div></div><div class="reply-bar"><div class="reply-actions">'+btns+'</div></div></div>'}

async function resendEmailJob(id){if(!confirm('确认发送/重发这封邮件？'))return;try{var r=await fetch(API+'/email-jobs/'+id+'/resend',{method:'POST',credentials:'same-origin'});var d=await r.json();if(d.ok){showToast(d.job.status==='sent'?'发送成功':'已加入发送队列','success');loadEmailJobs();if(currentEmailJobId)loadEmailDetail(currentEmailJobId)}else showToast(d.error||'操作失败','error')}catch(e){showToast('网络错误','error')}}

async function cancelEmailJob(id){if(!confirm('确认取消这封待发送邮件？'))return;try{var r=await fetch(API+'/email-jobs/'+id+'/cancel',{method:'POST',credentials:'same-origin'});var d=await r.json();if(d.ok){showToast('已取消','success');loadEmailJobs();loadEmailDetail(id)}else showToast(d.error||'取消失败','error')}catch(e){showToast('网络错误','error')}}

// ── 兜底任务 ──
async function triggerBackfill(){if(backfillRunning){showToast('兜底任务正在执行中，请稍后查看结果','error');return}if(!confirm('确认手动启动订单增量查漏？'))return;var b=document.getElementById('backfillBtn');backfillRunning=true;if(b){b.disabled=true;b.textContent='⏳ 查漏中...'}try{var r=await fetch(API+'/backfill/trigger',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});var d=await r.json();if(d.ok){showToast('手动查漏已触发，后台执行中','success');setTimeout(pollBackfillStatus,3000)}else{showToast(d.error||'触发失败','error');backfillRunning=false;if(b){b.disabled=false;b.textContent='🔄 手动查漏'}}}catch(e){showToast('网络错误','error');backfillRunning=false;if(b){b.disabled=false;b.textContent='🔄 手动查漏'}}}

async function pollBackfillStatus(){try{var r=await fetch(API+'/backfill/status',{credentials:'same-origin'});var d=await r.json();if(!d.ok)return;var ai=true;var hr=false;(d.states||[]).forEach(function(s){if(s.lastStatus==='running'){ai=false;hr=true}});if(hr){setTimeout(pollBackfillStatus,5000)}else{backfillRunning=false;var b=document.getElementById('backfillBtn');if(b){b.disabled=false;b.textContent='🔄 手动查漏'}showToast('兜底任务完成！','success');if(typeof loadEmailJobs==='function')loadEmailJobs()}}catch(e){backfillRunning=false;var b=document.getElementById('backfillBtn');if(b){b.disabled=false;b.textContent='🔄 手动查漏'}}}
</script>
</body>
</html>
