<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服后台 - 系统日志</title>
<link rel="stylesheet" href="/admin-base.css">
</head>
<body>
<div id="app"><div class="login-page"><div class="login-card" style="text-align:center;color:var(--text-muted);padding:60px 36px">加载中...</div></div></div>
<script>
var API='/api/admin';var me=null;var logSubTab='sync';var syncLogPage=1;var syncLogSource='all';var syncLogStatus='all';var opLogPage=1;var opLogCategory='all';var opLogStatus='all';
function sd(s){return s&&s.indexOf('.')!==-1?s:s+'.myshoplaza.com'}
function $(s){return document.querySelector(s)}function $$(s){return document.querySelectorAll(s)}
function formatTime(i){if(!i)return'-';var d=new Date(i);if(isNaN(d.getTime()))return String(i);var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0'),h=String(d.getHours()).padStart(2,'0'),mi=String(d.getMinutes()).padStart(2,'0'),s=String(d.getSeconds()).padStart(2,'0');return y+'-'+m+'-'+dy+' '+h+':'+mi+':'+s}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function showToast(m,t){var d=document.createElement('div');d.className='toast '+(t||'success');d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2000)}

function logStatusDot(s){if(s==='success')return'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#52c41a;margin-right:4px;vertical-align:middle"></span>成功';if(s==='partial')return'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#faad14;margin-right:4px;vertical-align:middle"></span>部分成功';return'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d4f;margin-right:4px;vertical-align:middle"></span>失败'}
function syncSrcCN(s){var m={webhook:'Webhook',backfill:'兜底同步',api:'API补全'};return m[s]||s}
function syncActCN(a){var m={order_upsert:'订单更新',backfill_summary:'兜底汇总',order_list_page:'列表拉取',transaction_lookup:'交易查询'};return(m[a]||a)+' ('+a+')'}
function opActionCN(a){var m={job_resent:'手动补发',job_failed:'发送失败',job_cancelled:'取消待发',job_sent:'发送成功',store_create:'新增店铺',store_delete:'删除店铺',store_update:'修改店铺',store_toggle:'启停店铺',auto_send_toggled:'切换自动发送',auto_backfill_toggled:'切换自动查漏',backfill_store_complete:'兜底完成',backfill_auto_run:'自动兜底',ticket_status_changed:'变更工单状态',agent_reply:'客服回复',customer_reply:'顾客回复',ticket_created:'工单创建',ticket_closed:'工单关闭',email_template_updated:'更新邮件模板'};return(m[a]||a)+' ('+a+')'}
function opCategoryCN(c){var m={email:'邮件',ticket:'工单',store:'店铺',config:'配置',backfill:'兜底',webhook:'Webhook'};return m[c]||c}

(async function init(){try{var r=await fetch(API+'/me',{credentials:'same-origin'});var d=await r.json();if(d.ok){me=d.agent;renderMain()}else{location.replace('/login?redirect='+encodeURIComponent('/thinkpro-admin/logs'))}}catch(e){location.replace('/login?redirect='+encodeURIComponent('/thinkpro-admin/logs'))}})();async function doLogout(){await fetch(API+'/logout',{method:'POST',credentials:'same-origin'});location.replace('/login')}

function renderMain(){$('#app').innerHTML='<div class="app"><aside class="sidebar"><div class="sidebar-header"><img src="/assets/logo.png" onerror="this.style.display=\'none\'"><span class="sidebar-title">客服后台</span></div><nav class="nav-menu"><a class="nav-item" href="/thinkpro-admin"><span class="nav-icon">📋</span>工单处理</a><a class="nav-item" href="/thinkpro-admin/stores"><span class="nav-icon">🏪</span>店铺管理</a><a class="nav-item" href="/thinkpro-admin/emails"><span class="nav-icon">📧</span>订单邮件管理</a><a class="nav-item" href="/thinkpro-admin/email-templates"><span class="nav-icon">📨</span>邮件模板</a><a class="nav-item" href="/thinkpro-admin/settings"><span class="nav-icon">⚙️</span>系统设置</a><a class="nav-item active" href="/thinkpro-admin/logs"><span class="nav-icon">📋</span>系统日志</a></nav><div class="sidebar-footer"><span>v1.0.0</span><span>'+me.name+'</span></div></aside><div class="main" id="mainArea"></div></div>';buildLayout();loadSyncLogs()}

function buildLayout(){$('#mainArea').innerHTML='<header class="topbar"><div class="breadcrumb">首页 / <strong>系统日志</strong></div><div class="topbar-right"><button class="btn-logout" onclick="doLogout()">退出</button></div></header><div class="content"><div class="filter-bar"><button class="filter-btn active" data-log-tab="sync" onclick="switchLogTab(this,\'sync\')">同步日志</button><button class="filter-btn" data-log-tab="op" onclick="switchLogTab(this,\'op\')">操作日志</button></div><div id="logSubFilters"></div><div style="flex:1;overflow:auto"><table><thead><tr id="logThead"></tr></thead><tbody id="logTbody"></tbody></table></div><div class="pagination" id="logPagination"></div></div>'}

function switchLogTab(el,tab){logSubTab=tab;$$('.filter-btn[data-log-tab]').forEach(function(n){n.classList.remove('active')});el.classList.add('active');if(tab==='sync'){syncLogPage=1;loadSyncLogs()}else{opLogPage=1;loadOperationLogs()}}

function buildSyncFilters(){return'<div class="filter-bar" style="border-bottom:none;padding:4px 20px"><button class="filter-btn '+(syncLogSource==='all'?'active':'')+'" onclick="setSyncSource(\'all\')">全部来源</button><button class="filter-btn '+(syncLogSource==='webhook'?'active':'')+'" onclick="setSyncSource(\'webhook\')">Webhook</button><button class="filter-btn '+(syncLogSource==='backfill'?'active':'')+'" onclick="setSyncSource(\'backfill\')">兜底</button><button class="filter-btn '+(syncLogSource==='api'?'active':'')+'" onclick="setSyncSource(\'api\')">API</button> | <button class="filter-btn '+(syncLogStatus==='all'?'active':'')+'" onclick="setSyncStatus(\'all\')">全部</button><button class="filter-btn '+(syncLogStatus==='success'?'active':'')+'" onclick="setSyncStatus(\'success\')"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#52c41a;margin-right:3px"></span>成功</button><button class="filter-btn '+(syncLogStatus==='failed'?'active':'')+'" onclick="setSyncStatus(\'failed\')"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d4f;margin-right:3px"></span>失败</button></div>'}
function buildOpFilters(){return'<div class="filter-bar" style="border-bottom:none;padding:4px 20px"><button class="filter-btn '+(opLogCategory==='all'?'active':'')+'" onclick="setOpCategory(\'all\')">全部</button><button class="filter-btn '+(opLogCategory==='email'?'active':'')+'" onclick="setOpCategory(\'email\')">邮件</button><button class="filter-btn '+(opLogCategory==='ticket'?'active':'')+'" onclick="setOpCategory(\'ticket\')">工单</button><button class="filter-btn '+(opLogCategory==='store'?'active':'')+'" onclick="setOpCategory(\'store\')">店铺</button><button class="filter-btn '+(opLogCategory==='config'?'active':'')+'" onclick="setOpCategory(\'config\')">配置</button><button class="filter-btn '+(opLogCategory==='backfill'?'active':'')+'" onclick="setOpCategory(\'backfill\')">兜底</button> | <button class="filter-btn '+(opLogStatus==='all'?'active':'')+'" onclick="setOpStatus(\'all\')">全部</button><button class="filter-btn '+(opLogStatus==='success'?'active':'')+'" onclick="setOpStatus(\'success\')"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#52c41a;margin-right:3px"></span>成功</button><button class="filter-btn '+(opLogStatus==='partial'?'active':'')+'" onclick="setOpStatus(\'partial\')"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#faad14;margin-right:3px"></span>部分</button><button class="filter-btn '+(opLogStatus==='failed'?'active':'')+'" onclick="setOpStatus(\'failed\')"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d4f;margin-right:3px"></span>失败</button><div class="search-box" style="margin-left:auto"><span class="sicon">🔍</span><input id="opLogSearch" placeholder="搜索..." onkeydown="if(event.key===\'Enter\'){opLogPage=1;loadOperationLogs()}" style="width:160px"></div></div>'}

function setSyncSource(v){syncLogSource=v;syncLogPage=1;loadSyncLogs()}function setSyncStatus(v){syncLogStatus=v;syncLogPage=1;loadSyncLogs()}function setOpCategory(v){opLogCategory=v;opLogPage=1;loadOperationLogs()}function setOpStatus(v){opLogStatus=v;opLogPage=1;loadOperationLogs()}

async function loadSyncLogs(){$('#logSubFilters').innerHTML=buildSyncFilters();$('#logThead').innerHTML='<th>时间</th><th>来源</th><th>动作</th><th>店铺域名</th><th>店铺名称</th><th>对象</th><th>新增</th><th>更新</th><th>耗时</th><th>状态</th><th>快照</th>';var p=new URLSearchParams();if(syncLogSource!=='all')p.set('source',syncLogSource);if(syncLogStatus!=='all')p.set('status',syncLogStatus);p.set('page',String(syncLogPage));p.set('page_size','30');try{var r=await fetch(API+'/sync-logs?'+p.toString(),{credentials:'same-origin'});var d=await r.json();if(!d.ok)return;renderSyncLogs(d.logs,d.total)}catch(e){}}

function renderSyncLogs(logs,total){var h='';logs.forEach(function(l){var dj=l.detail_json?JSON.stringify(l.detail_json):'{}';h+='<tr><td style="text-align:center;white-space:nowrap">'+formatTime(l.created_at)+'</td><td style="text-align:center">'+syncSrcCN(l.source)+'</td><td style="text-align:center">'+syncActCN(l.action)+'</td><td style="text-align:center">'+sd(l.store_subdomain)+'</td><td style="text-align:center">'+esc(l.store_name||'-')+'</td><td style="text-align:center">'+esc(l.target_id||'-')+'</td><td style="text-align:center">'+(l.items_new||0)+'</td><td style="text-align:center">'+(l.items_updated||0)+'</td><td style="text-align:center">'+(l.duration_ms!=null?l.duration_ms+'ms':'')+'</td><td style="text-align:center;white-space:nowrap">'+logStatusDot(l.status)+'</td><td style="text-align:center"><a href="javascript:void(0)" style="color:var(--primary);font-size:12px;text-decoration:none" onclick="event.stopPropagation();showLogBubble(this,\''+esc(dj)+'\')">查看</a></td></tr>'});$('#logTbody').innerHTML=h||'<tr><td colspan="11" style="text-align:center;color:var(--text-muted);padding:40px">暂无同步日志</td></tr>';renderLogPagination(total,30,syncLogPage,function(p){syncLogPage=p;loadSyncLogs()})}

async function loadOperationLogs(){$('#logSubFilters').innerHTML=buildOpFilters();$('#logThead').innerHTML='<th>时间</th><th>分类</th><th>操作</th><th>操作人</th><th>店铺</th><th>对象</th><th>摘要</th><th>状态</th><th>快照</th>';var p=new URLSearchParams();if(opLogCategory!=='all')p.set('category',opLogCategory);if(opLogStatus!=='all')p.set('status',opLogStatus);var q=($('#opLogSearch')||{}).value||'';if(q)p.set('q',q);p.set('page',String(opLogPage));p.set('page_size','30');try{var r=await fetch(API+'/operation-logs?'+p.toString(),{credentials:'same-origin'});var d=await r.json();if(!d.ok)return;renderOperationLogs(d.logs,d.total)}catch(e){}}

function renderOperationLogs(logs,total){var h='';logs.forEach(function(l){var dj=l.detail_json?JSON.stringify(l.detail_json):'{}';var dm=l.store_subdomain?sd(l.store_subdomain):'-';h+='<tr><td style="text-align:center;white-space:nowrap">'+formatTime(l.created_at)+'</td><td style="text-align:center">'+opCategoryCN(l.category)+'</td><td style="text-align:center">'+opActionCN(l.action)+'</td><td style="text-align:center">'+esc(l.actor)+'</td><td style="text-align:center">'+dm+'</td><td style="text-align:center">'+esc(l.target||'-')+'</td><td style="text-align:center">'+esc(l.summary)+'</td><td style="text-align:center;white-space:nowrap">'+logStatusDot(l.status)+'</td><td style="text-align:center"><a href="javascript:void(0)" style="color:var(--primary);font-size:12px;text-decoration:none" onclick="event.stopPropagation();showLogBubble(this,\''+esc(dj)+'\',\''+esc(l.failed_at_step||'')+'\')">查看</a></td></tr>'});$('#logTbody').innerHTML=h||'<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:40px">暂无操作日志</td></tr>';renderLogPagination(total,30,opLogPage,function(p){opLogPage=p;loadOperationLogs()})}

function showLogBubble(el,djStr,fs){var old=document.getElementById('logBubble');if(old)old.remove();var d={};try{d=JSON.parse(djStr)}catch(e){}var sh='';if(d.steps&&Array.isArray(d.steps)){sh='<div style="font-weight:600;margin:10px 0 6px;border-top:1px solid #e8e8e8;padding-top:8px">步骤明细:</div>';d.steps.forEach(function(s){var ic=s.status==='success'?'✅':(s.status==='failed'?'❌':(s.status==='skipped'?'⏭️':'⚠️'));sh+='<div style="padding:2px 0;font-size:12px">'+ic+' <b style="font-family:monospace">'+esc(s.step)+'</b> — '+esc(s.detail||'')+'</div>'})}var fh=fs?'<div style="margin-top:6px;color:var(--danger);font-size:11px">⚠ 断点: '+esc(fs)+'</div>':'';var b=document.createElement('div');b.id='logBubble';b.style.cssText='position:absolute;z-index:500;background:#fff;border:1px solid #d9d9d9;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,0.15);padding:14px 18px;max-width:480px;min-width:300px;font-size:12px;line-height:1.6';b.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-weight:600;font-size:13px">请求快照</span><a href="javascript:void(0)" onclick="document.getElementById(\'logBubble\').remove()" style="color:#999;font-size:16px;line-height:1;text-decoration:none">&times;</a></div><pre style="font-size:11px;color:#595959;white-space:pre-wrap;max-height:220px;overflow:auto;background:#fafafa;padding:8px;border-radius:4px;margin:0">'+esc(JSON.stringify(d,null,2))+'</pre>'+sh+fh;document.body.appendChild(b);var rc=el.getBoundingClientRect();var t=rc.bottom+4;var l=rc.left;if(l+480>window.innerWidth)l=window.innerWidth-490;if(t+300>window.innerHeight)t=rc.top-310;b.style.top=(t+window.scrollY)+'px';b.style.left=(l+window.scrollX)+'px';setTimeout(function(){document.addEventListener('click',function cb(e){var b=document.getElementById('logBubble');if(b&&!b.contains(e.target)){b.remove();document.removeEventListener('click',cb)}})},100)}

function renderLogPagination(total,ps,cp,fn){var tp=Math.ceil(total/ps)||1;var pg='<button '+(cp<=1?'disabled':'')+' data-p="'+(cp-1)+'">上一页</button>';var ms=5,st=Math.max(1,cp-2),ed=Math.min(tp,st+ms-1);if(ed-st<ms-1)st=Math.max(1,ed-ms+1);if(st>1){pg+='<button data-p="1">1</button>';if(st>2)pg+='<span style="padding:0 4px">...</span>';}for(var i=st;i<=ed;i++)pg+='<button class="'+(i===cp?'active':'')+'" data-p="'+i+'">'+i+'</button>';if(ed<tp){if(ed<tp-1)pg+='<span style="padding:0 4px">...</span>';pg+='<button data-p="'+tp+'">'+tp+'</button>';}pg+='<button '+(cp>=tp?'disabled':'')+' data-p="'+(cp+1)+'">下一页</button>';$('#logPagination').innerHTML=pg;$$('#logPagination button[data-p]').forEach(function(btn){btn.onclick=function(){var p=parseInt(this.getAttribute('data-p'));if(p>0&&p<=tp)fn(p)}})}
</script>
</body>
</html>
