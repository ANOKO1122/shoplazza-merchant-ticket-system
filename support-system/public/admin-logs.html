<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服后台 - 系统日志</title>
<link rel="stylesheet" href="/admin-base.css">
<script src="/admin-shell.js"></script>

<style>
.unpaid-modal{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.unpaid-card{background:#fff;border-radius:8px;width:min(640px,100%);max-height:min(78vh,720px);display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.unpaid-head{display:flex;justify-content:space-between;gap:12px;padding:16px 18px 8px}
.unpaid-title{font-size:16px;font-weight:600}
.unpaid-sub{margin-top:4px;font-size:12px;color:#8c8c8c}
.unpaid-close{border:none;background:transparent;font-size:22px;line-height:1;color:#8c8c8c;cursor:pointer;padding:0 4px}
.unpaid-stats{padding:0 18px 10px;font-size:13px;color:#595959}
.unpaid-note{margin:0 18px 10px;font-size:12px;color:#8c8c8c}
.unpaid-table-wrap{overflow:auto;border-top:1px solid #f0f0f0}
.unpaid-card table{width:100%}
.unpaid-card th,.unpaid-card td{text-align:left;padding:8px 18px}
</style>
<script src="/safe-render.js"></script>
</head>
<body>
<div id="app"><div class="login-page"><div class="login-card" style="text-align:center;color:var(--text-muted);padding:60px 36px">加载中...</div></div></div>
<script>
var API='/api/admin';var me=null;var logSubTab='sync';var syncLogPage=1;var syncLogSource='all';var syncLogAction='all';var syncLogStatus='all';var opLogPage=1;var opLogCategory='all';var opLogStatus='all';
function sd(s){return s&&s.indexOf('.')!==-1?s:s+'.myshoplaza.com'}
function $(s){return document.querySelector(s)}function $$(s){return document.querySelectorAll(s)}
function formatTime(i){if(!i)return'-';var d=new Date(i);if(isNaN(d.getTime()))return '-';var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0'),h=String(d.getHours()).padStart(2,'0'),mi=String(d.getMinutes()).padStart(2,'0'),s=String(d.getSeconds()).padStart(2,'0');return y+'-'+m+'-'+dy+' '+h+':'+mi+':'+s}
function esc(v){return SupportSafe.escape(v)}
function showToast(m,t){var d=document.createElement('div');d.className='toast '+(t||'success');d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2000)}

function logStatusDot(s){if(s==='success')return'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#52c41a;margin-right:4px;vertical-align:middle"></span>成功';if(s==='partial')return'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#faad14;margin-right:4px;vertical-align:middle"></span>部分成功';return'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d4f;margin-right:4px;vertical-align:middle"></span>失败'}
function syncSrcCN(s){var m={webhook:'Webhook',backfill:'兜底同步',api:'API补全'};return m[s]||s}
function syncActCN(a,l){var detail=l&&l.detail_json||{};var topic=detail.topic;var pay=detail.paymentStatus;if(a==='order_upsert'){if(topic==='orders/create'||pay==='waiting')a='order_unpaid';else if(topic==='orders/paid'||pay==='paid')a='order_paid'}if(a==='fulfillment_update'&&!Array.isArray(detail.changes)){if(topic==='orders/partially_fulfilled')a='order_partial';else if(topic==='orders/fulfilled')a='order_shipped'}var m={order_unpaid:'订单进入未支付',order_paid:'已支付',fulfillment_update:'物流更新',fulfillment_reconcile_summary:'物流兜底汇总',order_shipped:'已发货',order_partial:'部分发货',order_upsert:'订单更新',unpaid_summary:'未支付兜底',backfill_summary:'兜底汇总',order_list_page:'列表拉取',transaction_lookup:'交易查询',transaction_fetch:'交易查询',order_detail_fetch:'订单详情',order_detail_from_payload:'正文替代详情'};return(m[a]||a)+' ('+a+')'}
function opActionCN(a){var m={job_resent:'手动补发',jobs_send_pending:'一键发送待发',job_failed:'发送失败',job_cancelled:'取消待发',job_sent:'发送成功',store_create:'新增店铺',store_delete:'删除店铺',store_update:'修改店铺',store_toggle:'启停店铺',auto_send_toggled:'切换自动发送',auto_backfill_toggled:'切换自动查漏',backfill_store_complete:'兜底完成',backfill_auto_run:'自动兜底',ticket_status_changed:'变更工单状态',agent_reply:'客服回复',customer_reply:'顾客回复',ticket_created:'工单创建',ticket_closed:'工单关闭',email_template_updated:'更新邮件模板'};return(m[a]||a)+' ('+a+')'}
function opCategoryCN(c){var m={email:'邮件',ticket:'工单',store:'店铺',config:'配置',backfill:'兜底',webhook:'Webhook'};return m[c]||c}

(async function init(){var bootEpoch=adminEpoch();try{if(window.__adminAgent){me=window.__adminAgent;if(bootEpoch!==adminEpoch())return;renderMain();return;}var r=await fetch(API+'/me',{credentials:'same-origin'});var d=await r.json();if(bootEpoch!==adminEpoch())return;if(d.ok){me=d.agent;window.__adminAgent=me;renderMain()}else{location.replace('/login?redirect='+encodeURIComponent('/thinkpro-admin/logs'))}}catch(e){location.replace('/login?redirect='+encodeURIComponent('/thinkpro-admin/logs'))}})();async function doLogout(){await fetch(API+'/logout',{method:'POST',credentials:'same-origin'});location.replace('/login')}

function renderMain(){adminFrame('/thinkpro-admin/logs');buildLayout();loadSyncLogs()}

function buildLayout(){$('#mainArea').innerHTML='<header class="topbar"><div class="breadcrumb">首页 / <strong>系统日志</strong></div><div class="topbar-right"><button class="btn-logout" onclick="doLogout()">退出</button></div></header><div class="content"><div class="filter-bar"><button class="filter-btn active" data-log-tab="sync" onclick="switchLogTab(this,\'sync\')">同步日志</button><button class="filter-btn" data-log-tab="op" onclick="switchLogTab(this,\'op\')">操作日志</button></div><div id="logSubFilters"></div><div style="flex:1;overflow:auto"><table><thead><tr id="logThead"></tr></thead><tbody id="logTbody"></tbody></table></div><div class="pagination" id="logPagination"></div></div>'}

function switchLogTab(el,tab){logSubTab=tab;$$('.filter-btn[data-log-tab]').forEach(function(n){n.classList.remove('active')});el.classList.add('active');if(tab==='sync'){syncLogPage=1;loadSyncLogs()}else{opLogPage=1;loadOperationLogs()}}

function buildSyncFilters(){
  var sources=[['all','全部来源'],['webhook','Webhook'],['backfill','兜底'],['api','API']];
  var actions=[['all','全部动作'],['order_unpaid','订单进入未支付'],['order_paid','已支付'],['unpaid_summary','未支付兜底'],['fulfillment_update','物流更新'],['fulfillment_reconcile_summary','物流兜底汇总']];
  var statuses=[['all','全部状态'],['success','成功'],['partial','部分成功'],['failed','失败']];
  var h='<div class="filter-bar" style="border-bottom:none;padding:4px 20px;flex-wrap:wrap">';
  sources.forEach(function(item){h+='<button class="filter-btn '+(syncLogSource===item[0]?'active':'')+'" data-value="'+esc(item[0])+'" onclick="setSyncSource(this.dataset.value)">'+esc(item[1])+'</button>'});
  h+=' | ';
  actions.forEach(function(item){h+='<button class="filter-btn '+(syncLogAction===item[0]?'active':'')+'" data-value="'+esc(item[0])+'" onclick="setSyncAction(this.dataset.value)">'+esc(item[1])+'</button>'});
  h+=' | ';
  statuses.forEach(function(item){h+='<button class="filter-btn '+(syncLogStatus===item[0]?'active':'')+'" data-value="'+esc(item[0])+'" onclick="setSyncStatus(this.dataset.value)">'+esc(item[1])+'</button>'});
  return h+'</div>';
}
function buildOpFilters(){return'<div class="filter-bar" style="border-bottom:none;padding:4px 20px"><button class="filter-btn '+(opLogCategory==='all'?'active':'')+'" onclick="setOpCategory(\'all\')">全部</button><button class="filter-btn '+(opLogCategory==='email'?'active':'')+'" onclick="setOpCategory(\'email\')">邮件</button><button class="filter-btn '+(opLogCategory==='ticket'?'active':'')+'" onclick="setOpCategory(\'ticket\')">工单</button><button class="filter-btn '+(opLogCategory==='store'?'active':'')+'" onclick="setOpCategory(\'store\')">店铺</button><button class="filter-btn '+(opLogCategory==='config'?'active':'')+'" onclick="setOpCategory(\'config\')">配置</button><button class="filter-btn '+(opLogCategory==='backfill'?'active':'')+'" onclick="setOpCategory(\'backfill\')">兜底</button> | <button class="filter-btn '+(opLogStatus==='all'?'active':'')+'" onclick="setOpStatus(\'all\')">全部</button><button class="filter-btn '+(opLogStatus==='success'?'active':'')+'" onclick="setOpStatus(\'success\')"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#52c41a;margin-right:3px"></span>成功</button><button class="filter-btn '+(opLogStatus==='partial'?'active':'')+'" onclick="setOpStatus(\'partial\')"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#faad14;margin-right:3px"></span>部分</button><button class="filter-btn '+(opLogStatus==='failed'?'active':'')+'" onclick="setOpStatus(\'failed\')"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d4f;margin-right:3px"></span>失败</button><div class="search-box" style="margin-left:auto"><span class="sicon">🔍</span><input id="opLogSearch" placeholder="搜索..." onkeydown="if(event.key===\'Enter\'){opLogPage=1;loadOperationLogs()}" style="width:160px"></div></div>'}

function setSyncSource(v){syncLogSource=v;syncLogPage=1;loadSyncLogs()}function setSyncAction(v){syncLogAction=v;syncLogPage=1;loadSyncLogs()}function setSyncStatus(v){syncLogStatus=v;syncLogPage=1;loadSyncLogs()}function setOpCategory(v){opLogCategory=v;opLogPage=1;loadOperationLogs()}function setOpStatus(v){opLogStatus=v;opLogPage=1;loadOperationLogs()}

async function loadSyncLogs(){$('#logSubFilters').innerHTML=buildSyncFilters();$('#logThead').innerHTML='<th>时间</th><th>来源</th><th>动作</th><th>店铺域名</th><th>店铺名称</th><th>对象</th><th>新增</th><th>更新</th><th>跳过</th><th>摘要</th><th>耗时</th><th>状态</th><th>快照</th>';var p=new URLSearchParams();if(syncLogSource!=='all')p.set('source',syncLogSource);if(syncLogAction!=='all')p.set('action',syncLogAction);if(syncLogStatus!=='all')p.set('status',syncLogStatus);p.set('page',String(syncLogPage));p.set('page_size','30');try{var r=await fetch(API+'/sync-logs?'+p.toString(),{credentials:'same-origin'});var d=await r.json();if(!d.ok)return;renderSyncLogs(d.logs,d.total)}catch(e){}}

var syncLogById={};
function renderSyncLogs(logs,total){
  syncLogById={};
  var h='';
  logs.forEach(function(l){
    syncLogById[l.id]=l;
    var snap;
    if(l.action==='unpaid_summary'){
      snap='<a href="javascript:void(0)" style="color:var(--primary);font-size:12px;text-decoration:none" onclick="event.stopPropagation();openUnpaidDetail('+Number(l.id)+')">明细</a>';
    }else if(isFulfillmentLog(l)){
      snap='<a href="javascript:void(0)" style="color:var(--primary);font-size:12px;text-decoration:none" onclick="event.stopPropagation();openFulfillmentDetail('+Number(l.id)+')">物流明细</a>';
    }else{
      var dj=l.detail_json?JSON.stringify(l.detail_json):'{}';
      snap='<a href="javascript:void(0)" style="color:var(--primary);font-size:12px;text-decoration:none" data-detail="'+esc(dj)+'" onclick="event.stopPropagation();showLogBubble(this,this.getAttribute(\'data-detail\'))">查看</a>';
    }
    h+='<tr><td style="text-align:center;white-space:nowrap">'+formatTime(l.created_at)+'</td><td style="text-align:center">'+esc(syncSrcCN(l.source))+'</td><td style="text-align:center">'+esc(syncActCN(l.action,l))+'</td><td style="text-align:center">'+esc(sd(l.store_subdomain))+'</td><td style="text-align:center">'+esc(l.store_name||'-')+'</td><td style="text-align:center">'+esc(l.target_id||'-')+'</td><td style="text-align:center">'+esc(l.items_new||0)+'</td><td style="text-align:center">'+esc(l.items_updated||0)+'</td><td style="text-align:center">'+esc(l.items_skipped||0)+'</td><td style="max-width:320px;overflow-wrap:anywhere">'+esc(syncLogSummary(l))+'</td><td style="text-align:center">'+esc(l.duration_ms!=null?l.duration_ms+'ms':'')+'</td><td style="text-align:center;white-space:nowrap">'+logStatusDot(l.status)+'</td><td style="text-align:center">'+snap+'</td></tr>';
  });
  $('#logTbody').innerHTML=h||'<tr><td colspan="13" style="text-align:center;color:var(--text-muted);padding:40px">暂无同步日志</td></tr>';
  renderLogPagination(total,30,syncLogPage,function(p){syncLogPage=p;loadSyncLogs()});
}
function isFulfillmentLog(l){return l.action==='fulfillment_update'||l.action==='fulfillment_reconcile_summary'}
function logCount(value){var n=Number(value);return Number.isFinite(n)&&n>=0?n:0}
function logNumbers(values){return Array.isArray(values)?values.filter(function(value){return typeof value==='string'||typeof value==='number'}).map(function(value){return String(value).trim()}).filter(Boolean):[]}
function fulfillmentKindLabel(change){
  if(change.kind==='updated')return JSON.stringify(logNumbers(change.beforeTrackingNumbers))===JSON.stringify(logNumbers(change.afterTrackingNumbers))?'更新物流信息':(Array.isArray(change.retainedTrackingNumbers)?'更新当前号，旧号保留':'更新单号（旧日志）');
  return {added:'新增包裹',history_added:'补充累计号码，当前号未覆盖',stale:'过期事件，当前号未覆盖',unchanged:'重复或无变化，已跳过'}[change.kind]||change.kind||'-';
}
function syncLogSummary(l){
  var d=l.detail_json||{};
  if(l.action==='fulfillment_reconcile_summary')return '检查 '+logCount(d.checked)+' · 有变化 '+logCount(d.changed)+' · 失败 '+logCount(d.failed);
  if(l.action==='fulfillment_update'){
    if(Array.isArray(d.changes)){
      var counts={added:0,updated:0,history_added:0,stale:0,unchanged:0};
      d.changes.forEach(function(change){if(change&&Object.prototype.hasOwnProperty.call(counts,change.kind))counts[change.kind]++});
      return '新增包裹 '+counts.added+' · 更新 '+(counts.updated+counts.history_added)+' · 补充号码 '+counts.history_added+' · 过期未改当前 '+Math.max(counts.stale,logCount(d.stale))+' · 重复/无变化跳过 '+Math.max(counts.unchanged,logCount(d.unchanged));
    }
    var numbers=logNumbers(d.trackingNumbers);
    return '运单：'+(numbers.length?numbers.join(', '):(d.tracking||'无'))+'（旧日志，未记录变更明细）';
  }
  if(l.action==='unpaid_summary')return '列表 '+logCount(l.items_total)+' · 跳过 '+logCount(l.items_skipped);
  return l.error_message||'';
}
function fulfillmentDetailHtml(l){
  var d=l.detail_json||{};
  var hasHistoryDetails=Array.isArray(d.changes)&&d.changes.some(function(change){return change&&(Array.isArray(change.retainedTrackingNumbers)||Array.isArray(change.addedTrackingNumbers)||change.kind==='history_added')});
  var summary='<div class="unpaid-stats">'+esc(syncLogSummary(l))+'</div>';
  var numbers=logNumbers(d.trackingNumbers);
  if(numbers.length||d.tracking)summary+='<div class="unpaid-note">'+(hasHistoryDetails?'累计运单：':'已记录运单：')+esc(numbers.length?numbers.join(', '):d.tracking)+'</div>';
  if(d.fulfillmentCount!=null)summary+='<div class="unpaid-note">包裹 '+esc(d.fulfillmentCount)+' · 运单 '+esc(d.trackingCount==null?numbers.length:d.trackingCount)+'</div>';
  if(l.action==='fulfillment_reconcile_summary'&&d.remainingDue!=null)summary+='<div class="unpaid-note">待检查订单：'+logCount(d.remainingDue)+'</div>';
  if(l.error_message)summary+='<div class="unpaid-note" style="color:var(--danger)">'+esc(l.error_message)+'</div>';
  var orderTable='';
  if(l.action==='fulfillment_reconcile_summary'){
    if(Array.isArray(d.items)){
      var orderRows='';
      d.items.forEach(function(item){
        if(!item||typeof item!=='object')return;
        var status={changed:'有变化',unchanged:'无变化',failed:'失败'}[item.status]||item.status||'-';
        var current=logNumbers(item.trackingNumbers);
        orderRows+='<tr><td style="overflow-wrap:anywhere">'+esc(item.orderNumber||item.orderId||'-')+'</td><td>'+esc(status)+'</td><td>'+logCount(item.added)+'</td><td>'+logCount(item.updated)+'</td><td style="overflow-wrap:anywhere">'+(current.length?current.map(esc).join('<br>'):'—')+'</td><td style="overflow-wrap:anywhere">'+esc(item.error||'—')+'</td></tr>';
      });
      orderTable='<div class="unpaid-table-wrap"><table><thead><tr><th>订单号</th><th>结果</th><th>新增包裹</th><th>更新包裹</th><th>累计运单</th><th>错误</th></tr></thead><tbody>'+(orderRows||'<tr><td colspan="6" style="text-align:center;color:#8c8c8c">没有逐条订单</td></tr>')+'</tbody></table></div>';
    }else summary+='<div class="unpaid-note">这条汇总未保存逐条订单明细。</div>';
  }
  var rows='';
  if(Array.isArray(d.changes)){
    d.changes.forEach(function(change){
      if(!change||typeof change!=='object')return;
      var before=logNumbers(change.beforeTrackingNumbers),after=logNumbers(change.afterTrackingNumbers);
      var retained=logNumbers(change.retainedTrackingNumbers),added=logNumbers(change.addedTrackingNumbers);
      var retainedText=Array.isArray(change.retainedTrackingNumbers)?(retained.length?retained.map(esc).join('<br>'):'—'):'未记录';
      var addedText=Array.isArray(change.addedTrackingNumbers)?(added.length?added.map(esc).join('<br>'):'—'):'未记录';
      rows+='<tr><td style="overflow-wrap:anywhere">'+esc(change.fulfillmentId||'-')+'</td><td>'+esc(fulfillmentKindLabel(change))+'</td><td style="overflow-wrap:anywhere">'+(before.length?before.map(esc).join('<br>'):'—')+'</td><td style="overflow-wrap:anywhere">'+(after.length?after.map(esc).join('<br>'):'—')+'</td><td style="overflow-wrap:anywhere">'+retainedText+'</td><td style="overflow-wrap:anywhere">'+addedText+'</td></tr>';
    });
    summary+='<div class="unpaid-note">'+(hasHistoryDetails?'同一包裹累计保留收到的号码；晚到消息可补充号码，但不会覆盖当前号。“本次号码”表示消息携带的号码，累计和新增号码以对应列为准。':'这条旧日志只记录了变更前后号码；累计号码和新增号码未记录时显示“未记录”。')+'</div>';
  }else if(l.action==='fulfillment_update'){
    summary+='<div class="unpaid-note">这条旧日志未保存包裹 ID 和变更前后的运单号。</div>';
  }
  var table=rows?'<div class="unpaid-table-wrap"><table><thead><tr><th>包裹 ID</th><th>处理结果</th><th>原当前号</th><th>本次号码</th><th>累计号码</th><th>本次新增号码</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'';
  return summary+orderTable+table+'<details style="padding:12px 18px;overflow:auto"><summary style="cursor:pointer">原始快照</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px">'+esc(JSON.stringify(d,null,2))+'</pre></details>';
}
function openFulfillmentDetail(id){
  var l=syncLogById[id];if(!l)return;
  var old=document.getElementById('logBubble');if(old)old.remove();
  var box=document.createElement('div');box.id='logBubble';box.className='unpaid-modal';
  box.innerHTML='<div class="unpaid-card" style="width:min(900px,100%);overflow:auto" role="dialog"><div class="unpaid-head"><div><div class="unpaid-title">'+(l.action==='fulfillment_reconcile_summary'?'物流兜底汇总':'物流变更明细')+'</div><div class="unpaid-sub">'+esc(l.store_name||'-')+' · '+esc(syncSrcCN(l.source))+' · '+esc(l.target_id||'-')+' · '+formatTime(l.created_at)+'</div></div><button type="button" class="unpaid-close" onclick="closeFulfillmentDetail()">×</button></div>'+fulfillmentDetailHtml(l)+'</div>';
  box.addEventListener('click',function(e){if(e.target===box)closeFulfillmentDetail()});document.body.appendChild(box);
}
function closeFulfillmentDetail(){var box=document.getElementById('logBubble');if(box)box.remove()}

function unpaidKindCN(k){var m={new:'新写入',updated:'更新',kept:'已支付未覆盖',skipped:'无邮箱跳过'};return m[k]||k||'-'}
function openUnpaidDetail(id){var l=syncLogById[id];if(!l)return;var embedded=l.detail_json&&Array.isArray(l.detail_json.orders)?l.detail_json.orders:null;if(embedded){showUnpaidModal(l,embedded,false);return}showUnpaidModal(l,null,true);fetch(API+'/sync-logs/'+id+'/items',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(d){if(!d.ok){showUnpaidModal(l,[],true,d.error||'加载失败');return}showUnpaidModal(l,d.orders||[],!!d.legacy)}).catch(function(){showUnpaidModal(l,[],true,'网络错误')})}
function showUnpaidModal(l,orders,legacy,errorText){var old=document.getElementById('unpaidModal');if(old)old.remove();var rows='';if(errorText){rows='<tr><td colspan="2" style="text-align:center;color:#ff4d4f;padding:24px">'+esc(errorText)+'</td></tr>'}else if(!orders){rows='<tr><td colspan="2" style="text-align:center;color:#8c8c8c;padding:24px">加载中...</td></tr>'}else if(!orders.length){rows='<tr><td colspan="2" style="text-align:center;color:#8c8c8c;padding:24px">没有逐条订单</td></tr>'}else{orders.forEach(function(o){rows+='<tr><td>'+esc(o.orderNumber)+'</td><td>'+esc(unpaidKindCN(o.kind))+'</td></tr>'})}var note=legacy&&Number(l.items_skipped)>0?'<div class="unpaid-note">更早的记录里，无邮箱跳过的订单没有逐条留下，只计在跳过数中。</div>':'';var box=document.createElement('div');box.id='unpaidModal';box.className='unpaid-modal';box.innerHTML='<div class="unpaid-card" role="dialog"><div class="unpaid-head"><div><div class="unpaid-title">未支付兜底明细</div><div class="unpaid-sub">'+esc(l.store_name||'-')+' · '+esc(sd(l.store_subdomain||''))+' · '+formatTime(l.created_at)+'</div></div><button type="button" class="unpaid-close" onclick="closeUnpaidModal()">×</button></div><div class="unpaid-stats">列表 '+esc((l.items_total||0))+' · 新写入 '+esc((l.items_new||0))+' · 更新 '+esc((l.items_updated||0))+' · 跳过 '+esc((l.items_skipped||0))+'</div>'+note+'<div class="unpaid-table-wrap"><table><thead><tr><th>订单号</th><th>结果</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';box.addEventListener('click',function(e){if(e.target===box)closeUnpaidModal()});document.body.appendChild(box)}
function closeUnpaidModal(){var n=document.getElementById('unpaidModal');if(n)n.remove()}

async function loadOperationLogs(){$('#logSubFilters').innerHTML=buildOpFilters();$('#logThead').innerHTML='<th>时间</th><th>分类</th><th>操作</th><th>操作人</th><th>店铺</th><th>对象</th><th>摘要</th><th>状态</th><th>快照</th>';var p=new URLSearchParams();if(opLogCategory!=='all')p.set('category',opLogCategory);if(opLogStatus!=='all')p.set('status',opLogStatus);var q=($('#opLogSearch')||{}).value||'';if(q)p.set('q',q);p.set('page',String(opLogPage));p.set('page_size','30');try{var r=await fetch(API+'/operation-logs?'+p.toString(),{credentials:'same-origin'});var d=await r.json();if(!d.ok)return;renderOperationLogs(d.logs,d.total)}catch(e){}}

function renderOperationLogs(logs,total){var h='';logs.forEach(function(l){var dj=l.detail_json?JSON.stringify(l.detail_json):'{}';var dm=l.store_subdomain?sd(l.store_subdomain):'-';h+='<tr><td style="text-align:center;white-space:nowrap">'+formatTime(l.created_at)+'</td><td style="text-align:center">'+esc(opCategoryCN(l.category))+'</td><td style="text-align:center">'+esc(opActionCN(l.action))+'</td><td style="text-align:center">'+esc(l.actor)+'</td><td style="text-align:center">'+esc(dm)+'</td><td style="text-align:center">'+esc(l.target||'-')+'</td><td style="text-align:center">'+esc(l.summary)+'</td><td style="text-align:center;white-space:nowrap">'+logStatusDot(l.status)+'</td><td style="text-align:center"><a href="javascript:void(0)" style="color:var(--primary);font-size:12px;text-decoration:none" data-detail="'+esc(dj)+'" data-failed-step="'+esc(l.failed_at_step||'')+'" onclick="event.stopPropagation();showLogBubble(this,this.getAttribute(\'data-detail\'),this.getAttribute(\'data-failed-step\'))">查看</a></td></tr>'});$('#logTbody').innerHTML=h||'<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:40px">暂无操作日志</td></tr>';renderLogPagination(total,30,opLogPage,function(p){opLogPage=p;loadOperationLogs()})}

function showLogBubble(el,djStr,fs){var old=document.getElementById('logBubble');if(old)old.remove();var d={};try{d=JSON.parse(djStr)}catch(e){}var sh='';if(d.steps&&Array.isArray(d.steps)){sh='<div style="font-weight:600;margin:10px 0 6px;border-top:1px solid #e8e8e8;padding-top:8px">步骤明细:</div>';d.steps.forEach(function(s){var ic=s.status==='success'?'✅':(s.status==='failed'?'❌':(s.status==='skipped'?'⏭️':'⚠️'));sh+='<div style="padding:2px 0;font-size:12px">'+ic+' <b style="font-family:monospace">'+esc(s.step)+'</b> — '+esc(s.detail||'')+'</div>'})}var fh=fs?'<div style="margin-top:6px;color:var(--danger);font-size:11px">⚠ 断点: '+esc(fs)+'</div>':'';var b=document.createElement('div');b.id='logBubble';b.style.cssText='position:absolute;z-index:500;background:#fff;border:1px solid #d9d9d9;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,0.15);padding:14px 18px;max-width:480px;min-width:300px;font-size:12px;line-height:1.6';b.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-weight:600;font-size:13px">请求快照</span><a href="javascript:void(0)" onclick="document.getElementById(\'logBubble\').remove()" style="color:#999;font-size:16px;line-height:1;text-decoration:none">&times;</a></div><pre style="font-size:11px;color:#595959;white-space:pre-wrap;max-height:220px;overflow:auto;background:#fafafa;padding:8px;border-radius:4px;margin:0">'+esc(JSON.stringify(d,null,2))+'</pre>'+sh+fh;document.body.appendChild(b);var rc=el.getBoundingClientRect();var t=rc.bottom+4;var l=rc.left;if(l+480>window.innerWidth)l=window.innerWidth-490;if(t+300>window.innerHeight)t=rc.top-310;b.style.top=(t+window.scrollY)+'px';b.style.left=(l+window.scrollX)+'px';setTimeout(function(){document.addEventListener('click',function cb(e){var b=document.getElementById('logBubble');if(b&&!b.contains(e.target)){b.remove();document.removeEventListener('click',cb)}})},100)}

function renderLogPagination(total,ps,cp,fn){var tp=Math.ceil(total/ps)||1;var pg='<span class="pager-total">共 '+esc(total)+' 条</span><button '+(cp<=1?'disabled':'')+' data-p="'+(cp-1)+'">上一页</button>';var ms=5,st=Math.max(1,cp-2),ed=Math.min(tp,st+ms-1);if(ed-st<ms-1)st=Math.max(1,ed-ms+1);if(st>1){pg+='<button data-p="1">1</button>';if(st>2)pg+='<span style="padding:0 4px">...</span>';}for(var i=st;i<=ed;i++)pg+='<button class="'+(i===cp?'active':'')+'" data-p="'+i+'">'+i+'</button>';if(ed<tp){if(ed<tp-1)pg+='<span style="padding:0 4px">...</span>';pg+='<button data-p="'+tp+'">'+tp+'</button>';}pg+='<button '+(cp>=tp?'disabled':'')+' data-p="'+(cp+1)+'">下一页</button>';$('#logPagination').innerHTML=pg;$$('#logPagination button[data-p]').forEach(function(btn){btn.onclick=function(){var p=parseInt(this.getAttribute('data-p'));if(p>0&&p<=tp)fn(p)}})}
</script>
</body>
</html>
