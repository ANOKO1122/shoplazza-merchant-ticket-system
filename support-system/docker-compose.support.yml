services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: support_user
      POSTGRES_PASSWORD: support_password
      POSTGRES_DB: support_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - support_net

  mailpit:
    image: axllent/mailpit:latest
    restart: always
    environment:
      MP_WEBROOT: "/mailpit"
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - support_net

  support-bridge:
    build: .
    image: support-bridge:local
    restart: always
    ports:
      - "4001:4001"
    depends_on:
      - postgres
      - mailpit
    env_file:
      - .env
    volumes:
      # 图片持久化：宿主机 ./uploads 目录映射到容器内 /app/public/uploads
      # 确保 docker compose down 重建容器后用户上传的图片不丢失
      - ./uploads:/app/public/uploads
    networks:
      - support_net

  # 独立 nginx 入口（不共用其他系统的 nginx，完全隔离）
  support-nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "4000:80"
      - "8443:443"
    volumes:
      - ./nginx/support-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - support-bridge
    networks:
      - support_net

volumes:
  pgdata:

networks:
  support_net:
    driver: bridge
