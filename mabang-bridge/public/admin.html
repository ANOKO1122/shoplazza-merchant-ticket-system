<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>店匠店铺管理</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { font-size: 1.35rem; }
    .card { border: 1px solid #ccc; border-radius: 10px; padding: 1rem 1.25rem; margin: 1rem 0; }
    label { display: block; font-size: 0.85rem; margin-top: 0.75rem; color: #555; }
    input[type="text"], input[type="password"] { width: 100%; max-width: 100%; box-sizing: border-box; padding: 0.45rem 0.55rem; margin-top: 0.2rem; }
    button { margin-top: 0.75rem; padding: 0.45rem 0.9rem; cursor: pointer; border-radius: 6px; border: 1px solid #888; background: #f4f4f4; }
    button.primary { background: #2563eb; color: #fff; border-color: #1d4ed8; }
    button.danger { background: #dc2626; color: #fff; border-color: #b91c1c; }
    .err { color: #b91c1c; font-size: 0.9rem; margin-top: 0.5rem; }
    .muted { color: #666; font-size: 0.85rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 0.5rem; }
    th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #ddd; }
    .row-actions button { margin-top: 0; margin-right: 0.35rem; font-size: 0.8rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loginPanel" class="card">
    <h1>店匠店铺管理 · 登录</h1>
    <p class="muted">请输入管理员密码。若配置了 <code>BRIDGE_ADMIN_PASSWORD</code>，须为 <strong>10–16 位</strong>且含<strong>字母与数字</strong>；未配置时与 <code>BRIDGE_ADMIN_TOKEN</code> 一致。</p>
    <label for="pw">密码</label>
    <input type="password" id="pw" autocomplete="current-password" />
    <button type="button" class="primary" id="btnLogin">登录</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="appPanel" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
      <h1 style="margin:0">店匠店铺列表</h1>
      <div style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center;">
        <a href="/admin/audit-logs/ui" class="muted" style="text-decoration:underline">审计日志</a>
        <button type="button" id="btnLogout">退出登录</button>
      </div>
    </div>
    <p class="muted">子域可填 <code>xxx</code> 或 <code>xxx.myshoplaza.com</code>，保存时会自动规范化。</p>

    <div class="card">
      <h2 style="font-size:1rem;margin:0 0 0.5rem">添加 / 覆盖</h2>
      <label for="addSub">子域 subdomain</label>
      <input type="text" id="addSub" placeholder="yourstore" />
      <label for="addTok">Access Token</label>
      <input type="text" id="addTok" placeholder="店匠 OpenAPI Token" autocomplete="off" />
      <label for="addLab">展示名 label（可选）</label>
      <input type="text" id="addLab" placeholder="旗舰店" />
      <button type="button" class="primary" id="btnAdd">保存店铺</button>
      <div class="err" id="addErr"></div>
    </div>

    <div class="card">
      <h2 style="font-size:1rem;margin:0 0 0.5rem">已配置店铺</h2>
      <div id="listMsg" class="muted">加载中…</div>
      <div id="tableWrap" class="hidden">
        <table>
          <thead><tr><th>子域</th><th>label</th><th>Token 预览</th><th>操作</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var base = '';
      function api(path, opt) {
        opt = opt || {};
        opt.credentials = 'include';
        opt.headers = opt.headers || {};
        if (opt.body && typeof opt.body === 'object' && !(opt.body instanceof FormData)) {
          opt.headers['Content-Type'] = 'application/json';
          opt.body = JSON.stringify(opt.body);
        }
        return fetch(base + path, opt).then(function (r) {
          return r.text().then(function (t) {
            var j = null;
            try { j = t ? JSON.parse(t) : null; } catch (e) {}
            return { ok: r.ok, status: r.status, json: j, text: t };
          });
        });
      }

      function showLogin() {
        document.getElementById('loginPanel').classList.remove('hidden');
        document.getElementById('appPanel').classList.add('hidden');
      }
      function showApp() {
        document.getElementById('loginPanel').classList.add('hidden');
        document.getElementById('appPanel').classList.remove('hidden');
      }

      function setErr(id, msg) {
        var el = document.getElementById(id);
        el.textContent = msg || '';
      }

      function loadList() {
        setErr('addErr', '');
        var lm = document.getElementById('listMsg');
        var tw = document.getElementById('tableWrap');
        var tb = document.getElementById('tbody');
        lm.textContent = '加载中…';
        tw.classList.add('hidden');
        tb.innerHTML = '';
        api('/admin/stores').then(function (res) {
          if (res.status === 401) {
            showLogin();
            return;
          }
          if (!res.ok || !res.json) {
            lm.textContent = '加载失败: ' + (res.text || res.status);
            return;
          }
          var stores = res.json.stores || [];
          if (stores.length === 0) {
            lm.textContent = '暂无店铺（可使用上方表单添加，或先运行迁移脚本）。';
            return;
          }
          lm.textContent = '';
          tw.classList.remove('hidden');
          stores.forEach(function (s) {
            var tr = document.createElement('tr');
            tr.innerHTML =
              '<td>' + escapeHtml(s.subdomain) + '</td>' +
              '<td>' + escapeHtml(s.label || '—') + '</td>' +
              '<td>' + escapeHtml(s.accessTokenPreview || '') + '</td>' +
              '<td class="row-actions">' +
              '<button type="button" data-edit="' + escapeAttr(s.subdomain) + '" data-label="' + escapeAttr(s.label || '') + '">编辑</button>' +
              '<button type="button" data-verify="' + escapeAttr(s.subdomain) + '">验证</button>' +
              '<button type="button" data-del="' + escapeAttr(s.subdomain) + '">删除</button>' +
              '</td>';
            tb.appendChild(tr);
          });
          tb.querySelectorAll('[data-edit]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var sub = btn.getAttribute('data-edit');
              if (!sub) return;
              var oldLabel = btn.getAttribute('data-label') || '';
              var nextLabel = prompt('请输入新的 label（留空表示清空）', oldLabel);
              if (nextLabel === null) return;
              var tokRaw = prompt('请输入新的 Access Token（留空表示不修改）', '');
              if (tokRaw === null) return;
              var body = { label: nextLabel.trim() || null };
              var tok = tokRaw.trim();
              if (tok) body.accessToken = tok;
              api('/admin/stores/' + encodeURIComponent(sub), { method: 'PUT', body: body }).then(function (res2) {
                if (res2.status === 401) { showLogin(); return; }
                if (!res2.ok) {
                  alert('修改失败: ' + (res2.json && res2.json.message || res2.text));
                  return;
                }
                loadList();
              });
            });
          });
          tb.querySelectorAll('[data-del]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var sub = btn.getAttribute('data-del');
              if (!sub || !confirm('确定删除店铺「' + sub + '」？')) return;
              api('/admin/stores/' + encodeURIComponent(sub), { method: 'DELETE' }).then(function (res2) {
                if (res2.status === 401) { showLogin(); return; }
                if (!res2.ok) {
                  alert('删除失败: ' + (res2.json && res2.json.message || res2.text));
                  return;
                }
                loadList();
              });
            });
          });
          tb.querySelectorAll('[data-verify]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var sub = btn.getAttribute('data-verify');
              if (!sub) return;
              var oldText = btn.textContent;
              btn.disabled = true;
              btn.textContent = '验证中...';
              api('/admin/stores/' + encodeURIComponent(sub) + '/verify', { method: 'POST' }).then(function (res2) {
                if (res2.status === 401) { showLogin(); return; }
                if (res2.ok) {
                  alert('✅ ' + sub + ' 验证通过');
                  return;
                }
                var msg = (res2.json && res2.json.message) || res2.text || ('HTTP ' + res2.status);
                alert('❌ ' + sub + ' 验证失败：' + msg);
              }).finally(function () {
                btn.disabled = false;
                btn.textContent = oldText || '验证';
              });
            });
          });
        });
      }

      function escapeHtml(s) {
        if (s == null) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
      function escapeAttr(s) {
        return escapeHtml(s).replace(/'/g, '&#39;');
      }

      document.getElementById('btnLogin').addEventListener('click', function () {
        setErr('loginErr', '');
        var pw = document.getElementById('pw').value;
        api('/admin/session/login', { method: 'POST', body: { password: pw } }).then(function (res) {
          if (!res.ok) {
            setErr('loginErr', res.json && res.json.error === 'invalid_password' ? '密码错误' : (res.text || '登录失败'));
            return;
          }
          document.getElementById('pw').value = '';
          showApp();
          loadList();
        });
      });

      document.getElementById('btnLogout').addEventListener('click', function () {
        api('/admin/session/logout', { method: 'POST' }).then(function () {
          showLogin();
        });
      });

      document.getElementById('btnAdd').addEventListener('click', function () {
        setErr('addErr', '');
        var body = {
          subdomain: document.getElementById('addSub').value.trim(),
          accessToken: document.getElementById('addTok').value.trim(),
          label: document.getElementById('addLab').value.trim() || undefined
        };
        if (!body.subdomain || !body.accessToken) {
          setErr('addErr', '请填写子域与 Access Token');
          return;
        }
        api('/admin/stores', { method: 'POST', body: body }).then(function (res) {
          if (res.status === 401) { showLogin(); return; }
          if (!res.ok) {
            setErr('addErr', (res.json && res.json.message) || res.text || '保存失败');
            return;
          }
          document.getElementById('addSub').value = '';
          document.getElementById('addTok').value = '';
          document.getElementById('addLab').value = '';
          loadList();
        });
      });

      api('/admin/stores').then(function (res) {
        if (res.status === 401 || res.status === 503) {
          showLogin();
          if (res.status === 503 && res.json) setErr('loginErr', res.json.message || '管理功能未配置');
          return;
        }
        if (res.ok) {
          showApp();
          loadList();
        } else {
          showLogin();
        }
      });
    })();
  </script>
</body>
</html>
